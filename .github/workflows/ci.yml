# Typecheck and tests for every pull request into zirma and every push to it (docs/WORKFLOW.md §6).
# A pull request that only touches docs/, prototype/ or a Markdown file at the root skips them: `check` is then
# reported as skipped, which branch protection counts as passed, so it can be merged at once.
# A pull request that changes migrations.lock.json (a new migration) fails `check` until it has the `reviewed` label,
# which the owner adds after reading the whole diff (docs/WORKFLOW.md §2 step 6). Adding or removing a label runs CI
# again, so the label takes effect without a new push.
name: CI

on:
  pull_request:
    branches: [zirma]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [zirma]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Did anything besides docs change?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # A push to zirma is always checked in full.
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$BASE...HEAD")
          echo "$changed"
          code=$(echo "$changed" | grep -Ev '^(docs/|prototype/)|^[^/]+\.md$' | grep -c . || true)
          if [ "$code" -gt 0 ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$changed" | grep -qx 'migrations.lock.json'; then echo "migrations=true" >> "$GITHUB_OUTPUT"; else echo "migrations=false" >> "$GITHUB_OUTPUT"; fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      # The tests never start Electron; its binary is only needed to package the app.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: A new migration needs the reviewed label
        if: github.event_name == 'pull_request' && needs.changes.outputs.migrations == 'true' && !contains(github.event.pull_request.labels.*.name, 'reviewed')
        run: |
          echo "::error::This pull request adds a migration (migrations.lock.json changed). Read the whole diff, then add the 'reviewed' label; CI runs again by itself."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
