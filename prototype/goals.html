<!doctype html>
<!--
  Zirma: a long-term goal and the place where you work toward it. A prototype for docs/design/goals.md (v0.2):
  no build step, sample goals, and scripts in place of the folder on disk, the model and the video player.
  The question it asks: can one place carry a goal from "what is this, even" to showing up every day?
    New goal     you write the goal. Zirma does not draft a plan; it goes to look the thing up.
    Big picture  its own tab: one whole thing, explained. First the whole in plain words (what it is, and why),
                 then a board so the whole stays in view: a column a part, a short row a topic. Pressing a row
                 does not list facts; it explains two things as to someone hearing it for the first time: what it
                 is, and why. "A little more detail" where there is more. After that the questions are yours, in
                 the line at the bottom; each answer stays on that topic. Nothing is tracked here: no "I know
                 this", no counts, no switch, nothing to fill in.
    Route        its own tab: how to get there, a step at a time. It explains before it lists, like the big
                 picture. You ask how people usually get there; Zirma tells two or three ways in plain words, each
                 with what it costs, none recommended; you take one or bring your own. Only the stage at hand is
                 laid out. Pressing a step explains two things: what you do, and why this step; under it, what you
                 can use from the web, which you put on the desk yourself. Nothing to confirm on the way. Deadline
                 and pace sit at the bottom, for when you want them; goals here are long ones (months, a year).
    Goal card    press the goal line on top of any page: the goal in your words and why you want it.
    Desk         the material in the middle (a video, a text, a pointer), Zirma beside it with two tabs: Ask and
                 Notes. It can see where you are (the minute of the video and its captions, the selected sentence).
                 The video here is a stand-in that only runs a clock and sample captions.
    Close        "That's it for today": what changed, a question left for next time, when next time is.
    Record       NOT in the first round (decided 2026-11-27: do the important parts first). Left here as a sketch:
                 a heat map (a square a day, brighter when you finished a step, a dot under each week that met your pace),
                 the date you would arrive, every sitting. No streak count, and brightness is not by the minute.
    Timer        beside the gear in the top bar: digits only. You set hours, minutes and seconds, or no timer.
                 Start counts five down on the button itself; press again to go now.
    No testing   Zirma is not a teacher here: no practice page, no quizzes, nothing comes back due. Whether a
                 step is done is your word (a quiet button), never asked for.
  Play: "It is time" (the cue), "Fell behind" (three choices with what each costs).
  ?scene=new|picture|route|desk|record  ?goal=la|job  ?lang=en  ?scheme=dark  ?bare hides the strip.
  Borrowed: the mode's telescope icon is from Tabler Icons (MIT, © 2020-2024 Paweł Kuna); see the ICON table and THIRD-PARTY-NOTICES.md.
  Desktop first (decided 2026-11-26): the phone layout under 760px is left from earlier rounds and is no longer kept up.
-->

<style>

}

/* ── The prototype's own strip ── */

/* ── Shell: top bar over sidebar | page | Zirma ── */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr) auto; grid-template-rows: 52px minmax(0, 1fr); }

.lights { display: flex; gap: 8px; margin-right: 6px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }

.side { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; padding: 10px 8px 12px; background: var(--paper); border-right: 1px solid var(--line-soft); position: relative; }

/* A step's state: drawn in shapes, so it never rests on colour alone. */

/* ── The page ── */

.btn { min-height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); color: var(--copy); font-size: .8125rem; white-space: nowrap; }
.btn:hover { color: var(--ink); }
.btn.solid { background: var(--alf-solid); color: var(--on-alf); box-shadow: none; font-weight: 550; }

.head { padding: 30px 0 4px; }

.row { position: relative; width: calc(100% + 20px); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; padding: 10px 10px; margin: 0 -10px; border-radius: 12px; }

.ps { padding-top: 30px; scroll-margin-top: 56px; }

.more { margin: 6px 0 0 14px !important; padding-left: 12px; border-left: 2px solid var(--line); color: var(--copy); font-size: .9375rem !important; }
.ownrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.ownrow input { flex: 1 1 200px; min-width: 0; height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); outline: none; font-size: .875rem; }
.ownrow input:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }

/* The big picture as a map of parts */
.whyline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 14px; font-size: .9375rem; overflow-wrap: anywhere; }

.block { margin-top: 18px; padding: 18px 20px; border-radius: 16px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); }

/* The big picture as a board: a column a part, a short row a topic */

.sitem + .sitem { box-shadow: 0 -1px 0 var(--line-soft); }
.sitem[data-fresh] { background: var(--alf-soft); }
.srow { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 10px; border-radius: 12px; text-align: left; }
.srow:hover { background: var(--wash); }
.srow .rt { font-weight: 550; overflow-wrap: anywhere; }
.srow .re { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .75rem; white-space: nowrap; }
.sdetail { padding: 0 10px 18px 36px; }
.sdetail .eli h4:first-child { margin-top: 4px; }
.resbox { margin-top: 16px; }
.resbox h4 { margin-bottom: 4px; color: var(--muted); font-size: .75rem; font-weight: 600; }
.rrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 0; font-size: .9375rem; }
.rrow > span:first-of-type { flex: 1 1 240px; min-width: 0; overflow-wrap: anywhere; }
.rrow svg.i { width: 16px; height: 16px; color: var(--muted); }
.pop.big { width: min(680px, 100%); padding: 32px 34px 28px; gap: 18px; }
.pop.big h3 { font-size: 1.375rem; }
.pop.big #gc-goal { min-height: 0; font-size: 1.25rem; font-weight: 600; line-height: 1.5; }
.pop.big #gc-why { min-height: 160px; font-size: 1rem; }

/* New goal */
.newp { padding: 9vh 0 0; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.newp .fig { width: 64px; height: 64px; }
.newp h2 { font-family: var(--serif); font-size: 1.625rem; font-weight: 500; line-height: 1.3; }
.newp > p { color: var(--muted); font-size: .875rem; max-width: 34em; }
.compose { width: 100%; margin-top: 10px; display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 14px; border-radius: 16px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); text-align: left; }
.compose:focus-within { box-shadow: inset 0 0 0 1.5px var(--ink); }
.compose textarea { flex: 1; min-width: 0; min-height: 28px; max-height: 30vh; padding: 5px 0; border: 0; resize: none; background: none; outline: none; line-height: 1.5; }
.compose textarea::placeholder { color: var(--muted); }
.send { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--bg); }
.send svg.i { width: 16px; height: 16px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.chip { min-height: 28px; display: inline-flex; align-items: center; padding: 3px 11px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); color: var(--copy); font-size: .8125rem; text-align: left; }
.chip:hover { color: var(--ink); background: var(--wash); }
.working { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .875rem; }
.working .fig { width: 24px; height: 24px; }

/* Big picture */
.wv { padding-top: 26px; }
.wv-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding-bottom: 8px; }
.wv-h h3 { font-size: 1.125rem; font-weight: 650; }
.wv p { color: var(--copy); font-size: 1rem; line-height: 1.8; overflow-wrap: anywhere; }
.wv p + p { margin-top: .8em; }
.wv sup { margin-left: 2px; color: var(--alf); font: .6875rem var(--mono); }
.unsure { text-decoration: underline dashed; text-decoration-color: var(--warm); text-underline-offset: 4px; }
.mine { padding: 10px 14px; border-radius: 12px; background: var(--wash); color: var(--ink); }
.wv textarea { width: 100%; min-height: 84px; padding: 10px 12px; border: 0; border-radius: 12px; resize: vertical; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); outline: none; line-height: 1.6; }
.wv textarea:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }
.wv .acts { margin-top: 12px; }
.srcs { margin-top: 30px; padding-top: 14px; box-shadow: 0 -1px 0 var(--line-soft); color: var(--muted); font-size: .8125rem; line-height: 1.8; }
.srcs li { overflow-wrap: anywhere; }
.srcs b { margin-right: 6px; color: var(--alf); font: .75rem var(--mono); }
.skel { height: 12px; margin: 10px 0; border-radius: 6px; background: var(--wash); }

/* Approaches: side by side, none marked as the one to take. */
.ways { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.way { display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 14px; border-radius: 14px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); }
.way h4 { font-size: 1rem; font-weight: 650; overflow-wrap: anywhere; }
.way dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 10px; font-size: .8125rem; }
.way dt { color: var(--muted); }
.way dd { color: var(--copy); overflow-wrap: anywhere; }
.way .btn { margin-top: auto; align-self: flex-start; }
.calc { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); }
.calc .line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.calc .line > span:first-child { flex: none; width: 4.2em; color: var(--muted); font-size: .8125rem; }
.calc .res { font-weight: 600; overflow-wrap: anywhere; }
.calc .res[data-late] { color: var(--k-text); }

/* Desk */
.opening { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 28px; background: var(--alf-soft); font-size: .875rem; }
.opening .w { flex: 1 1 240px; min-width: 0; overflow-wrap: anywhere; }
.opening .w b { font-weight: 600; }
.tabs { flex: none; display: flex; align-items: center; gap: 4px; padding: 10px 28px 0; overflow-x: auto; }
.tab { flex: none; height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; color: var(--copy); font-size: .8125rem; white-space: nowrap; }
.tab:hover { background: var(--wash); }
.tab[aria-selected="true"] { background: var(--pick); color: var(--on-pick); }
.tab svg.i { width: 15px; height: 15px; }
.player { margin-top: 18px; border-radius: 16px; overflow: hidden; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); }
.screen { aspect-ratio: 16 / 9; max-height: 46vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px 28px; background: var(--wash); text-align: center; }
.screen .cap { max-width: 30em; color: var(--ink); font-size: 1.1875rem; line-height: 1.6; font-weight: 550; overflow-wrap: anywhere; }
.screen small { color: var(--muted); font-size: .75rem; }
.ctrl { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.playb { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--bg); }
.playb svg.i { width: 16px; height: 16px; }
.track { flex: 1; min-width: 60px; height: 22px; display: flex; align-items: center; cursor: pointer; }
.track i { display: block; width: 100%; height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--copy) var(--at, 0%), var(--line) var(--at, 0%)); }
.time { flex: none; color: var(--muted); font: .75rem var(--mono); }
.vtitle { padding: 14px 0 0; }
.vtitle b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.reader { padding: 18px 0 20px; font-size: 1.0625rem; line-height: 1.85; color: var(--copy); }
.reader h2 { margin-bottom: 6px; color: var(--ink); font-size: 1.625rem; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; }
.reader .askq { margin: 0 0 18px; color: var(--ink); font-family: var(--serif); font-size: 1.1875rem; line-height: 1.6; }
.reader p + p { margin-top: 1.1em; }
.reader ::selection, .wv ::selection { background: color-mix(in oklch, var(--alf) 24%, transparent); }
.blind { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; padding: 18px 18px 16px; border-radius: 16px; border: 1px dashed var(--line); }
.blind h4 { font-size: 1rem; font-weight: 650; overflow-wrap: anywhere; }
.blind p { color: var(--copy); font-size: .875rem; overflow-wrap: anywhere; }

/* The card beside a selection */
#float { position: fixed; z-index: 60; }
.selbar { display: flex; gap: 2px; padding: 4px; border-radius: 12px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow); }
.selbar button { height: 30px; padding: 0 11px; border-radius: 8px; font-size: .8125rem; white-space: nowrap; }
.selbar button:hover { background: color-mix(in oklch, var(--bg) 18%, transparent); }
.ans { width: min(360px, calc(100vw - 24px)); display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 16px; background: var(--raise); box-shadow: var(--shadow), inset 0 0 0 1px var(--line-soft); }
.ans q { quotes: none; padding-left: 10px; border-left: 2px solid var(--alf); color: var(--muted); font-size: .8125rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ans p { min-height: 3.2em; color: var(--ink); font-size: .9375rem; line-height: 1.65; }
.ans .acts .btn { min-height: 28px; padding: 0 11px; font-size: .75rem; }

/* Record: a square a day, a column a week; under each column, whether the week met the pace you set. */
.heat { display: flex; gap: 3px; align-items: flex-start; overflow-x: auto; padding-bottom: 2px; }
.heat .hd, .heat .hc { flex: none; display: grid; grid-auto-rows: 15px; gap: 3px; }
.heat .hd { margin-right: 4px; color: var(--muted); font-size: .6875rem; line-height: 15px; }
.hm { display: block; width: 15px; height: 15px; border-radius: 4px; background: var(--wash); }
.hm[data-l="1"] { background: color-mix(in oklch, var(--ok) 38%, transparent); }
.hm[data-l="2"] { background: var(--ok); }
.hm[data-l="x"] { background: none; box-shadow: inset 0 0 0 1px var(--line-soft); }
.wk { display: block; width: 7px; height: 7px; margin: 3px auto 0; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); }
.wk.met { background: var(--copy); box-shadow: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; color: var(--muted); font-size: .75rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .wk { margin: 0; }
/* The countdown: digits only, beside the gear. */
.tset { display: inline-flex; align-items: flex-start; gap: 6px; }
.tset[data-on="false"] .tf, .tset[data-on="false"] > b { opacity: .4; }
.tf { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: .6875rem; }
.tset > b { line-height: 28px; color: var(--muted); font-family: var(--mono); }
.tset input { width: 2.7em; height: 28px; padding: 0 4px; border: 0; border-radius: 7px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); text-align: center; font: 600 .875rem var(--mono); outline: none; }
.tset input:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }
.tset .unit { color: var(--copy); font-size: .8125rem; }
.tset .linkish { margin-left: 8px; line-height: 28px; white-space: nowrap; }
.ib.sm { width: 26px; height: 26px; }
.ib.sm svg.i { width: 14px; height: 14px; }
.clockb { flex: none; display: inline-flex; align-items: center; height: 30px; padding: 0 10px; border-radius: 8px; }
.clockb:hover { background: var(--wash); }
.clockb .time { color: var(--ink); font-size: .875rem; font-weight: 600; }
.clockb[aria-pressed="true"] .time { opacity: .4; }
.btn.counting { min-width: 64px; font: 650 .9375rem var(--mono); }
/* (older) */
.weeks { display: flex; flex-direction: column; gap: 8px; }
.weeks li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: .875rem; }
.weeks li > span:first-child { flex: none; width: 9.5em; color: var(--muted); }

/* ── Zirma on the right: Ask and Notes ── */
.alf { width: 372px; min-height: 0; display: flex; flex-direction: column; background: var(--raise); border-left: 1px solid var(--line-soft); }
.alf-h { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 10px 8px 18px; }
.alf-h .fig { width: 30px; height: 30px; flex: none; }
.alf-h b { font-weight: 600; }
.stance { height: 22px; display: inline-flex; align-items: center; padding: 0 9px; border-radius: 999px; background: var(--alf-soft); color: var(--alf); font-size: .75rem; font-weight: 550; white-space: nowrap; }
.ptabs { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin: 0 14px 10px; padding: 2px; border-radius: 10px; background: var(--wash); }
.ptabs button { min-height: 32px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 2px 8px; border-radius: 8px; color: var(--copy); font-size: .84375rem; text-align: center; }
.ptabs button[aria-selected="true"] { background: var(--raise); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px #0002; }
.ptabs svg.i { width: 15px; height: 15px; }
.ptabs .n { color: var(--muted); font-size: .75rem; font-weight: 400; }
.sees { flex: none; padding: 0 18px 10px; color: var(--muted); font-size: .75rem; border-bottom: 1px solid var(--line-soft); overflow-wrap: anywhere; }
.thread { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 16px 18px; }
.msg { max-width: 100%; overflow-wrap: anywhere; font-size: .9375rem; line-height: 1.65; }
.msg.me { align-self: flex-end; max-width: 88%; padding: 7px 12px; border-radius: 16px 16px 4px 16px; background: var(--wash); }
.msg .from { display: block; margin-bottom: 4px; color: var(--muted); font-size: .6875rem; }
.msg .sel { display: block; margin-bottom: 6px; padding-left: 9px; border-left: 2px solid var(--alf); color: var(--muted); font-size: .8125rem; }
.note { display: flex; flex-direction: column; gap: 2px; }
.note[data-fresh] p { background: var(--alf-soft); }
.note button { align-self: flex-start; color: var(--alf); font: .75rem var(--mono); }
.note span { color: var(--muted); font-size: .75rem; }
.note p { padding: 6px 10px; margin: 0 -10px; border-radius: 8px; overflow-wrap: anywhere; }
.tries { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 8px; }
.alf .compose { flex: none; width: auto; margin: 0 14px 14px; background: var(--bg); }

/* Things over the page: the close of a sitting, a choice, the cue, a toast */
.veil { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: color-mix(in oklch, var(--bg) 40%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.pop { width: min(460px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 22px 22px 18px; border-radius: 18px; background: var(--raise); box-shadow: 0 18px 50px #0003, inset 0 0 0 1px var(--line-soft); }
.pop h3 { font-size: 1.1875rem; font-weight: 650; }
.pop label { display: flex; flex-direction: column; gap: 5px; color: var(--muted); font-size: .8125rem; }
.pop label input, .pop label textarea { padding: 9px 12px; border: 0; border-radius: 12px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); outline: none; color: var(--ink); font-size: .9375rem; line-height: 1.6; resize: vertical; }
.pop label textarea { min-height: 84px; }
.pop label input:focus, .pop label textarea:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }
.pop dl { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 8px 14px; font-size: .9375rem; }
.pop dt { color: var(--muted); font-size: .8125rem; padding-top: 2px; }
.pop dd { overflow-wrap: anywhere; }
.opt { width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); }
.opt:hover { background: var(--wash); }
.opt b { font-weight: 600; overflow-wrap: anywhere; }
.opt span { color: var(--muted); font-size: .8125rem; overflow-wrap: anywhere; }
#cue { position: fixed; right: 18px; top: 96px; z-index: 75; width: min(340px, calc(100vw - 24px)); }
.cue { display: flex; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--raise); box-shadow: var(--shadow), inset 0 0 0 1px var(--line-soft); }
.cue .fig { flex: none; width: 36px; height: 36px; }
.cue p { font-weight: 550; overflow-wrap: anywhere; }
.cue .acts { margin-top: 10px; }
.cue .btn { min-height: 28px; padding: 0 11px; font-size: .75rem; }
#toast { position: fixed; left: 50%; bottom: 26px; z-index: 90; transform: translateX(-50%); max-width: calc(100vw - 24px); }
body[data-view="picture"] #toast, body[data-view="route"] #toast { bottom: 118px; }
.toast { display: flex; align-items: center; gap: 14px; padding: 9px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: .8125rem; box-shadow: var(--shadow); }
.toast button { flex: none; text-decoration: underline; text-underline-offset: 3px; }
.scrim, .bubbles { display: none; }

/* By the width of the page column, not of the window */
@container page (max-width: 560px) {
  .col { padding: 0 16px; }
  .obj, .opening, .saybar { padding-left: 16px; padding-right: 16px; }
  .tabs { padding-left: 16px; padding-right: 16px; }
  .row { grid-template-columns: auto minmax(0, 1fr); }
  .row .re { grid-column: 2; grid-row: auto; flex-wrap: wrap; white-space: normal; gap: 4px 10px; }
  .reader { font-size: 1rem; }
  .reader h2, .head h2 { font-size: 1.3125rem; }
  .screen { padding: 14px 16px; }
  .screen .cap { font-size: 1rem; }
  .card { padding: 18px 16px; }
  .card .q { font-size: 1.0625rem; }
  .newp h2 { font-size: 1.3125rem; }
  .weeks li > span:first-child { width: 100%; }
}
@container page (max-width: 380px) {
  .grades { grid-template-columns: minmax(0, 1fr); }
  .grade { flex-direction: row; justify-content: space-between; padding: 9px 14px; }
}

@media (max-width: 1040px) { .alf { width: 320px; } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .top { display: none; }
  .phone-head { position: relative; flex: none; display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px; padding-top: calc(14px + env(safe-area-inset-top)); }
  .phone-head svg.i { color: var(--k-solid); }
  .phone-head b { font-size: 1.0625rem; font-weight: 650; }
  .phone-head span { color: var(--muted); font-size: .8125rem; }
  .side, body[data-side="off"] .side { display: flex; position: fixed; inset: 0 22% 0 0; z-index: 50; transform: translateX(-102%); transition: transform 250ms var(--ease); padding-top: calc(14px + env(safe-area-inset-top)); }
  body[data-sheet="side"] .side { transform: none; }
  .alf { position: fixed; inset: 0; z-index: 50; width: auto; border: 0; transform: translateY(102%); transition: transform 250ms var(--ease); }
  .alf[hidden] { display: flex !important; }
  body[data-sheet="alf"] .alf { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 45; background: #00000040; }
  body[data-sheet="side"] .scrim { display: block; }
  .scroll { padding-bottom: 150px; }
  .bubbles { position: fixed; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 30; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  body[data-sheet] .bubbles { display: none; }
  body[data-view="picture"] .bubbles, body[data-view="route"] .bubbles { bottom: calc(112px + env(safe-area-inset-bottom)); }
  .popmenu { right: 12px; top: 50px; }
  .bubbles button { pointer-events: auto; height: 46px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 999px; background: var(--raise); box-shadow: var(--shadow), inset 0 0 0 1px var(--line-soft); font-size: .875rem; font-weight: 550; }
  .bubbles .round { width: 50px; height: 50px; padding: 0; justify-content: center; }
  .bubbles .fig { width: 30px; height: 30px; }
  #float { left: 12px !important; right: 12px; top: auto !important; bottom: calc(76px + env(safe-area-inset-bottom)); display: flex; justify-content: center; }
  #toast { bottom: calc(76px + env(safe-area-inset-bottom)); }
  body[data-view="picture"] #toast, body[data-view="route"] #toast { bottom: calc(176px + env(safe-area-inset-bottom)); }
  #cue { top: 14px; right: 12px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<div class="proto" id="proto"></div>
<div class="app">
  <header class="top" id="top"></header>
  <nav class="side" id="side"></nav>
  <main class="page" id="page"></main>
  <aside class="alf" id="alf"></aside>
</div>
<div class="scrim" data-a="sheet-close"></div>
<div class="bubbles" id="bubbles"></div>
<div id="float" hidden></div>
<div id="cue"></div>
<div id="veil"></div>
<div id="toast"></div>

<script type="module">
import { createFigure } from "./figure.js";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const params = new URLSearchParams(location.search);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const phone = () => innerWidth <= 760;

const ICON = {
  home: '<path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/>',
  code: '<path d="m8.5 8-4 4 4 4M15.5 8l4 4-4 4M13.5 5.5l-3 13"/>',

/* ── State ── */
const SCENES = ["new", "picture", "route", "desk", "record"];

function glyph(st) {
  const ring = (color) => `<circle cx="7" cy="7" r="5" fill="none" stroke="${color}" stroke-width="1.5"/>`;
  const body = st.s === "none" ? ring("var(--line)")
    : st.s === "learning" ? ring("var(--copy)") + '<path d="M7 2a5 5 0 0 1 0 10z" fill="var(--copy)"/>'
    : '<circle cx="7" cy="7" r="5.5" fill="var(--ok)"/>';

}
const stTag = (st) => `<span class="st" data-s="${st.s}">${esc(stWord(st))}</span>`;
const matIcon = (mat) => ic(mat.kind === "video" ? "video" : mat.kind === "text" ? "doc" : "mark");
const phase = (g) => (g.map.finding ? t("在查", "Looking it up") : !g.way ? t("在规划", "Planning") : t("在走", "Under way"));
/* What Zirma works out and never decides: at this pace, about when. */
function arrive(g, pace = g.pace, drop = []) {
  const left = allSteps(g).filter((id) => !there(g, id) && !drop.includes(id)).reduce((sum, id) => sum + g.steps[id].est, 0);
  const weeks = Math.ceil(left / pace) + (g.slip ?? 0);

}
const heatOf = (g) => (g.heat ??= Array.from({ length: 12 }, () => Array(7).fill(0)));

const late = (g, date = arrive(g).date) => !!deadline(g) && date > deadline(g);

const curMat = (g) => g.steps[g.step]?.mats.find((mat) => mat.id === S.mat) ?? g.steps[g.step]?.mats[0] ?? null;

/* The big picture: one whole thing, explained. A board (a column a part, a short row a topic) so the whole is in

const tellHtml = (tell, deep) => `<div class="eli"><h4>${t("是什么", "What it is")}</h4><p>${esc(tr(tell.what))}</p><h4>${t("为什么", "Why")}</h4><p>${esc(tr(tell.why))}</p>${deep && tell.more ? `<p class="deep">${esc(tr(tell.more))}</p>` : ""}</div>`;

  }

/* The route: how to get there, a step at a time. Like the big picture, it explains before it lists. You ask how

   what you do, and why this step. Under it: what you can use from the web, which you put on the desk yourself.
   Nothing to confirm on the way: once there is a first step you can go and do it. */
const NO_STEP = { does: ["原型里这一步没有备讲解。App 里，Zirma 用大白话讲这一步具体做什么。", "The prototype has no explanation ready for this step. In the app Zirma says in plain words what you actually do here."], why: ["同上：为什么现在走这一步，也用大白话讲。", "The same: why this step comes now, in plain words too."] };
function routeView(g) {

function heatBox(g) {
  const heat = heatOf(g), monday = addDays(TODAY, -((TODAY.getDay() + 6) % 7) - 7 * (heat.length - 1));
  const names = [t("一", "Mon"), "", t("三", "Wed"), "", t("五", "Fri"), "", ""];
  const word = (level) => (level === 2 ? t("走完了一步", "a step finished") : level === 1 ? t("坐下来过", "sat down") : t("没来", "nothing"));
  return `<div class="heat" role="group" aria-label="${t("每天的记录", "The record by day")}"><div class="hd" aria-hidden="true">${names.map((name) => `<span>${name}</span>`).join("")}</div>${heat.map((col, w) => {
    const n = w === heat.length - 1 ? Math.max(g.week.done, col.filter(Boolean).length) : col.filter(Boolean).length, met = n >= g.pace;
    return `<div class="hc">${col.map((level, d) => { const date = addDays(monday, w * 7 + d); return `<i class="hm" data-l="${date > TODAY ? "x" : level}" title="${esc(day(date))} · ${esc(date > TODAY ? t("还没到", "not yet") : word(level))}"></i>`; }).join("")}<b class="wk ${met ? "met" : ""}" title="${esc(t(`${n} 次`, plural(n, "sitting")))}"></b></div>`; }).join("")}</div>
    <p class="legend"><span><i class="hm" data-l="1"></i>${t("坐下来过", "Sat down")}</span><span><i class="hm" data-l="2"></i>${t("走完了一步", "A step finished")}</span><span><b class="wk met"></b>${t("这一周到了你定的节奏", "The week met the pace you set")}</span></p>`;
}

    case "seek": { const box = el.getBoundingClientRect(); g.video.at = Math.round(Math.max(0, Math.min(1, (event.clientX - box.left) / box.width)) * VIDEO.len); return paintPlayer(); }
    case "lost": begin(); S.panel = true; if (phone()) S.sheet = "alf"; syncBody(); renderTop(); return say(t("这里没懂", "Lost me here"));
    case "note-now": { begin(); const cap = capAt(g.video.at); addNote(cap[1]); S.panel = true; S.ptab = "keep"; if (phone()) S.sheet = "alf"; syncBody(); renderTop(); renderPage(); renderAlf(); return $("notein")?.focus(); }
    case "outside": begin(); S.panel = true; S.ptab = "keep"; if (phone()) S.sheet = "alf"; syncBody(); renderTop(); renderPage(); renderAlf(); return $("notein")?.focus();
    case "jump": { const note = g.notes[Number(id)]; g.video.at = note.at; S.mat = "v1"; S.sheet = null; syncBody(); renderPage(); return renderAlf(); }
    case "ptab": S.ptab = id; return renderAlf();
    case "done-step": { const step = g.steps[id || g.step]; step.done = !step.done; if (step.done) step.touched = true; renderSide(); return S.veil ? renderVeil() : renderPage(); }
    case "close-sitting": begin(); S.playing = false; S.veil = "close"; return renderVeil();
    case "close-ok": {
      g.week.done = Math.min(g.pace, g.week.done + 1);
      { const col = heatOf(g).at(-1), today = (TODAY.getDay() + 6) % 7, won = there(g, g.step); col[today] = Math.max(col[today], won ? 2 : 1); }
      g.record.unshift({ d: 0, step: g.step, did: [S.closing, S.closing], fresh: true });
      Object.assign(S, { veil: null, sitting: null });
      FIG.head.fig.play?.("hop");
      return open("record");
    }
    case "veil-close": S.veil = null; return renderVeil();
    case "goal-card": S.veil = "goalcard"; renderVeil(); return $("gc-why")?.focus();
    case "veil-bg": if (event.target === el) { S.veil = null; renderVeil(); } return;
    case "starter": return starter(id);
    case "col": S.block = id; S.topic = null; return renderPage();
    case "topic": { const parent = g.map.blocks.find((b) => b.topics.some((x) => x.id === id)); S.block = parent.id; S.topic = S.topic === id ? null : id; const topic = openTopic(g);
      if (topic && !topic.told) { S.telling = id; setTimeout(() => { topic.told = true; if (S.telling === id) S.telling = null; if (S.view === "picture") renderPage(); }, reduced ? 0 : 900); }
      renderPage(); const box = document.getElementById("detail")?.getBoundingClientRect(); if (box && box.top > innerHeight - 220) $("page").querySelector(".scroll").scrollBy({ top: box.top - (innerHeight - 340) }); return; }
    case "spread": spread(g, g.map.blocks.find((b) => b.id === id)); if (g.map.blocks.every((b) => b.topics.length)) g.map.asked = [...new Set([...(g.map.asked ?? []), "spread"])]; return renderPage();
    case "deep": { const topic = openTopic(g); topic.deep = !topic.deep; return renderPage(); }
    case "tile-add": return toast(t("原型里没做：自己加一块，或者让 Zirma 再找一找", "Not in the prototype: add a part yourself, or have Zirma look again"));
    case "tdrop": { const topic = openTopic(g), parent = g.map.blocks.find((b) => b.topics.includes(topic)), at = parent.topics.indexOf(topic); parent.topics.splice(at, 1); S.topic = null; renderPage();
      return toast(t(`去掉了「${tr(topic.name)}」`, `Removed “${tr(topic.name)}”`), () => { parent.topics.splice(at, 0, topic); S.topic = topic.id; renderPage(); }); }
    case "bdrop": { const block = openBlock(g), at = g.map.blocks.indexOf(block); g.map.blocks.splice(at, 1); S.block = g.map.blocks[0]?.id ?? null; S.topic = null; renderSide(); renderPage();
      return toast(t(`去掉了「${tr(block.name)}」`, `Removed “${tr(block.name)}”`), () => { g.map.blocks.splice(at, 0, block); S.block = block.id; renderSide(); renderPage(); }); }
    case "card-drop": openTopic(g).cards.splice(Number(id), 1); return renderPage();
    case "way": return chooseWay(Number(id));
    case "reway": return toast(t("原型里只在「找到后端的工作」那个目标演示选走法", "The prototype shows choosing an approach on the goal “A backend job” only"));
    case "pace": g.pace = Number(id); return renderPage();
    case "open-ways": return openWays(g);
    case "rstep": { S.rstep = S.rstep === id ? null : id; const step = g.steps[id];
      if (S.rstep && !step.told) { S.telling = id; setTimeout(() => { step.told = true; if (S.telling === id) S.telling = null; if (S.view === "route") renderPage(); }, reduced ? 0 : 800); }
      return renderPage(); }
    case "sres": g.steps[id].resShown = true; return renderPage();
    case "put": { const [sid, i] = id.split(":"), step = g.steps[sid], [title, note] = step.res[Number(i)], mat = { id: `r${Date.now()}`, kind: "link", title, src: note }; step.mats.push(mat); (step.put ??= []).push(Number(i)); renderPage();
      return toast(t("放到书桌上了", "Put on the desk"), () => { step.mats = step.mats.filter((x) => x !== mat); step.put = step.put.filter((x) => x !== Number(i)); renderPage(); }); }
    case "see-topic": { const parent = g.map.blocks.find((b) => b.topics.some((x) => x.id === id)); return open("picture", { block: parent.id, topic: id }); }
    case "detail": g.stages[Number(id)].coarse = false; return renderPage();
    case "own-way": return toast(t("原型里没做：贴一份大纲，Zirma 排成段和步", "Not in the prototype: paste an outline and Zirma lays it out as stages and steps"));
    case "jump-sec": return document.getElementById(`sec-${id}`)?.scrollIntoView({ block: "start", behavior: reduced ? "auto" : "smooth" });
    case "review-yes": {
      const stage = g.stages[1];
      g.steps.b9 = { title: ["线性无关", "Linear independence"], est: 2, fresh: true, mats: [] };
      stage.steps.splice(stage.steps.indexOf("b5"), 0, "b9"); g.review = false; renderAll();
      return toast(t("加了一步「线性无关」", "Added the step “Linear independence”"), () => { stage.steps = stage.steps.filter((x) => x !== "b9"); delete g.steps.b9; renderAll(); });
    }
    case "review-no": g.review = false; return renderPage();
    case "demo-review": S.goals.la.review = true; return open("route", { goal: "la" });
    case "deadline": g.deadline = id ? id.split(",").map(Number) : null; renderTop(); return renderPage();
    case "behind": S.veil = "behind"; return renderVeil();
    case "fix": {
      const before = structuredClone({ pace: g.pace, deadline: g.deadline, stages: g.stages, slip: g.slip });
      if (id === "more") g.pace = 5;
      if (id === "less") g.stages = g.stages.slice(0, -1);
      if (id === "later") { const d = arrive(g).date; g.deadline = [d.getFullYear(), d.getMonth(), d.getDate()]; }
      S.veil = null; renderAll();
      return toast(t("改好了", "Changed"), () => { Object.assign(g, before); renderAll(); });
    }
    case "menu": S.menu = S.menu === id ? null : id; renderSide(); renderTop(); if (phone()) renderPage(); return (id === "timer" ? $("tm") : null)?.select();
    case "side": S.side = !S.side; syncBody(); return renderTop();
    case "panel": if (phone()) S.sheet = null; else S.panel = !S.panel; syncBody(); renderTop(); if (S.view === "desk") renderPage(); return renderAlf();
    case "sheet": S.sheet = id; if (id === "alf") S.panel = true; syncBody(); return renderAlf();
    case "sheet-close": S.sheet = null; return syncBody();
    case "other": return toast(t("原型里只有目标这一边", "Only the Goals side is in this prototype"));
    case "try": $("sentence").value = tr([FRESH.sentence, ["明年 3 月前换一份后端的工作", "Move to a backend job by next March"], ["一年内能用日语看懂工作邮件", "Read work email in Japanese within a year"]][Number(id)]); return $("sentence").focus();
    case "say": return say(tr(tries()[Number(id)]));
    case "sel": return selAct(id);
    case "undo": S.toast?.undo?.(); S.toast = null; renderToast(); renderSide(); return renderAlf();
    case "cue-start": S.cue = false; S.goal = "la"; begin(); open("desk", { mat: "v1" }); S.playing = true; return paintPlayer();
    case "cue-no": S.cue = false; renderCue(); renderAlf(); return toast(t("好。下一次只留最小的一步", "All right. Next time I keep only the smallest step"));
    case "demo-ways": open("route", { goal: "job" }); return S.goals.job.way || S.goals.job.waysOpen ? null : openWays(S.goals.job);
    case "demo-select": return demoSelect();
    case "demo-cue": S.cue = true; renderAlf(); return renderCue();
    case "demo-behind": S.goals.la.slip = 4; S.goals.la.deadline = [2027, 0, 31]; open("record", { goal: "la" }); S.veil = "behind"; return renderVeil();
    case "reset": S = fresh({ lang: S.lang }); return renderAll();
    case "lang": S.lang = S.lang === "en" ? "zh" : "en"; return renderAll();
    case "scheme": { const root = document.documentElement; root.dataset.scheme = root.dataset.scheme === "dark" ? "light" : "dark"; for (const f of Object.values(FIG)) f.fig.setDark(isDark()); return; }
  }
});
document.addEventListener("submit", (event) => {
  event.preventDefault();
  const form = event.target.dataset.form;
  if (form === "new") return newGoal($("sentence").value.trim() || tr(FRESH.sentence));
  if (form === "alf") { const text = $("ask").value.trim(); if (text) say(text); }
  if (form === "plan") { const text = $("planin").value.trim(); if (text) say(text); }
  if (form === "goalcard") {
    const g = goal(), text = $("gc-goal").value.trim(), why = $("gc-why").value.trim();
    if (text && text !== tr(g.goal)) g.goal = [text, text];
    g.why = why ? (g.why && why === tr(g.why) ? g.why : [why, why]) : null;
    S.veil = null; return renderAll();
  }
  if (form === "note") { const text = $("notein").value.trim(); if (!text) return; begin(); addNote([text, text]); renderPage(); renderAlf(); }
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") { if (S.count) { S.count = 0; renderPage(); } Object.assign(S, { menu: null, pop: null, sheet: null, veil: null }); showPop(); syncBody(); renderSide(); renderTop(); renderVeil(); }
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing && event.target.matches(".compose textarea")) { event.preventDefault(); event.target.form.requestSubmit(); }
});
document.addEventListener("input", (event) => {
  if (event.target.id === "why") S.draftWhy = event.target.value;
  if (["th", "tm", "ts"].includes(event.target.id)) {
    const read = (id, max) => Math.max(0, Math.min(max, parseInt($(id).value, 10) || 0)), sec = read("th", 23) * 3600 + read("tm", 59) * 60 + read("ts", 59);
    if (!sec) return;
    S.timerSec = sec; S.timerOn = true; $("tlabel").textContent = clock(sec);
  }
});

$("float").addEventListener("mousedown", (event) => event.preventDefault());
let selTimer = 0;
document.addEventListener("selectionchange", () => { clearTimeout(selTimer); selTimer = setTimeout(readSelection, 220); });
document.addEventListener("mouseup", (event) => { if (!event.target.closest("#float")) { clearTimeout(selTimer); setTimeout(readSelection, 0); } });
addEventListener("resize", () => { if (S.pop) { S.pop = null; showPop(); } });

if (params.has("bare")) document.documentElement.dataset.bare = "";
document.documentElement.dataset.scheme = params.get("scheme") ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
S = fresh();
renderAll();
Object.assign(window, { goals: { get state() { return S; }, demoSelect } });
</script>
</body>
</html>
