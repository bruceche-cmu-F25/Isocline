<!doctype html>
<!--
  Alfred: getting things into and around the daily pages with fewer words. A prototype: no build step, sample data,
  a small scripted reader of dates and times instead of a model.
  ask.html compares where a conversation with Alfred sits. This page asks how much can happen with no conversation:
    1  Alfred goes first. What it read becomes a proposal; the proposal shows as a card under Notices and as a dashed
       "ghost" in the place it would change (the calendar, the todo, under the mail). One tap: yes / change / no.
    2  Say one line. The line at the bottom takes a sentence and shows what it will become before you press return.
       Nothing answers back: the thing lands on its page, with undo. A question goes to the conversation instead.
    3  Change in place. Click a todo, an event or a mail and say a few words about it, or tap a chip.
       Those words go in the one line at the bottom (chosen 2026-11-19): picking a thing attaches it to the line,
       and so does "change" on a proposal and "reply" under a mail, so there is one place to write on every page.
       The strip at the top still switches to the other way, a line beside the thing, for comparison.
  The conversation has no box of its own. A question goes in the same line, and Alfred answers out of it, in a card
  above the line. An exchange that grows opens as the panel, which is only the transcript: the next sentence is still
  written in the bottom line. Two answers are scripted; anything else gets a line saying so.
-->
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfred：少说话</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<style>
:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.23, 1, .32, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
h1, h2, h3, p { margin: 0; padding: 0; }
a { color: inherit; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--alf); outline-offset: 2px; }
.grow { flex: 1; min-width: 0; }

/* ── The prototype's own strip ── */
.proto { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px 10px; background: var(--ink); color: var(--bg); font-size: 12px; overflow-x: auto; white-space: nowrap; }
.proto b { flex: none; padding: 0 6px; }
.proto .lab { flex: none; padding: 0 4px 0 10px; opacity: .6; }
.proto button, .proto a { flex: none; height: 26px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 8px; opacity: .72; text-decoration: none; }
.proto button:hover, .proto a:hover { opacity: 1; }
.proto button[aria-pressed="true"] { background: var(--bg); color: var(--ink); opacity: 1; }
.proto .what { flex: 1; min-width: 0; padding: 0 10px; opacity: .7; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 900px) { .proto .what { visibility: hidden; } }
@media (max-width: 620px) { .proto .lab, .proto b { display: none; } }

/* ── Shell: rail | page | conversation ── */
.app { flex: 1; min-height: 0; position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr) var(--alf-w, 0px); grid-template-rows: minmax(0, 1fr); }
.app[data-panel] { --alf-w: 340px; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; background: var(--paper); border-right: 1px solid var(--line-soft); }
.rail button { position: relative; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); }
.rail button:hover { background: var(--wash); }
.rail button[aria-current="page"] { background: var(--wash); color: var(--k-solid); }
.rail .count { position: absolute; top: 1px; right: 0; min-width: 15px; height: 15px; padding: 0 4px; display: grid; place-items: center; border-radius: 8px; background: var(--warm); color: var(--raise); font-size: 10px; }

.page { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; container: page / inline-size; }
.page-head { flex: none; padding: 22px 28px 12px; }
.page-head h1 { display: flex; align-items: center; gap: 10px; font-size: 1.625rem; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; }
.page-head h1 svg { width: 24px; height: 24px; color: var(--k-solid); }
.page-head p { margin-top: 6px; color: var(--muted); font-size: .875rem; }
/* Room for the line at the bottom, so the last row can be scrolled clear of it. */
.page-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 170px; }
/* One column, centred, so the lists sit above the line at the bottom; the title starts where the rows' text does. */
.col { max-width: 720px; margin-inline: auto; }
.page:not([data-p="mail"]) .page-head > * { max-width: 696px; margin-inline: auto; }
@container page (max-width: 520px) {
  .page-head { padding: 16px 16px 10px; }
  .page-body { padding-left: 8px; padding-right: 8px; }
}

/* ── Shared small parts ── */
.tag { flex: none; padding: 0 7px; border-radius: 6px; background: var(--k-fill); color: var(--k-text); font-size: .75rem; font-weight: 500; white-space: nowrap; }
.by { color: var(--alf); }
.acts, .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.acts button { min-height: 30px; padding: 0 13px; border-radius: 999px; font-size: .8125rem; white-space: nowrap; }
.acts .primary { background: var(--alf-solid); color: var(--on-alf); }
.acts .ghost { color: var(--copy); box-shadow: inset 0 0 0 1px var(--line); }
.acts .ghost:hover { color: var(--ink); background: var(--wash); }
/* The thing the bottom line is about: its button stays down, its card or draft takes Alfred's line. */
.acts .ghost[aria-pressed="true"] { background: var(--alf-soft); color: var(--alf); box-shadow: inset 0 0 0 1px var(--alf); }
.card[data-on], .draft[data-on] { border-color: var(--alf); border-style: solid; }
.reply-acts { margin-top: 18px; }
.chip { flex: none; max-width: 100%; height: 28px; padding: 0 11px; border-radius: 999px; background: var(--raise); color: var(--copy); font-size: .8125rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; box-shadow: inset 0 0 0 1px var(--line); }
.chip:hover { color: var(--ink); background: var(--wash); }
.ic { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.ic:hover { background: var(--wash); color: var(--ink); }
.send { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--alf-solid); color: var(--on-alf); }
/* Yes / no on a ghost, where a row of buttons would not fit. */
.mini { flex: none; display: inline-flex; gap: 6px; }
.mini button { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font-size: 13px; line-height: 1; }
.mini .yes { background: var(--alf-solid); color: var(--on-alf); }
.mini .no { color: var(--copy); box-shadow: inset 0 0 0 1px var(--line); background: var(--raise); }
/* A line to write a few words in: beside a thing, or to change a proposal. */
.line { display: flex; align-items: center; gap: 4px; min-width: 0; padding: 3px 3px 3px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--field); }
.line:focus-within { border-color: var(--alf); box-shadow: 0 0 0 3px var(--alf-soft); }
.line input { flex: 1; min-width: 0; height: 30px; border: 0; background: none; outline: none; }
input::placeholder { color: var(--muted); }
.near { display: flex; flex-direction: column; gap: 6px; margin: 2px 12px 10px 44px; max-width: 520px; animation: drop 240ms var(--ease) both; }
@keyframes drop { from { opacity: 0; transform: translateY(-4px); } }
.lost { display: flex; flex-wrap: wrap; gap: 2px 8px; color: var(--muted); font-size: .8125rem; }
.lost button { color: var(--alf); }
@container page (max-width: 520px) { .near { margin-left: 12px; } }
@media (prefers-reduced-motion: reduce) { .near, .cap-up > * { animation: none !important; } }

/* ── Notices: what Alfred proposes, one card each ── */
.cards { display: flex; flex-direction: column; gap: 12px; padding: 8px 12px 0; }
.card { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px 16px; border: 1px solid var(--line-soft); border-radius: 16px; background: var(--raise); transition: background-color 700ms var(--ease); }
.card[data-fresh] { background: var(--alf-soft); }
.card > * { max-width: 100%; }
.card-src { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted); font-size: .8125rem; }
.card-src svg { width: 15px; height: 15px; }
.card-src span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
button.card-src:hover { color: var(--ink); }
.card-quote { font-weight: 550; overflow-wrap: anywhere; }
.card-label { margin-top: 2px; color: var(--alf); font-size: .75rem; font-weight: 500; }
.card-label.q { color: var(--ink); font-size: .9375rem; }
.steps { align-self: stretch; display: flex; flex-direction: column; gap: 5px; }
.step { display: flex; align-items: baseline; gap: 8px; min-width: 0; color: var(--copy); font-size: .875rem; }
.step > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.step s { color: var(--muted); }
.card .line, .draft .line { align-self: stretch; }
.sub { padding: 18px 16px 4px; color: var(--muted); font-size: .8125rem; font-weight: 500; }
.receipt { padding: 3px 16px; color: var(--muted); font-size: .8125rem; overflow-wrap: anywhere; }
.receipt::before { content: "✓ "; color: var(--alf); }
.receipt[data-state="no"]::before { content: "– "; color: var(--muted); }
.clear { padding: 28px 16px; color: var(--muted); }

/* ── Todos ── */
.group, .day { padding-top: 14px; }
.group h3, .day h3 { padding: 4px 12px; color: var(--muted); font-size: .8125rem; font-weight: 500; }
.group[data-g="late"] h3 { color: var(--warm); }
.day[data-today] h3 { color: var(--ink); }
.group h3 span { opacity: .7; margin-left: 4px; }
.todo { display: flex; align-items: flex-start; gap: 12px; padding: 6px 12px; border-radius: 12px; transition: background-color 700ms var(--ease); }
.todo:hover, .todo[data-on] { background: var(--wash); }
.todo[data-fresh], .ev[data-fresh] { background: var(--alf-soft); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--alf) 25%, transparent); }
.todo .box { flex: none; width: 20px; height: 20px; margin-top: 4px; border-radius: 50%; box-shadow: inset 0 0 0 1.8px var(--k-solid, var(--muted)); }
.todo[data-done] .box { background: var(--k-solid, var(--muted)); }
.todo-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.todo-body { display: block; width: 100%; padding: 2px 0; overflow-wrap: anywhere; }
.todo[data-done] .todo-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.todo-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 2px; color: var(--muted); font-size: .75rem; }
/* Alfred's suggestion for this row, waiting for a yes. */
.ghost-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 5px 6px 5px 12px; border: 1px dashed color-mix(in oklch, var(--alf) 45%, transparent); border-radius: 12px; background: var(--alf-soft); color: var(--alf); font-size: .8125rem; }
.ghost-line span { flex: 1 1 120px; min-width: 0; overflow-wrap: anywhere; }

/* ── Calendar: the coming days as a list ── */
.ev { width: 100%; display: flex; align-items: flex-start; gap: 12px; padding: 8px 12px; border: 1px solid transparent; border-radius: 12px; transition: background-color 700ms var(--ease); }
button.ev:hover, .ev[data-on] { background: var(--wash); }
.ev .time { flex: none; width: 92px; padding-top: 2px; color: var(--copy); font: .8125rem/1.5 var(--mono); white-space: nowrap; }
.ev .time i { font-style: normal; color: var(--muted); }
.ev .bar { flex: none; width: 3px; align-self: stretch; min-height: 22px; border-radius: 2px; background: var(--k-solid); }
.ev-body { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-wrap: anywhere; }
.ev-meta { color: var(--muted); font-size: .75rem; }
.ev[data-moving] :is(.ev-title, .time) { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.ev[data-ghost] { align-items: center; border: 1px dashed color-mix(in oklch, var(--alf) 45%, transparent); background: var(--alf-soft); }
.ev[data-ghost] .ev-meta { color: var(--alf); }
.free { padding: 6px 12px; color: var(--muted); font-size: .8125rem; }
@container page (max-width: 520px) { .ev .time { width: 44px; } .ev .time i { display: none; } }

/* ── Mail ── */
.mail { height: 100%; display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); }
.page-body:has(.mail) { padding: 0; overflow: hidden; }
.mail-list { min-height: 0; overflow-y: auto; padding: 0 8px 24px 12px; border-right: 1px solid var(--line-soft); }
.mail-row { width: 100%; display: block; padding: 9px 12px; border-radius: 12px; }
.mail-row:hover, .mail-row[aria-current="true"] { background: var(--wash); }
.mail-row .who { display: flex; align-items: center; gap: 6px; font-size: .875rem; font-weight: 600; }
.mail-row .who span:first-child { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.mail-row .sub-line { display: block; color: var(--copy); font-size: .8125rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.mail-row[data-read] .who { font-weight: 400; color: var(--copy); }
.mail-read { min-height: 0; overflow-y: auto; padding: 4px 28px 190px; }
.mail-read h2 { font-size: 1.125rem; line-height: 1.35; overflow-wrap: anywhere; }
.mail-read .from { margin-top: 4px; color: var(--muted); font-size: .8125rem; }
.mail-read .text { margin-top: 16px; max-width: 64ch; color: var(--copy); white-space: pre-wrap; overflow-wrap: anywhere; }
.draft, .sent { margin-top: 18px; max-width: 64ch; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--alf-soft); transition: background-color 700ms var(--ease); }
.draft { border: 1px dashed color-mix(in oklch, var(--alf) 45%, transparent); }
.draft[data-fresh] { background: color-mix(in oklch, var(--alf) 18%, transparent); }
.sent { border-left: 2px solid var(--alf); border-radius: 0 12px 12px 0; }
.draft > *, .sent > * { max-width: 100%; }
.draft b, .sent b { color: var(--alf); font-size: .75rem; font-weight: 500; }
.draft p, .sent p { white-space: pre-wrap; overflow-wrap: anywhere; }
.mail-read .near { margin: 18px 0 0; max-width: 64ch; }
@container page (max-width: 620px) {
  .mail { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .mail-list { max-height: 30cqh; padding: 0 8px 8px; border-right: 0; border-bottom: 1px solid var(--line-soft); }
  .mail-read { padding: 14px 16px 190px; }
}

/* ── The line at the bottom: say it once ── */
.fig { display: block; width: 28px; height: 28px; flex: none; }
.cap { position: absolute; z-index: 10; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(600px, calc(100% - 24px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; }
.cap-form { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 7px 8px 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--raise); box-shadow: 0 1px 2px oklch(0 0 0 / .05), 0 8px 28px oklch(0 0 0 / .1); transition: border-color .15s, box-shadow .15s; }
.cap-form:focus-within { border-color: var(--alf); box-shadow: 0 0 0 3px var(--alf-soft), 0 8px 28px oklch(0 0 0 / .1); }
.cap-form[data-about] { border-color: color-mix(in oklch, var(--alf) 55%, var(--line)); }
.cap-form input { flex: 1; min-width: 0; height: 30px; border: 0; background: none; outline: none; }
.cap-about { flex: 0 1 auto; min-width: 0; max-width: 40%; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 4px 0 9px; border-radius: 999px; background: var(--alf-soft); color: var(--alf); font-size: .75rem; }
.cap-about span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.cap-about button { flex: none; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; font-size: 12px; line-height: 1; }
.cap-about button:hover { background: var(--alf-soft); }
.cap kbd { flex: none; padding: 0 5px; border-radius: 5px; background: var(--wash); color: var(--muted); font: .6875rem var(--mono); }
.cap-up { display: flex; flex-direction: column; gap: 6px; }
.cap-up:empty { display: none; }
.cap-up > * { animation: rise 260ms var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.pre, .toast, .cap-up .lost { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--raise); box-shadow: var(--shadow); font-size: .875rem; }
.pill { flex: none; height: 26px; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; border-radius: 999px; background: var(--k-fill); color: var(--k-text); font-size: .8125rem; font-weight: 500; white-space: nowrap; }
button.pill:hover { box-shadow: inset 0 0 0 1px var(--k-line); }
.pre .title { flex: 1 1 140px; min-width: 0; overflow-wrap: anywhere; }
.pre .hint { flex: none; color: var(--muted); font: .75rem var(--mono); }
.toast .t { flex: 1 1 160px; min-width: 0; color: var(--copy); overflow-wrap: anywhere; }
.toast .t::before { content: "✓ "; color: var(--alf); }
.toast button { flex: none; color: var(--alf); font-size: .8125rem; white-space: nowrap; }
/* Alfred's answer to a question: it comes out of the line, and can be opened into the conversation. */
.ans { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-height: min(46vh, 340px); overflow-y: auto; padding: 11px 14px 10px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--raise); box-shadow: var(--shadow); }
.ans .asked { max-width: 100%; padding-right: 26px; color: var(--muted); font-size: .8125rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ans .text { overflow-wrap: anywhere; }
.ans .work { color: var(--muted); }
.ans .foot button { color: var(--muted); font-size: .8125rem; }
.ans .foot button:hover { color: var(--ink); }
.ans .x { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); font-size: 16px; line-height: 1; }
.ans .x:hover { background: var(--wash); color: var(--ink); }
.cap-chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
.cap-chips .chip { box-shadow: inset 0 0 0 1px var(--line), 0 2px 8px oklch(0 0 0 / .06); }
@container page (max-width: 520px) { .cap kbd { display: none; } }

/* ── The back door: the conversation (a stub here) ── */
.panel { display: none; min-width: 0; min-height: 0; flex-direction: column; background: var(--raise); border-left: 1px solid var(--line-soft); }
.app[data-panel] .panel { display: flex; }
.p-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 16px; font-weight: 600; }
.turns { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 8px 16px 16px; }
.said { align-self: flex-end; max-width: 85%; padding: 6px 12px; border-radius: 14px; background: var(--wash); color: var(--copy); overflow-wrap: anywhere; }
.turns p { color: var(--copy); font-size: .9375rem; overflow-wrap: anywhere; }
.turns .note { margin-top: auto; padding-top: 12px; color: var(--muted); font-size: .8125rem; }
.turns a { color: var(--alf); }

/* ── Narrow windows: the rail lies along the top, and the conversation is a sheet over the lower part. ── */
@media (max-width: 760px) {
  .app, .app[data-panel] { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .rail { flex-direction: row; justify-content: center; gap: 12px; padding: 4px 0; border-right: 0; border-bottom: 1px solid var(--line-soft); }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 12; height: 56%; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 40px oklch(0 0 0 / .14); }
}
</style>
</head>
<body>

<div class="proto" id="proto" role="toolbar" aria-label="Prototype"></div>

<div class="app" id="app">
  <nav class="rail" id="rail"></nav>

  <main class="page" id="page">
    <header class="page-head" id="page-head"></header>
    <div class="page-body" id="page-body"></div>

    <div class="cap" id="cap">
      <div class="cap-up" id="cap-up" role="status" aria-live="polite"></div>
      <form class="cap-form" id="cap-form">
        <span data-fig></span>
        <span class="cap-about" id="cap-about" hidden></span>
        <input id="cap-input" autocomplete="off" maxlength="200">
        <kbd>⌘K</kbd>
        <button type="button" class="ic" data-mic="cap" aria-label="Dictate"><svg class="i" viewBox="0 0 20 20"><rect x="7.5" y="3" width="5" height="9" rx="2.5"/><path d="M4.5 10a5.5 5.5 0 0 0 11 0M10 15.5V18"/></svg></button>
        <button type="submit" class="send" aria-label="Send"><svg class="i" viewBox="0 0 20 20"><path d="M4 10h11M11 5l5 5-5 5"/></svg></button>
      </form>
    </div>
  </main>

  <aside class="panel" id="panel" aria-label="Alfred">

function calHtml() {

/* ── The bottom line ── */
const input = $("#cap-input");
/** What the sentence in the bottom line will become, with what the user corrected by hand. */
function reading(text) {
  const got = read(text), kind = S.kind ?? got.kind, day = S.day === undefined ? got.day : S.day;
  return { ...got, kind, day, start: got.start ?? (kind === "event" ? "09:00" : null) };
}
function renderUp() {

      + (got.kind === "event" ? `<span class="pill" data-k="gray">${got.start}</span>` : "")
      + `<span class="title">${esc(got.kind === "ask" ? text : got.title)}</span><span class="hint">↵</span></div>`;
    if (S.dayMenu) html += `<div class="cap-chips">${[TODAY, plus(TODAY, 1), weekday(6), weekday(1, true), ""].map((day) => `<button type="button" class="chip" data-day="${day}">${esc(dayText(day))}</button>`).join("")}</div>`;
  } else if (S.focus && !S.toast) {
    html += `<div class="cap-chips">${[t("周五前交报告", "Hand in the report by Friday"), t("明天下午3点和王老师喝咖啡", "Coffee with Mr Wang tomorrow at 3pm"), t("今天先做哪件？", "What first today?")].map((chip) => `<button type="button" class="chip" data-fill="${esc(chip)}">${esc(chip)}</button>`).join("")}</div>`;

let toastTimer;
function toast(text, { go = null, undo = true } = {}) {
  S.toast = { text, go, undo };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; renderUp(); }, 7000);
}

/* ── Changes. Each one remembers what was there before, so it can be undone. ── */
const remember = () => { past.push(JSON.stringify(D)); if (past.length > 30) past.shift(); };
/** A change is made: say so above the bottom line, light up what changed, let go of what was picked. */
function done(text, { ids = [], go = null, keep = false } = {}) {
  for (const id of ids) S.fresh.add(id);
  if (!keep) S.sel = null;
  S.revise = null; S.lost = null;
  toast(text, { go });
  mood("done");
  render();
  $("#page-body [data-fresh]")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
  // Not a redraw: someone may be typing by then.
  setTimeout(() => { for (const id of ids) S.fresh.delete(id); document.querySelectorAll("[data-fresh]").forEach((el) => el.removeAttribute("data-fresh")); }, 2600);
}
function undo() {
  if (!past.length) return;
  D = JSON.parse(past.pop());
  Object.assign(S, { sel: null, revise: null, lost: null });
  toast(t("撤销了", "Undone"), { undo: false });
  render();
}
function lost(text) { S.lost = text; mood("think"); render("line"); }

function accept(item) {
  remember();
  const texts = item.steps.map((step) => doneText(item, step)), ids = item.steps.map((step) => carry(item, step));
  item.state = "done";
  item.receipt = texts.join(t("，", ", "));
  done(item.receipt, { ids });
}
function decline(item) {
  remember();
  item.state = "no";
  item.receipt = t("没做：", "Not done: ") + (item.from.kind === "mail" ? pick(mail(item.from.id).sub) : item.from.kind === "todo" ? pick(todo(item.from.id).title) : pick(item.from.text));
  done(t("不做了", "Left alone"));
}
/** The user changed a thing by hand: what Alfred proposed for it gives way. A reply that is still owed stays,
    and says what the user chose. */
function yieldTo(kind, id, name) {
  for (const item of D.props) {
    if (item.state !== "open") continue;
    const hit = item.steps.find((step) => (kind === "event" && step.kind === "move" && step.ev === id) || (kind === "todo" && step.kind === "due" && step.todo === id));
    if (!hit) continue;
    const reply = item.steps.find((step) => step.kind === "reply"), e = kind === "event" && event(id);
    if (reply && e) {
      if (!reply.text) { const text = t(`可以，改到${wd(e.day)} ${e.start}。日程我已经挪了。`, `Sure, let's make it ${wd(e.day)} at ${e.start}. I have moved the calendar event.`); reply.text = [text, text]; }
      item.steps = item.steps.filter((step) => step !== hit);
    } else { item.state = "no"; item.receipt = t(`你自己办了：${name}`, `You did it yourself: ${name}`); }
  }
}
/** A few words change a proposal: a day or a time moves its steps; anything else is the reply itself. */
function revise(item, text) {
  const got = read(text);
  const before = JSON.stringify(D);
  let changed = false;
  for (const step of item.steps) {
    if (step.kind === "move" || step.kind === "add") { if (got.day) { step.day = got.day; changed = true; } if (got.start) { step.start = got.start; changed = true; } }
    else if ((step.kind === "due" || step.kind === "todo") && got.day) { step.day = got.day; changed = true; }
  }
  const reply = item.steps.find((step) => step.kind === "reply");
  if (!changed && reply) { reply.text = [text, text]; changed = true; }
  if (!changed) return lost(text);
  past.push(before);
  done(t("改好了，等你点头", "Changed. Waiting for your yes"), { ids: [item.id] });
}
function todoCommand(item, text) {
  const q = text.toLowerCase(), got = read(text), name = pick(item.title);
  if (/做完|完成|搞定|\bdone\b|finished/.test(q)) { remember(); item.done = true; yieldTo("todo", item.id, name); return done(t(`做完了：${name}`, `Done: ${name}`)); }
  if (/删|不要了|算了|delete|remove|drop/.test(q)) { remember(); D.todos = D.todos.filter((other) => other !== item); yieldTo("todo", item.id, name); return done(t(`删了：${name}`, `Removed: ${name}`)); }
  if (got.day) { remember(); item.due = got.day; yieldTo("todo", item.id, name); return done(t(`${name}改到${dayText(got.day)}`, `${name} now due ${dayText(got.day).toLowerCase()}`), { ids: [item.id] }); }
  lost(text);
}
function eventCommand(item, text) {
  const q = text.toLowerCase(), got = read(text), name = pick(item.title);
  const tell = item.who ? t(` · 会告诉${pick(item.who)}`, ` · ${pick(item.who)} will be told`) : "";
  if (/取消|删|cancel|delete/.test(q)) { remember(); D.events = D.events.filter((other) => other !== item); yieldTo("event", item.id, name); return done(t(`取消了：${name}`, `Cancelled: ${name}`) + tell); }
  const shift = /晚.*小时|推迟|hours? later/.test(q) ? 60 : /早.*小时|提前|hours? earlier/.test(q) ? -60 : 0;
  if (!shift && !got.day && !got.start) return lost(text);
  remember();
  const length = mins(item.end) - mins(item.start), begin = got.start ? mins(got.start) : mins(item.start) + shift;
  Object.assign(item, { day: got.day ?? item.day, start: hhmm(begin), end: hhmm(begin + length) });
  yieldTo("event", item.id, name);
  done(t(`${name}挪到${wd(item.day)} ${item.start}`, `${name} moved to ${wd(item.day)} ${item.start}`) + tell, { ids: [item.id] });
}
/** Words about a mail: put off as a todo, or a reply. A reply is only a draft until it is sent with a yes. */
function mailCommand(item, text) {
  const draft = draftFor(item.id);
  if (draft) return revise(draft, text);
  const q = text.toLowerCase(), got = read(text);
  if (/待办|todo/.test(q) || (got.day && /回|再|reply|later/.test(q))) {
    remember();
    const id = uid(), day = got.day ?? TODAY;
    D.todos.push({ id, title: [`回${item.who[0]}`, `Reply to ${item.who[1]}`], area: null, due: day });
    return done(t(`记到待办 · ${dayText(day)}`, `Todo added · ${dayText(day)}`), { ids: [id], go: "todos" });
  }
  remember();
  const id = uid();
  D.props.push({ id, own: true, state: "open", from: { kind: "mail", id: item.id }, steps: [{ kind: "reply", mail: item.id, text: [text, text] }] });
  done(t("草稿在下面，点发送才发", "Draft below. It goes when you press send"), { ids: [id] });
}
function command(text) {
  const it = target();
  text = text.trim();
  if (!it || !text) return;
  S.lost = null;
  if (it.kind === "todo") todoCommand(todo(it.id), text);
  else if (it.kind === "event") eventCommand(event(it.id), text);
  else if (it.kind === "prop") revise(prop(it.id), text);
  else mailCommand(mail(it.id), text);
}
/** One sentence becomes a todo or an event where it belongs. A question goes to the conversation. */
function capture(text) {
  const got = reading(text);
  Object.assign(S, { kind: null, day: undefined, dayMenu: false });
  if (got.kind === "ask") return talk(text);
  remember();
  const id = uid(), title = [got.title, got.title];
  if (got.kind === "event") {
    const day = got.day ?? TODAY;
    D.events.push({ id, title, day, start: got.start, end: hhmm(mins(got.start) + 60), area: null });
    done(t(`记到日程 · ${dayText(day)} ${got.start}`, `On the calendar · ${dayText(day)} ${got.start}`), { ids: [id], go: "cal" });
  } else {
    D.todos.push({ id, title, area: null, due: got.day });
    done(t("记到待办", "Todo added") + (got.day ? ` · ${dayText(got.day)}` : ""), { ids: [id], go: "todos" });
  }
}
/** The scripted Alfred: one question it can answer with something to press; a line for everything else. */
function answer(asked) {
  const exp = todo("exp");
  if (/先做|first/i.test(asked) && exp && !exp.done && away(exp.due) < 0) return {
    text: t(`先做「${exp.title[0]}」：逾期 ${-away(exp.due)} 天，半小时能做完。今天 16:00 以后你是空的。`, `Start with “${exp.title[1]}”: ${-away(exp.due)} days overdue, half an hour of work. You are free today after 16:00.`),
    act: { run: "exp-today", label: t("排到今天 16:00", "Book it today at 16:00") },
  };
  return { text: t("这句原型里没编答案。真的 Alfred 会在这里答一两句；说不完的，展开成对话。", "This prototype has no answer written for that. The real Alfred answers here in a line or two; anything longer opens as a conversation.") };
}
/** A question, or a sentence the reader could not place: Alfred answers out of the bottom line. */
async function talk(text) {
  const turn = { asked: text ?? S.lost ?? "", text: null, act: null };
  S.turns.push(turn);
  Object.assign(S, { card: true, lost: null, sel: null, revise: null });
  mood("think"); render();
  await sleep(700);
  if (!S.turns.includes(turn)) return;
  Object.assign(turn, answer(turn.asked));
  // Not a full redraw: the next sentence may already be on its way.
  mood("flow"); renderUp(); renderTurns();
}
/** What an answer offered to do, once it is pressed. */
function run(what) {
  const turn = S.turns.at(-1), item = todo("exp");
  if (what !== "exp-today" || !item) return;
  remember();
  const id = uid(), name = pick(item.title);
  Object.assign(item, { due: TODAY, by: true });
  D.events.push({ id, title: item.title, day: TODAY, start: "16:00", end: "16:30", area: item.area, by: true });
  yieldTo("todo", item.id, name);
  turn.act = null; S.card = false;
  done(t(`${name}排在今天 16:00`, `${name} booked today at 16:00`), { ids: [id, item.id], go: "cal" });
}
function renderTurns() {
  $("#turns").innerHTML = S.turns.map((turn) => `<div class="said">${esc(turn.asked)}</div><p>${turn.text ? esc(turn.text) : t("在想…", "Thinking…")}</p>`).join("")
    + `<p class="note">${t("这里只有记录。接着说，还是写在底部那一行。", "This is only the transcript. The next sentence still goes in the bottom line.")}</p>`;
}

/* ── Alfred's figure, in the bottom line ── */
const isDark = () => document.documentElement.dataset.scheme === "dark";
const slot = $("span[data-fig]"), svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", "0 0 120 120"); svg.setAttribute("class", "fig"); svg.setAttribute("aria-hidden", "true");
slot.replaceWith(svg);
let figure = createFigure(svg, { width: 5.6, small: true, dark: isDark() });
let moodTimer;
function mood(state) { S.mood = state; clearTimeout(moodTimer); moodTimer = setTimeout(() => { S.mood = null; syncFigure(); }, 1600); syncFigure(); }
function syncFigure() { figure.setState(S.mood ?? (S.focus ? "listen" : "rest")); figure.refresh(); }

/* ── Drawing everything ── */
function renderProto() {
  $("#proto").innerHTML = `<b>${t("少说话", "Fewer words")}</b><span class="lab">${t("改一件事，话说在", "Words about a thing go")}</span>`
    + [["bar", t("底部那一行", "In the bottom line")], ["near", t("它旁边", "Beside it")]].map(([key, label]) => `<button type="button" data-edit="${key}" aria-pressed="${S.edit === key}">${label}</button>`).join("")
    + `<span class="what">${t("Alfred 先提议 · 记一句不回话 · 点一下就改", "Alfred goes first · one line, no reply · change in place")}</span>`
    + `<a href="ask.html">${t("聊天的四种", "The four chats")}</a><button type="button" data-reset>${t("重来", "Reset")}</button><button type="button" data-lang>${S.lang === "en" ? "中文" : "EN"}</button><button type="button" data-scheme aria-label="${t("深浅", "Light or dark")}">◐</button>`;
}
/** Redraw. `focus`: "line" puts the caret in the line that is open on the page; "cap" in the bottom line. */
function render(focus) {
  document.documentElement.lang = S.lang === "en" ? "en" : "zh-CN";
  document.title = t("Alfred：少说话", "Alfred: fewer words");
  $("#app").toggleAttribute("data-panel", S.panel);
  renderProto(); renderPage(); renderUp(); syncFigure();
  renderTurns();
  if (focus === "line") ($("#page-body form.line input") ?? (S.edit === "bar" ? input : null))?.focus();
  if (focus === "cap") input.focus();
}
function reset() {
  D = sample(); past.length = 0; clearTimeout(toastTimer);
  Object.assign(S, { sel: null, mail: "lin", revise: null, lost: null, kind: null, day: undefined, dayMenu: false, toast: null, turns: [], card: false, panel: false, mood: null });
  S.fresh.clear(); input.value = "";
  render();
}
function go(page, id) {
  Object.assign(S, { page, sel: null, revise: null, lost: null });
  if (page === "mail" && id) S.mail = id;
  render();
}
async function dictate(field, text) {
  field.focus(); field.value = "";
  for (const char of text) { field.value += char; field.dispatchEvent(new Event("input", { bubbles: true })); await sleep(S.lang === "en" ? 26 : 70); }
}

/* ── Events ── */
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-accept],[data-decline],[data-revise],[data-opt],[data-toggle],[data-sel],[data-mail],[data-chip],[data-revchip],[data-go],[data-talk],[data-undo],[data-kind],[data-daymenu],[data-day],[data-fill],[data-page],[data-unabout],[data-mic],[data-edit],[data-reset],[data-lang],[data-scheme],[data-close],[data-run],[data-expand],[data-dismiss]");
  if (!el) return;
  const d = el.dataset;
  if ("accept" in d) accept(prop(d.accept));
  else if ("decline" in d) decline(prop(d.decline));
  else if ("revise" in d) {
    // With the bottom line, "change" attaches the proposal to it; with the line beside things, one opens in the card.
    if (S.edit === "bar") S.sel = onProp(prop(d.revise)) ? null : { kind: "prop", id: d.revise }; else S.revise = d.revise;
    S.lost = null; render("line");
  }
  else if ("opt" in d) {
    const [id, n] = d.opt.split(":"), item = prop(id);
    remember();
    item.answered = true; item.steps[0].title = item.ask.options[Number(n)].title;
    past.pop(); accept(item);
  }
  else if ("toggle" in d) { const item = todo(d.toggle); remember(); item.done = !item.done; if (item.done) yieldTo("todo", item.id, pick(item.title)); done(item.done ? t(`做完了：${pick(item.title)}`, `Done: ${pick(item.title)}`) : t(`没做完：${pick(item.title)}`, `Open again: ${pick(item.title)}`)); }
  else if ("sel" in d) {
    const [kind, id] = d.sel.split(":"), same = S.sel?.kind === kind && S.sel.id === id;
    S.sel = same ? null : { kind, id }; S.lost = null; S.revise = null;
    render(same ? undefined : "line");
  }
  else if ("mail" in d) { Object.assign(S, { mail: d.mail, sel: null, revise: null, lost: null }); mail(d.mail).unread = false; render(); }
  else if ("chip" in d) command(d.chip);
  else if ("revchip" in d) { const [id, text] = d.revchip.split("|"); revise(prop(id), text); }
  else if ("go" in d) go(...d.go.split(":"));
  else if ("talk" in d) talk();
  else if ("undo" in d) undo();
  else if ("kind" in d) { S.kind = reading(input.value).kind === "todo" ? "event" : "todo"; renderUp(); input.focus(); }
  else if ("daymenu" in d) { S.dayMenu = !S.dayMenu; renderUp(); input.focus(); }
  else if ("day" in d) { S.day = d.day || null; S.dayMenu = false; renderUp(); input.focus(); }
  else if ("fill" in d) { input.value = d.fill; S.toast = null; renderUp(); input.focus(); }
  else if ("page" in d) go(d.page);
  else if ("unabout" in d) { S.sel = null; S.lost = null; render("cap"); }
  else if ("mic" in d) {
    const it = target(), about = d.mic === "near" || (S.edit === "bar" && it);
    const field = d.mic === "near" ? el.closest("form").querySelector("input") : input;
    dictate(field, !about ? t("周五下午三点和王老师喝咖啡", "Coffee with Mr Wang Friday at 3pm") : it.kind === "mail" ? t("收到，谢谢", "Got it, thank you") : it.kind === "prop" ? t("下午四点", "4pm") : it.kind === "event" ? t("挪到明天下午四点", "Move it to tomorrow at 4pm") : t("挪到下周一", "Move it to next Monday"));
  }
  else if ("edit" in d) { Object.assign(S, { edit: d.edit, sel: null, revise: null, lost: null }); render(); }
  else if ("reset" in d) reset();
  else if ("lang" in d) { S.lang = S.lang === "en" ? "zh" : "en"; reset(); }
  else if ("scheme" in d) { document.documentElement.dataset.scheme = isDark() ? "light" : "dark"; figure.destroy(); figure = createFigure(svg, { width: 5.6, small: true, dark: isDark() }); syncFigure(); }
  else if ("close" in d) { S.panel = false; S.card = false; render(); }
  else if ("run" in d) run(d.run);
  else if ("expand" in d) { S.panel = true; render("cap"); }
  else if ("dismiss" in d) { S.card = false; renderUp(); }
});
document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const form = ev.target, field = form.querySelector("input"), text = field.value.trim();
  if (!text) return;
  if (form.id === "cap-form") {
    field.value = "";
    if (S.edit === "bar" && target()) command(text); else capture(text);
    if (!S.panel) input.focus();
  }
  else if ("rev" in form.dataset) revise(prop(form.dataset.rev), text);
  else command(text);
});
input.addEventListener("input", () => { if (!input.value.trim()) Object.assign(S, { kind: null, day: undefined, dayMenu: false }); else S.toast = null; S.lost = null; renderUp(); });
input.addEventListener("focus", () => { S.focus = true; renderUp(); syncFigure(); });
input.addEventListener("blur", () => { S.focus = false; renderUp(); syncFigure(); });
/* Chips above the bottom line are pressed without taking the caret out of it. */
$("#cap-up").addEventListener("pointerdown", (ev) => { if (ev.target.closest("button")) ev.preventDefault(); });
document.addEventListener("keydown", (ev) => {
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && ev.key.toLowerCase() === "k") { ev.preventDefault(); input.focus(); }
  else if (mod && ev.key.toLowerCase() === "z" && !ev.target.value) { ev.preventDefault(); undo(); }
  else if (ev.key === "Escape") {
    if (S.panel) { S.panel = false; S.card = false; render(); }
    else if (S.card) { S.card = false; renderUp(); }
    else if (S.revise || S.sel) { Object.assign(S, { revise: null, sel: null, lost: null }); render(); }
    else document.activeElement?.blur();
  }
});

const scheme = params.get("scheme");
document.documentElement.dataset.scheme = scheme === "dark" || scheme === "light" ? scheme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
figure.destroy(); figure = createFigure(svg, { width: 5.6, small: true, dark: isDark() });
render();
</script>
</body>
</html>
