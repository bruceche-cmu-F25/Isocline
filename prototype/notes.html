<!doctype html>
<!--
  Zirma: Notes (v5, 2026-11-26). A prototype for docs/design/notes.md and docs/design/notes-two-layers.md. No build
  step; the pages are made up, and scripts stand in for the disk and the model.
  v5 keeps only the core, and every piece is general:
    Page     the one kind of thing. A page has an icon you pick (stored by name, `icon: cup`), a title (= file name),
             blocks and sub-pages. No system pages: no Quick Notes folder, no Check-up, no Updates page. A new page
             lands at the top of yours and shows first in Recent.
    Layers   yours, and Kept by Zirma (`zirma_notes/`). A Zirma page is an ordinary page whose every line names its
             sources (the small numbers); click one to go back to your words. You can remove a line (Zirma won't add
             it back) or make the page yours. "About you" is just one such page.
    Suggest  the only way Zirma changes your words: a change shown in place, Yes or No. Conflicts and check-up
             findings arrive this way, on the page they concern. Recent counts what waits.
    History  every page has one: who changed what, when; an entry can be undone while the page still matches it.
    Ask      one line at the bottom: type to find pages, Enter asks Zirma, and the answer cites your lines.
  What Zirma does here is a stand-in for the model: a Zirma page watches a few words; when a line of yours mentions
  one, Zirma adds it there (or updates the line it already took from it). When two of your lines link the same
  missing [[page]], Zirma starts a page for it. Both are logged and undoable.
  v4 (fixed system pages, Quick Notes) is kept as notes-v4.html; v2 (folders) as notes-folders.html.
-->
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zirma：笔记</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<style>
:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.23, 1, .32, 1);
  --side: color-mix(in oklch, var(--wash) 55%, var(--bg));
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { height: 100dvh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
button:disabled { cursor: default; }
h1, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--alf); outline-offset: 2px; }

/* ── The prototype's own strip ── */
.proto { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px 10px; background: var(--ink); color: var(--bg); font-size: 12px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.proto b { flex: none; padding: 0 6px; }
.proto .lab { flex: none; padding: 0 4px 0 10px; opacity: .6; }
.proto button { flex: none; height: 26px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 8px; opacity: .72; }
.proto button:hover { opacity: 1; }
.proto button[aria-pressed="true"] { background: var(--bg); color: var(--ink); opacity: 1; }
.proto .what { flex: 1; min-width: 0; padding: 0 10px; opacity: .7; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1100px) { .proto .what { display: none; } }

/* ── Frame ── */
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; }
.app { position: relative; flex: 1; min-width: 0; display: flex; background: var(--bg); container: app / inline-size; }
.stage[data-narrow] .app { max-width: 390px; box-shadow: 0 0 0 1px var(--line); }
.ib { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.ib:hover { background: var(--wash); color: var(--ink); }
.ib svg { width: 17px; height: 17px; }
.btn { flex: none; height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; border-radius: 8px; font-size: .8125rem; background: var(--raise); box-shadow: 0 0 0 1px var(--line); white-space: nowrap; }
.btn:hover { background: var(--wash); }
.btn svg { width: 15px; height: 15px; }
.btn.pri { background: var(--alf-solid); color: var(--on-alf); box-shadow: none; }
.btn.pri:hover { filter: brightness(1.06); }
.tag { flex: none; padding: 0 6px; border-radius: 5px; background: var(--alf-soft); color: var(--alf); font-size: .6875rem; font-weight: 600; line-height: 18px; }
.zm { color: var(--alf); }

/* ── Side: Recent and the two trees ── */
.side { flex: none; width: 248px; display: flex; flex-direction: column; background: var(--side); border-right: 1px solid var(--line-soft); }
.side-head { flex: none; display: flex; align-items: center; gap: 2px; height: 48px; padding: 0 8px 0 16px; }
.side-head b { flex: 1; min-width: 0; font-size: .875rem; font-weight: 600; }
.side-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 16px; }
.lab { display: flex; align-items: center; gap: 6px; height: 34px; padding: 14px 8px 0; color: var(--muted); font-size: .75rem; }
.lab svg { width: 13px; height: 13px; }
.node { position: relative; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 calc(4px + var(--d, 0) * 14px); border-radius: 8px; color: var(--copy); font-size: .875rem; cursor: pointer; user-select: none; }
.node:hover { background: var(--wash); color: var(--ink); }
.node[aria-current="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
.node .tw { flex: none; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; color: var(--muted); }
.node .tw:hover { background: var(--line-soft); }
.node .tw svg { width: 12px; height: 12px; transition: transform 160ms var(--ease); }
.node .tw[data-open] svg { transform: rotate(90deg); }
.node .tw.none { visibility: hidden; }
.ic { flex: none; width: 18px; height: 18px; display: grid; place-items: center; color: var(--muted); }
.ic svg { width: 16px; height: 16px; }
.node .nm { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.node .n { flex: none; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--alf-solid); color: var(--on-alf); font-size: .6875rem; font-weight: 600; line-height: 18px; text-align: center; }
.node .dot { flex: none; width: 6px; height: 6px; margin: 0 6px; border-radius: 50%; background: var(--alf); }
.node .add { flex: none; display: none; width: 22px; height: 22px; place-items: center; border-radius: 6px; color: var(--muted); }
.node:hover .add { display: grid; }
.node:hover .dot { display: none; }
.node .add:hover { background: var(--line-soft); color: var(--ink); }
.node .add svg { width: 14px; height: 14px; }
.zempty { padding: 2px 8px 0 28px; color: var(--muted); font-size: .8125rem; line-height: 1.5; }
.scrim { display: none; }

/* ── Main ── */
.main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { flex: none; display: flex; align-items: center; gap: 2px; height: 48px; padding: 0 10px; }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; overflow: hidden; color: var(--muted); font-size: .875rem; white-space: nowrap; }
.crumbs button { min-width: 0; display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 6px; border-radius: 6px; }
.crumbs button:hover { background: var(--wash); color: var(--ink); }
.crumbs button:last-child { color: var(--ink); }
.crumbs button span:last-child { overflow: hidden; text-overflow: ellipsis; }
.crumbs .sl { flex: none; padding: 0 1px; color: var(--line); }
.crumbs .ic svg { width: 14px; height: 14px; }
.only-narrow { display: none !important; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }
.doc { max-width: 740px; margin: 0 auto; padding: 36px 56px 180px; }

/* page head */
.head { position: relative; margin-bottom: 18px; }
.picon { width: 52px; height: 52px; display: grid; place-items: center; margin: 0 0 8px -6px; border-radius: 12px; color: var(--ink); }
.picon:not(:disabled):hover { background: var(--wash); }
.picon svg { width: 38px; height: 38px; stroke-width: 1.3; }
.addicon { display: inline-flex; align-items: center; gap: 4px; height: 26px; margin: 0 0 6px -6px; padding: 0 8px; border-radius: 6px; color: var(--muted); font-size: .8125rem; opacity: 0; transition: opacity 120ms; }
.head:hover .addicon, .addicon:focus-visible { opacity: 1; }
@media (hover: none) { .addicon { opacity: 1; } }
.addicon svg { width: 14px; height: 14px; }
.ttl { font-size: 2rem; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; outline: none; word-break: break-word; }
.ttl:empty::before { content: attr(data-ph); color: var(--line); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 10px; color: var(--muted); font-size: .8125rem; }
.meta .zm { width: 15px; height: 15px; }
.meta > span { min-width: 0; }

/* blocks */
.blk { position: relative; padding: 2px 0; border-radius: 6px; }
.blk .row { display: flex; align-items: flex-start; gap: 8px; }
.ed { flex: 1; min-width: 0; min-height: 1.6em; outline: none; white-space: pre-wrap; word-break: break-word; }
.ed[contenteditable]:empty::before { content: attr(data-ph); color: var(--line); }
.ed[contenteditable]:not(:focus):empty::before { content: ""; }
.blk.h { margin-top: 18px; }
.blk.h .ed { font-size: 1.25rem; font-weight: 650; line-height: 1.4; }
.bul { flex: none; width: 18px; height: 1.6em; display: grid; place-items: center; }
.bul::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.ck { flex: none; width: 16px; height: 16px; margin: calc(.8em - 8px) 1px 0; display: grid; place-items: center; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--muted); color: var(--on-alf); }
.ck[aria-checked="true"] { background: var(--alf-solid); box-shadow: none; }
.ck svg { width: 12px; height: 12px; stroke-width: 2.2; }
.blk.todo.done .ed { color: var(--muted); text-decoration: line-through; }
.wl { color: var(--alf); text-decoration: none; border-bottom: 1px solid color-mix(in oklch, var(--alf) 35%, transparent); cursor: pointer; }
.wl.missing { color: var(--copy); border-bottom: 1px dashed var(--line); }
.end { min-height: 96px; cursor: text; }

/* a suggestion in place */
.blk.sug .ed del { margin-right: 4px; color: var(--muted); text-decoration-color: var(--now); }
.blk.sug .ed ins { padding: 0 1px; border-radius: 3px; background: var(--alf-soft); color: var(--ink); text-decoration: none; }
.why { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 6px 0 4px 26px; padding: 8px 8px 8px 10px; border-radius: 10px; background: var(--alf-soft); color: var(--copy); font-size: .8125rem; line-height: 1.5; }
.blk.p .why, .blk.h .why { margin-left: 0; }
.why > .zm { width: 15px; height: 15px; }
.why .go { flex: 1 1 14em; min-width: 0; }
.why .acts { display: flex; gap: 6px; margin-left: auto; }

/* Zirma's lines and their sources */
.zls { display: flex; flex-direction: column; }
.zl { position: relative; display: flex; align-items: flex-start; gap: 8px; padding: 2px 30px 2px 0; border-radius: 6px; }
.zl .tx { flex: 1; min-width: 0; word-break: break-word; }
.zl .x { position: absolute; top: 3px; right: 2px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); opacity: 0; }
.zl:hover .x, .zl .x:focus-visible { opacity: 1; }
@media (hover: none) { .zl .x { opacity: .55; } }
.zl .x:hover { background: var(--wash); color: var(--ink); }
.zl .x svg { width: 14px; height: 14px; }
.s { display: inline-block; min-width: 17px; height: 17px; margin-left: 4px; padding: 0 4px; border-radius: 5px; background: var(--alf-soft); color: var(--alf); font-size: .6875rem; font-weight: 650; line-height: 17px; text-align: center; vertical-align: 1px; }
.s:hover { background: var(--alf-solid); color: var(--on-alf); }
.s + .s { margin-left: 2px; }
@keyframes flash { from { background: var(--alf-soft); box-shadow: 0 0 0 4px var(--alf-soft); } to { background: transparent; box-shadow: 0 0 0 4px transparent; } }
.flash { animation: flash 1.8s var(--ease); }

/* rows: sub-pages, sources, backlinks, recent */
.sec { margin-top: 36px; }
.sec h3 { margin-bottom: 4px; color: var(--muted); font-size: .75rem; font-weight: 500; }
.pr { width: 100%; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 4px 8px; border-radius: 8px; color: var(--copy); font-size: .875rem; }
.sec > .pr { width: calc(100% + 16px); margin-left: -8px; }
.pr:hover { background: var(--wash); color: var(--ink); }
.pr .nm { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pr .num { flex: none; width: 18px; color: var(--alf); font-size: .75rem; font-weight: 650; text-align: center; }
.pend { width: 100%; display: flex; align-items: center; gap: 10px; margin: 18px 0 6px; padding: 10px 12px; border-radius: 12px; background: var(--alf-soft); color: var(--ink); font-size: .875rem; }
.pend span { flex: 1; min-width: 0; }
.pend svg { width: 16px; height: 16px; color: var(--alf); }
.rec { margin-top: 18px; }
.rr { width: calc(100% + 16px); display: flex; align-items: center; gap: 12px; padding: 10px 8px; margin-left: -8px; border-radius: 10px; }
.rr:hover { background: var(--wash); }
.rr .rt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rr .rt b, .rr .rt span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rr .rt b { font-weight: 600; font-size: .9375rem; }
.rr .rt span { color: var(--muted); font-size: .8125rem; }
.rr .rm { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; color: var(--muted); font-size: .75rem; white-space: nowrap; }
.rr .ic { width: 22px; height: 22px; }
.rr .ic svg { width: 18px; height: 18px; }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin-top: 24px; color: var(--muted); }

/* ── Ask: one line at the bottom ── */
.ask { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 16px 14px; pointer-events: none; }
.ask > * { pointer-events: auto; width: min(640px, 100%); }
.askbox { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 8px 0 14px; border-radius: 14px; background: var(--raise); box-shadow: var(--shadow), 0 0 0 1px var(--line); }
.askbox .ic { color: var(--muted); }
.askbox input { flex: 1; min-width: 0; border: 0; outline: none; background: none; }
.askbox input::placeholder { color: var(--muted); }
.askbox kbd { flex: none; padding: 0 6px; border-radius: 5px; box-shadow: 0 0 0 1px var(--line); color: var(--muted); font: .6875rem/18px var(--sans); }
@container app (max-width: 720px) { .askbox kbd { display: none; } }
.askout { max-height: min(50vh, 420px); overflow-y: auto; padding: 8px; border-radius: 14px; background: var(--raise); box-shadow: var(--shadow), 0 0 0 1px var(--line); }
.askout .ah { display: flex; align-items: center; gap: 6px; padding: 6px 8px 2px; color: var(--muted); font-size: .75rem; }
.askout .ah svg { width: 13px; height: 13px; }
.ans { padding: 4px 6px 6px; }
.aq { display: flex; align-items: flex-start; gap: 8px; }
.aq b { flex: 1; min-width: 0; padding-top: 3px; word-break: break-word; }
.al { margin: 6px 0 4px; color: var(--copy); font-size: .875rem; }
.ans .zl { padding-right: 0; font-size: .9375rem; }
.ans .sec { margin-top: 10px; }

/* ── History ── */
.hist { position: absolute; top: 0; right: 0; bottom: 0; z-index: 20; width: 340px; display: flex; flex-direction: column; background: var(--raise); border-left: 1px solid var(--line); box-shadow: var(--shadow); }
.hh { flex: none; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--line-soft); }
.hh b { flex: 1; min-width: 0; font-size: .875rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.hs { flex: 1; min-height: 0; overflow-y: auto; }
.he { padding: 12px 16px 14px; border-bottom: 1px solid var(--line-soft); }
.he.undone .hsay, .he.undone .lines { opacity: .5; }
.hw { display: flex; align-items: center; gap: 8px; font-size: .75rem; color: var(--muted); }
.who { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); font-weight: 600; }
.who svg { width: 13px; height: 13px; }
.hw .tm { margin-left: auto; }
.hsay { margin: 4px 0 6px; font-size: .875rem; }
.lines { margin-bottom: 8px; padding: 6px 8px; border-radius: 8px; background: var(--paper); font-size: .8125rem; line-height: 1.5; }
.ln { word-break: break-word; }
.ln.add { color: var(--ok); }
.ln.del { color: var(--muted); text-decoration: line-through; }
.ln::before { display: inline-block; width: 14px; font-family: var(--mono); }
.ln.add::before { content: "+"; }
.ln.del::before { content: "-"; }
.hist .none { padding: 16px; color: var(--muted); font-size: .875rem; }

/* ── Menus, sheet, toast ── */
.pop { position: fixed; z-index: 50; min-width: 200px; padding: 6px; border-radius: 12px; background: var(--raise); box-shadow: var(--shadow), 0 0 0 1px var(--line); }
.mi { width: 100%; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; font-size: .875rem; white-space: nowrap; }
.mi:hover { background: var(--wash); }
.mi svg { width: 16px; height: 16px; color: var(--muted); }
.mi.bad { color: var(--now); }
.mi.bad svg { color: currentColor; }
.icons { display: grid; grid-template-columns: repeat(6, 34px); gap: 4px; padding: 4px; }
.icons button { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; color: var(--ink); }
.icons button:hover, .icons button[aria-pressed="true"] { background: var(--wash); }
.pop .sep { height: 1px; margin: 6px 4px; background: var(--line-soft); }
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: oklch(0 0 0 / .28); }
.sheet { width: min(640px, 100%); max-height: 82vh; display: flex; flex-direction: column; border-radius: 16px; background: var(--raise); box-shadow: var(--shadow); }
.sheet .hh code { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font: .75rem var(--mono); }
.sheet pre { margin: 0; padding: 16px; overflow: auto; font: .8125rem/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; }
.toast { position: absolute; left: 50%; bottom: 78px; z-index: 40; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; width: max-content; max-width: calc(100% - 32px); padding: 6px 6px 6px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: .8125rem; box-shadow: var(--shadow); }
.toast span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.toast span:last-child { padding-right: 8px; }
.toast button { flex: none; padding: 4px 8px; border-radius: 7px; font-weight: 600; opacity: .8; }
.toast button:hover { opacity: 1; background: color-mix(in oklch, var(--bg) 14%, transparent); }

/* ── Narrow: the side becomes a drawer, history covers the page ── */
@container app (max-width: 720px) {
  .side { position: absolute; z-index: 30; inset: 0 auto 0 0; width: min(290px, 86%); box-shadow: var(--shadow); display: none; }
  .app[data-drawer] .side { display: flex; }
  .app[data-drawer] .scrim { display: block; position: absolute; inset: 0; z-index: 29; background: oklch(0 0 0 / .25); }
  .only-narrow { display: grid !important; }
  .doc { padding: 20px 20px 180px; }
  .ttl { font-size: 1.625rem; }
  .hist { width: 100%; border-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .flash { animation: none; background: var(--alf-soft); } .node .tw svg { transition: none; } }
</style>
</head>
<body>
<div class="proto" id="proto"></div>
<div class="stage" id="stage">
  <div class="app" id="app">
    <aside class="side">
      <div class="side-head"><b id="sideName"></b><button type="button" class="ib" data-a="new" id="newBtn"></button></div>
      <nav class="side-scroll" id="tree"></nav>
    </aside>
    <div class="scrim" data-a="drawer"></div>
    <main class="main">
      <div class="top">
        <button type="button" class="ib only-narrow" data-a="drawer" id="drawerBtn"></button>
        <div class="crumbs" id="crumbs"></div>
        <button type="button" class="ib" data-a="hist" id="histBtn"></button>
        <button type="button" class="ib" data-a="more" id="moreBtn"></button>
      </div>
      <div class="scroll" id="scroll"><div class="doc" id="doc"></div></div>
      <div class="ask">
        <div class="askout" id="askout" hidden></div>
        <label class="askbox"><span class="ic" id="askIcon"></span><input id="ask" autocomplete="off" spellcheck="false"><kbd>⌘K</kbd></label>
      </div>
      <aside class="hist" id="hist" hidden></aside>
      <div class="toast" id="toast" hidden></div>
    </main>
  </div>
</div>
<div class="pop" id="pop" hidden></div>
<div class="modal" id="modal" hidden></div>
<script>
const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const MIN = 6e4, HOUR = 36e5, DAY = 864e5;
const NOW = new Date(2026, 10, 26, 15, 0).getTime();
let S = { lang: params.get("lang") === "en" ? "en" : "zh" };

function seed(kind) {
  S = { lang: S.lang, kind, narrow: S.narrow, pages: {}, hist: [], at: "recent", open: new Set(["p1"]), notMake: [], clock: NOW, histOpen: false, drawer: false, answer: null };
  if (kind === "empty") return;
  const D = SAMPLE[S.lang];
  for (const [id, title, icon, parent, ago, blocks] of D.you) {
    S.pages[id] = { id, title, icon, owner: "you", parent, t: NOW - ago, blocks: blocks.map(([k, text, extra], i) => ({ id: `${id}b${i + 1}`, k, text, ...(k === "todo" ? { done: false } : {}), ...extra })) };
  }
  for (const [id, title, icon, watch, ago, lines] of D.zirma) {
    S.pages[id] = { id, title, icon, owner: "z", parent: null, watch, not: [], t: NOW - ago, blocks: lines.map(([text, src], i) => ({ id: `${id}b${i + 1}`, k: "li", text, src })) };
  }
  const z1 = S.pages.z1;
  S.hist.push(
    { id: "e2", page: "z1", who: "z", at: NOW - 7 * HOUR, say: D.took, lines: [{ k: "add", text: z1.blocks[3].text }], ops: [{ k: "add", page: "z1", blk: clone(z1.blocks[3]), at: 3 }], undone: false },
    { id: "e1", page: "z1", who: "z", at: NOW - 30 * HOUR, say: D.made, lines: z1.blocks.slice(0, 3).map((b) => ({ k: "add", text: b.text })), ops: [], undone: false },
  );
}

/* ── Reading the model ── */
const all = () => Object.values(S.pages);
const yours = () => all().filter((p) => p.owner === "you");
const kids = (id) => all().filter((p) => p.parent === id);
const cur = () => S.pages[S.at];
const nameOf = (p) => p?.title || t("无标题", "Untitled");
const byTitle = (x) => all().find((p) => p.title && p.title.toLowerCase() === x.toLowerCase());
const blockAt = (bid) => { for (const p of all()) { const b = p.blocks.find((x) => x.id === bid); if (b) return [p, b]; } return []; };
const LINK = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;
const plain = (s) => s.replace(LINK, (m, a, b) => b || a);
const linksIn = (s) => [...s.matchAll(LINK)].map((m) => m[1].trim());
const pending = () => yours().flatMap((p) => p.blocks.filter((b) => b.sug).map((b) => [p, b]));
const srcPages = (z) => [...new Set(z.blocks.flatMap((b) => b.src ?? []).map((r) => blockAt(r)[0]?.id).filter(Boolean))];
const snippet = (p) => plain(p.blocks.find((b) => b.text.trim())?.text ?? "");
const inline = (s) => esc(s).replace(LINK, (m, a, b) => `<a class="wl${byTitle(a.trim()) ? "" : " missing"}" data-a="link" data-t="${a.trim()}">${b || a}</a>`);
const two = (n) => String(n).padStart(2, "0");
function when(ms) {
  const d = new Date(ms), n = new Date(S.clock), hm = `${two(d.getHours())}:${two(d.getMinutes())}`;
  const days = Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / DAY);
  if (S.clock - ms < 2 * MIN) return t("刚刚", "just now");
  if (days === 0) return t(`今天 ${hm}`, `today ${hm}`);
  if (days === 1) return t(`昨天 ${hm}`, `yesterday ${hm}`);
  return `${d.getMonth() + 1}-${d.getDate()}`;
}
const stamp = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}`; };
function pathOf(p) {
  if (p.owner === "z") return `notes/zirma_notes/${nameOf(p)}.md`;
  const chain = [];
  for (let q = p; q; q = S.pages[q.parent]) chain.unshift(nameOf(q));
  return `notes/${chain.join("/")}.md`;
}
const srcTail = (b) => {
  const ts = [...new Set((b.src ?? []).map((r) => blockAt(r)[0]).filter(Boolean).map((p) => `[[${p.title}]]`))];
  return ts.length ? t(`（${ts.join("、")}）`, ` (${ts.join(", ")})`) : "";
};

/* ── History: every change is an entry of small steps that can run backwards ── */
function log(page, who, say, ops, lines = []) {
  const e = { id: nid("e"), page, who, at: S.clock, say, ops, lines, undone: false };
  S.hist.unshift(e);
  return e;
}
const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
function run(op, back) {
  const pg = S.pages[op.page];
  if (op.k === "set") {
    const b = pg?.blocks.find((x) => x.id === op.b);
    if (!b || b.text !== (back ? op.to : op.from)) return false;
    b.text = back ? op.from : op.to;
    return true;
  }
  if (op.k === "add" || op.k === "del") {
    const adding = (op.k === "add") === !back;
    if (!pg) return false;
    const i = pg.blocks.findIndex((x) => x.id === op.blk.id);
    if (adding ? i >= 0 : i < 0) return false;
    adding ? pg.blocks.splice(Math.min(op.at, pg.blocks.length), 0, clone(op.blk)) : pg.blocks.splice(i, 1);
    return true;
  }
  if (op.k === "page") { // whole pages: made, deleted, made yours
    const want = back ? op.after : op.before, put = back ? op.before : op.after;
    if (!want.every((w) => same(S.pages[w.id], w.data))) return false;
    for (const w of put) w.data ? (S.pages[w.id] = clone(w.data)) : delete S.pages[w.id];
    return true;
  }
  return false;
}
function flip(e) {
  const back = !e.undone, ops = back ? [...e.ops].reverse() : e.ops;
  // An entry undoes whole or not at all.
  const trial = clone(S.pages);
  if (!ops.every((op) => run(op, back))) { S.pages = trial; toast(t("这一页后来又改过，撤不回了", "The page changed since; can’t undo this")); return; }
  e.undone = back;
  if (!S.pages[S.at]) S.at = "recent";
  render();
}

/* ── Zirma (a stand-in for the model) ── */
function zWatch(pg, b) {
  if (pg.owner !== "you") return;
  setTimeout(() => {
    const [p] = blockAt(b.id);
    if (!p || p.owner !== "you") return;
    const text = b.text.trim();
    if (!text) return;
    const low = plain(text).toLowerCase(), done = [];
    for (const z of all().filter((x) => x.owner === "z")) {
      if (!z.watch?.length || z.not.includes(b.id) || !z.watch.some((w) => low.includes(w.toLowerCase()))) continue;
      const own = z.blocks.find((l) => l.src.length === 1 && l.src[0] === b.id);
      if (own && own.text !== text) {
        const from = own.text; own.text = text; z.t = tick();
        done.push([z, log(z.id, "z", t(`因为《${nameOf(p)}》改了，更新了一行`, `Updated a line, because “${nameOf(p)}” changed`), [{ k: "set", page: z.id, b: own.id, from, to: text }], [{ k: "del", text: from }, { k: "add", text }])]);
      } else if (!z.blocks.some((l) => l.src.includes(b.id))) {
        const blk = { id: nid(`${z.id}b`), k: "li", text, src: [b.id] };
        z.blocks.push(blk); z.t = tick();
        done.push([z, log(z.id, "z", t(`因为《${nameOf(p)}》，加了一行`, `Added a line, from “${nameOf(p)}”`), [{ k: "add", page: z.id, blk: clone(blk), at: z.blocks.length - 1 }], [{ k: "add", text }])]);
      }
    }
    for (const name of linksIn(text)) {
      if (byTitle(name) || S.notMake.includes(name.toLowerCase())) continue;
      const refs = yours().flatMap((q) => q.blocks.filter((x) => linksIn(x.text).some((n) => n.toLowerCase() === name.toLowerCase())));
      if (refs.length < 2) continue;
      const id = nid("z");
      const zp = { id, title: name, icon: "doc", owner: "z", parent: null, watch: [name], not: [], t: tick(), blocks: refs.map((r) => ({ id: nid(`${id}b`), k: "li", text: r.text, src: [r.id] })) };
      S.pages[id] = zp;
      done.push([zp, log(id, "z", t(`你在 ${refs.length} 处提到「${name}」，开了这一页`, `You mention “${name}” in ${refs.length} places, so Zirma started this page`), [{ k: "page", page: id, before: [{ id, data: null }], after: [{ id, data: clone(zp) }] }], refs.map((r) => ({ k: "add", text: r.text })))]);
    }
    if (!done.length) return;
    renderTree();
    if (S.at === "recent" || cur()?.owner === "z") renderMain();
    const [z] = done[0];
    toast(done.length > 1 ? t(`Zirma 更新了 ${done.length} 页`, `Zirma updated ${done.length} pages`) : t(`Zirma 更新了《${nameOf(z)}》`, `Zirma updated “${nameOf(z)}”`),
      [[t("看看", "View"), () => go(z.id)], [t("撤回", "Undo"), () => done.slice().reverse().forEach(([, e]) => flip(e))]]);
  }, 900);
}

    <span class="lab">${t("外观", "Look")}</span><button type="button" data-p="light" ${on(!dark)}>${t("浅", "Light")}</button><button type="button" data-p="dark" ${on(dark)}>${t("深", "Dark")}</button>
    <span class="lab">${t("宽度", "Width")}</span><button type="button" data-p="wide" ${on(!S.narrow)}>${t("宽", "Wide")}</button><button type="button" data-p="narrow" ${on(!!S.narrow)}>${t("手机", "Phone")}</button>
    <span class="what">${esc(S.kind === "empty" ? t("空库：每一页都由你建；你写多了，Zirma 才开它的页。", "Empty: you make every page; Zirma starts its pages only as you write.") : SAMPLE[S.lang].hint)}</span>`;
  document.documentElement.lang = S.lang === "zh" ? "zh-CN" : "en";
  document.title = t("Zirma：笔记", "Zirma: Notes");
  $("#stage").toggleAttribute("data-narrow", !!S.narrow);
}
function renderTree() {
  const node = (p, d) => {
    const ch = kids(p.id), open = S.open.has(p.id), dot = p.blocks.some((b) => b.sug);

/* ── Ask: find pages as you type; Enter asks Zirma, and the answer cites your lines ── */
function terms(q) {
  const out = new Set();
  for (const w of q.toLowerCase().split(/[\s,，。.?？!！:：]+/)) {
    if (!w) continue;
    if (/[一-鿿]/.test(w)) {
      for (const part of w.replace(/什么|怎么|多少|哪里|哪些|是不是|我的|我|的|了|吗|呢|是|在|有|几/g, " ").split(/\s+/)) {
        if (part.length <= 2) { if (part) out.add(part); } else for (let i = 0; i < part.length - 1; i++) out.add(part.slice(i, i + 2));
      }
    } else if (w.length > 2 && !/^(the|and|what|how|was|did|does|for|with|about|my)$/.test(w)) out.add(w.replace(/s$/, ""));
  }
  return [...out];
}
function askLive() {
  const q = $("#ask").value.trim(), out = $("#askout");
  if (!q) { out.hidden = !S.answer; if (S.answer) out.innerHTML = S.answer; return; }
  const ps = all().filter((p) => nameOf(p).toLowerCase().includes(q.toLowerCase())).slice(0, 5);
  out.hidden = false;
  out.innerHTML = ps.map((p) => pageRow(p)).join("") + `<div class="ah">${ICON.zirma}${t("按 Enter 问 Zirma", "Press Enter to ask Zirma")}</div>`;
}
function answer(q) {
  const ts = terms(q), hits = [];
  for (const p of yours()) for (const b of p.blocks) {
    const low = plain(b.text).toLowerCase(), sc = ts.filter((w) => low.includes(w)).length;
    if (sc && b.text.trim() && b.k !== "h") hits.push([sc, p, b]);
  }
  hits.sort((a, b) => b[0] - a[0]);
  const top = hits.slice(0, 4), order = [...new Set(top.map((h) => h[1].id))];
  S.answer = `<div class="ans"><div class="aq"><b>${esc(q)}</b><button type="button" class="ib" data-a="ansclose" aria-label="${t("关闭", "Close")}">${ICON.x}</button></div>
    ${top.length ? `<p class="al">${t(`你的笔记里有 ${top.length} 处：`, `${top.length} place${top.length > 1 ? "s" : ""} in your notes:`)}</p>
      <ul class="zls">${top.map(([, , b]) => zLine({ id: b.id, text: b.text, src: [b.id] }, order, false)).join("")}</ul>
      <div class="sec"><h3>${t("出处", "Sources")}</h3>${order.map((id, i) => pageRow(S.pages[id], `<span class="num">${i + 1}</span>`)).join("")}</div>`
    : `<p class="al">${t("你的笔记里还没写过这个。", "Your notes don’t mention this yet.")}</p>`}</div>`;
  $("#ask").value = ""; $("#toast").hidden = true;
  $("#askout").innerHTML = S.answer; $("#askout").hidden = false;
}

function toMd(p) {

/* ── Events ── */
document.addEventListener("click", (e) => {
  const p = e.target.closest("[data-p]");
  if (p) {
    const v = p.dataset.p;
    if (v === "sample" || v === "empty") seed(v);
    else if (v === "zh" || v === "en") { S.lang = v; seed(S.kind); }
    else if (v === "light" || v === "dark") document.documentElement.dataset.scheme = v;
    else S.narrow = v === "narrow";
    $("#askout").hidden = true; $("#toast").hidden = true;
    return render();
  }
  const el = e.target.closest("[data-a]");
  if (!e.target.closest("#pop") && !(el && ["more", "icon"].includes(el.dataset.a))) closePop();
  if (e.target === $("#modal")) { $("#modal").hidden = true; return; }
  if (!el) { if (!e.target.closest(".ask") && !S.answer) $("#askout").hidden = true; return; }
  const a = el.dataset.a, pg = cur();
  switch (a) {
    case "go": return go(el.dataset.id, el.dataset.flash);
    case "recent": return go("recent");
    case "tw": e.stopPropagation(); S.open.has(el.dataset.id) ? S.open.delete(el.dataset.id) : S.open.add(el.dataset.id); return renderTree();
    case "new": e.stopPropagation(); closePop(); return newPage(el.dataset.parent || null);
    case "drawer": S.drawer = !S.drawer; return $("#app").toggleAttribute("data-drawer", S.drawer);
    case "hist": S.histOpen = !S.histOpen; return renderHist();
    case "undo": { const en = S.hist.find((x) => x.id === el.dataset.e); return en && flip(en); }
    case "link": return followLink(el.dataset.t);
    case "src": { const [sp] = blockAt(el.dataset.b); return sp && go(sp.id, el.dataset.b); }
    case "todo": { const [tp, b] = blockAt(el.dataset.b); b.done = !b.done; tp.t = tick(); return redrawDoc(); }
    case "end": {
      const last = pg.blocks[pg.blocks.length - 1];
      if (last && !last.text && !last.sug) return focusEl(document.querySelector(`.ed[data-b="${last.id}"]`));
      const nb = { id: nid(`${pg.id}b`), k: "p", text: "" };
      pg.blocks.push(nb);
      return redrawDoc(nb.id);
    }
    case "sugok": {
      const [sp, b] = blockAt(el.dataset.b), from = b.text, to = b.sug.to;
      b.text = to; delete b.sug; sp.t = tick();
      const en = log(sp.id, "you", t("接受了 Zirma 的建议", "Accepted Zirma’s suggestion"), [{ k: "set", page: sp.id, b: b.id, from, to }], [{ k: "del", text: from }, { k: "add", text: to }]);
      render();
      return toast(t("改好了", "Changed"), [[t("撤回", "Undo"), () => flip(en)]]);
    }
    case "sugno": { const [, b] = blockAt(el.dataset.b); delete b.sug; render(); return toast(t("好，不改", "OK, left as it was")); }
    case "xline": {
      const i = pg.blocks.findIndex((x) => x.id === el.dataset.b), blk = pg.blocks[i];
      pg.blocks.splice(i, 1); pg.not.push(...blk.src);
      const en = log(pg.id, "you", t("删掉了一行，Zirma 不会再加回来", "Removed a line; Zirma won’t add it back"), [{ k: "del", page: pg.id, blk: clone(blk), at: i }], [{ k: "del", text: blk.text }]);
      render();
      return toast(t("删掉了，Zirma 不会再加回来", "Removed; Zirma won’t add it back"), [[t("撤回", "Undo"), () => flip(en)]]);
    }
    case "own": return makeMine(pg);
    case "icon":
      return openPop(el, `<div class="icons">${Object.keys(PAGE_ICON).map((n) => `<button type="button" data-a="seticon" data-n="${n}" aria-label="${n}" title="${n}" aria-pressed="${pg.icon === n}">${PAGE_ICON[n]}</button>`).join("")}</div>${pg.icon ? `<div class="sep"></div><button type="button" class="mi" data-a="seticon" data-n="">${ICON.x}${t("去掉图标", "Remove icon")}</button>` : ""}`);
    case "seticon": pg.icon = el.dataset.n || null; closePop(); return render();
    case "more":
      return openPop(el, `<button type="button" class="mi" data-a="md">${ICON.md}${t("看它存成的 Markdown", "Show the Markdown file")}</button>
        ${pg.owner === "you" ? `<button type="button" class="mi" data-a="new" data-parent="${pg.id}">${ICON.sub}${t("新子页面", "New sub-page")}</button>` : ""}
        <div class="sep"></div><button type="button" class="mi bad" data-a="drop">${ICON.trash}${pg.owner === "z" ? t("删掉，不再整理这件事", "Delete; stop keeping this") : t("删除", "Delete")}</button>`);
    case "md": closePop(); return showMd(pg);
    case "mdclose": $("#modal").hidden = true; return;
    case "drop": closePop(); return dropPage(pg.id);
    case "ansclose": S.answer = null; $("#askout").hidden = true; return;
    case "toast": { $("#toast").hidden = true; return toastActs[+el.dataset.i]?.[1](); }
  }
});
document.addEventListener("mousedown", (e) => {
  // A link inside a line you can edit still opens on click.
  const l = e.target.closest(".ed[contenteditable] .wl");
  if (l) { e.preventDefault(); followLink(l.dataset.t); }
});
document.addEventListener("focusin", (e) => {
  const el = e.target;
  if (el.id === "ask") { if (el.value.trim()) askLive(); return; }
  if (!el.matches?.(".ed[contenteditable]")) return;
  const [, b] = blockAt(el.dataset.b);
  // While you edit a line it shows as written, [[links]] included.
  if (b && /\[\[/.test(b.text)) { el.textContent = b.text; focusEl(el); }
});
document.addEventListener("focusout", (e) => {
  if (S.rendering) return;
  const el = e.target;
  if (el.matches?.(".ed[contenteditable]")) {
    const [bp, b] = blockAt(el.dataset.b);
    if (!b) return;
    setText(bp, b, el.textContent);
    if (el.isConnected) el.innerHTML = inline(b.text);
  } else if (el.id === "ttl" && cur()) setTitle(cur(), el.textContent);
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#ask").focus(); return; }
  if (e.key === "Escape") {
    if (!$("#modal").hidden) { $("#modal").hidden = true; return; }
    if (!$("#pop").hidden) return closePop();
    if (e.target.id === "ask") { $("#ask").value = ""; S.answer = null; $("#askout").hidden = true; return e.target.blur(); }
    if (S.histOpen) { S.histOpen = false; return renderHist(); }
    if (S.drawer) { S.drawer = false; return $("#app").toggleAttribute("data-drawer", false); }
    if (e.target.matches?.(".ed, #ttl")) return e.target.blur();
  }
  if (e.target.id === "ask" && e.key === "Enter" && !e.isComposing && e.target.value.trim()) return answer(e.target.value.trim());
  if (e.target.matches?.(".node") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); return e.target.click(); }
  if (e.target.id === "ttl" && e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    setTitle(cur(), e.target.textContent);
    const first = cur().blocks.find((b) => !b.sug);
    return first ? focusEl(document.querySelector(`.ed[data-b="${first.id}"]`), true) : e.target.blur();
  }
  const el = e.target;
  if (!el.matches?.(".ed[contenteditable]") || e.isComposing) return;
  const pg = cur(), i = pg.blocks.findIndex((x) => x.id === el.dataset.b), b = pg.blocks[i];
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const text = el.textContent, off = caretOffset(el);
    if ((b.k === "li" || b.k === "todo") && !text) { b.k = "p"; delete b.done; return redrawDoc(b.id); }
    setText(pg, b, text.slice(0, off));
    const nb = { id: nid(`${pg.id}b`), k: b.k === "li" || b.k === "todo" ? b.k : "p", text: text.slice(off), ...(b.k === "todo" ? { done: false } : {}) };
    pg.blocks.splice(i + 1, 0, nb);
    return redrawDoc(nb.id, true);
  }
  if (e.key === "Backspace" && caretOffset(el) === 0 && getSelection().isCollapsed) {
    if (b.k !== "p") { e.preventDefault(); b.k = "p"; delete b.done; b.text = el.textContent; return redrawDoc(b.id, true); }
    const prev = pg.blocks[i - 1];
    if (!prev || prev.sug) return;
    e.preventDefault();
    const joinAt = prev.text.length;
    setText(pg, prev, prev.text + el.textContent);
    pg.blocks.splice(i, 1);
    redrawDoc();
    const pe = document.querySelector(`.ed[data-b="${prev.id}"]`);
    pe.textContent = prev.text; pe.focus();
    const node = pe.firstChild, r = document.createRange();
    if (node) { r.setStart(node, Math.min(joinAt, node.length)); r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "ask") return askLive();
  const el = e.target;
  if (!el.matches?.(".ed[contenteditable]")) return;
  const [, b] = blockAt(el.dataset.b);
  const m = b && b.k === "p" && el.textContent.match(/^(#{1,3} |[-*] |\[ ?\] )/);
  if (!m) return;
  // Markdown shortcuts at the start of a line: "# " heading, "- " list, "[] " to-do.
  b.k = m[1][0] === "#" ? "h" : m[1][0] === "[" ? "todo" : "li";
  if (b.k === "todo") b.done = false;
  b.text = el.textContent.slice(m[1].length);
  redrawDoc(b.id);
});

if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.scheme = "dark";
S.narrow = params.get("w") === "phone";
seed(params.get("data") === "empty" ? "empty" : "sample");
if (params.get("page") && S.pages[params.get("page")]) S.at = params.get("page");
render();
</script>
