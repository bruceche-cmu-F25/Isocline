<!doctype html>
<!--
  Zirma: Notes (v2, 2026-11-25). A prototype for docs/design/notes.md: no build step, sample notes (made up), and
  scripts in place of the disk, the file watcher and the model.
  The question it asks: what is a note in Zirma when the truth is a Markdown file in a folder?
    Tree     the library's folders on the left, the same tree as Links (v0.5): Recent and Quick Notes (随手记) on top,
             then the folders, nested. Counts include everything below. Drag a note onto a folder to move the file;
             drag a folder onto another to move it; a folder's ⋯ adds a sub-folder, renames it or removes it (its
             notes move up one level). On a narrow page the tree is a drawer behind the folder button.
    List     the picked folder: its sub-folders as rows first, then its notes. In Quick Notes, Zirma's guess at where
             a note belongs is a dashed chip; a click moves the file.
    Read     a note takes the whole page (a note is long; the pop-up card is for short things, and is still used
             here to confirm a delete). Double links open the other note; a link to a note that does not exist is
             dashed and makes it. An address that was saved in Links shows as that clip. Under the note: who links
             here, and addresses not saved yet.
    Write    the Markdown source, coloured, saved a moment after you stop. Typing [[ offers note names. (The app
             will use CodeMirror 6; here it is a textarea over a coloured copy of the same text.)
    Elsewhere  "changed elsewhere" in the strip plays another app writing the same file. While reading, the note
             just changes. While writing, your text is not saved over it: keep theirs, or save yours as a copy.
    Zirma   while reading, the line at the bottom carries the note: say what to change and Zirma proposes it in
             place (dashed, old line struck through). Yes / change / no. A proposal goes stale if the file changes.
  The line at the bottom on the list: a few words and return makes a note in Quick Notes; the same words also
  search what the notes say.
-->
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zirma：笔记</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<style>
:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.23, 1, .32, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
h1, h2, h3, h4, p, ul, ol, pre, blockquote { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--alf); outline-offset: 2px; }
.grow { flex: 1; min-width: 0; }

/* ── The prototype's own strip ── */
.proto { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px 10px; background: var(--ink); color: var(--bg); font-size: 12px; overflow-x: auto; white-space: nowrap; }
.proto b { flex: none; padding: 0 6px; }
.proto .lab { flex: none; padding: 0 4px 0 10px; opacity: .6; }
.proto button, .proto a { flex: none; height: 26px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 8px; opacity: .72; text-decoration: none; }
.proto button:hover, .proto a:hover { opacity: 1; }
.proto button[aria-pressed="true"] { background: var(--bg); color: var(--ink); opacity: 1; }
.proto .what { flex: 1; min-width: 0; padding: 0 10px; opacity: .7; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1100px) { .proto .what { display: none; } }
@media (max-width: 620px) { .proto .lab, .proto b { display: none; } }

/* ── Frame: the page column, narrow on demand so the container rules can be seen ── */
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; background: var(--paper, var(--bg)); }
.page { position: relative; flex: 1; min-width: 0; max-width: 100%; display: flex; background: var(--bg); container: page / inline-size; }
.stage[data-narrow] .page { max-width: 390px; box-shadow: 0 0 0 1px var(--line); }
.pane { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; container: pane / inline-size; }

/* ── Tree: the library's folders, the same tree as Links ── */
.tree { flex: none; width: 240px; display: flex; flex-direction: column; border-right: 1px solid var(--line-soft); background: var(--bg); }
.page[data-folded] .tree { display: none; }
.tree-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 8px 16px; }
.tree-head { display: flex; align-items: center; gap: 4px; height: 34px; padding: 0 2px 0 8px; color: var(--muted); font-size: .75rem; }
.node { position: relative; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 calc(6px + var(--d, 0) * 16px); border-radius: 8px; color: var(--copy); font-size: .875rem; cursor: pointer; user-select: none; }
.node:hover { background: var(--wash); color: var(--ink); }
.node[aria-current="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
.node.drop { box-shadow: inset 0 0 0 1.5px var(--alf); background: var(--alf-soft); }
.node .tw { flex: none; width: 14px; height: 14px; display: grid; place-items: center; color: var(--muted); transition: transform 160ms var(--ease); }
.node .tw svg { width: 12px; height: 12px; }
.node .tw[data-open] { transform: rotate(90deg); }
.node .tw.none { visibility: hidden; }
.node > svg.i { width: 16px; height: 16px; color: var(--muted); }
.node[aria-current="true"] > svg.i { color: var(--k-solid); }
.node .nm { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.node .n { flex: none; color: var(--muted); font-size: .75rem; font-weight: 400; font-variant-numeric: tabular-nums; }
.node .more { flex: none; width: 22px; height: 22px; display: none; place-items: center; border-radius: 6px; color: var(--muted); }
.node:hover .more, .node .more[aria-expanded="true"] { display: grid; }
.node:hover .more ~ .n, .node .more[aria-expanded="true"] ~ .n { display: none; }
.node .more:hover { background: var(--line-soft); color: var(--ink); }
.node input { flex: 1; min-width: 0; height: 24px; padding: 0 6px; border: 0; border-radius: 6px; outline: 0; background: var(--field); box-shadow: inset 0 0 0 1.5px var(--alf); font-size: .875rem; }
.node.add { color: var(--muted); }
.tree .sep { height: 1px; margin: 8px 6px; background: var(--line-soft); }
.tree .lib { flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 12px 12px 14px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: .75rem; }
.tree .lib .path { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tree .lib button { flex: none; color: var(--copy); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
[data-dragging] { opacity: .45; }
/* On a narrow page the tree is a drawer over the page. */
.scrim { display: none; }
@container page (max-width: 720px) {
  .tree { display: none; }
  .page[data-drawer] .tree { display: flex; position: absolute; inset: 0 auto 0 0; z-index: 20; width: min(300px, 86%); box-shadow: var(--shadow), 0 0 40px oklch(0 0 0 / .18); }
  .page[data-drawer] .scrim { display: block; position: absolute; inset: 0; z-index: 19; background: color-mix(in oklch, var(--bg) 40%, transparent); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .tree-head [data-a="fold"] { display: none; }
}

/* A small menu: our own, never a native select. */
.menu { position: fixed; z-index: 40; min-width: 200px; max-width: min(280px, calc(100vw - 24px)); max-height: 60vh; overflow-y: auto; padding: 4px; border-radius: 12px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line), var(--shadow); font-size: .875rem; }
.menu button { width: 100%; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px 0 calc(10px + var(--d, 0) * 14px); border-radius: 8px; white-space: nowrap; }
.menu button:hover, .menu button:focus-visible { background: var(--wash); }
.menu button span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.menu button svg.i { width: 15px; height: 15px; color: var(--muted); }
.menu button[aria-checked="true"]::after { content: "✓"; color: var(--alf); }
.menu button.danger { color: var(--now); }
.menu .sep { height: 1px; margin: 4px 6px; background: var(--line-soft); }

/* ── The page ── */
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 0 170px; }
.page[data-view="edit"] .scroll { padding-bottom: 60px; }
.col { max-width: 860px; margin: 0 auto; padding: 0 28px; }
.page[data-view="read"] .col, .page[data-view="edit"] .col { max-width: 740px; }
.page-head { display: flex; align-items: flex-start; gap: 8px; padding: 22px 0 14px; }
.page-head .ht { min-width: 0; flex: 1; }
.page-head h1 { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 1.625rem; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; }
.page-head h1 span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.page-head h1 svg { width: 24px; height: 24px; color: var(--k-solid); }
.page-head p { margin-top: 4px; color: var(--muted); font-size: .875rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.page-head p button { color: var(--copy); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
/* The tree button: folds the tree on a wide page, opens the drawer on a narrow one. Shown where the tree is not. */
.tree-btn { flex: none; display: none; width: 34px; height: 34px; place-items: center; margin: 0 0 0 -8px; border-radius: 10px; color: var(--copy); }
.tree-btn:hover { background: var(--wash); color: var(--ink); }
.page[data-folded] .tree-btn { display: grid; }
@container page (max-width: 720px) { .tree-btn { display: grid; } }
.page-head .tree-btn { margin-top: -1px; }

/* A note in a list: its name, how it starts, where it is, when it changed. */
.rows { display: flex; flex-direction: column; }
.row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; padding: 2px 10px; margin: 0 -10px; border-radius: 12px; transition: background 200ms var(--ease); }
.row + .row::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 1px; background: var(--line-soft); }
.row:hover { background: var(--wash); }
.row:hover::before, .row:hover + .row::before, .row[data-fresh]::before, .row[data-fresh] + .row::before { display: none; }
.row[data-fresh] { background: var(--alf-soft); }
.row-main { min-width: 0; display: flex; flex-direction: column; gap: 1px; padding: 9px 0; border-radius: 8px; }
.rt { font-weight: 550; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rs { color: var(--muted); font-size: .8125rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rs:empty::before { content: "\00a0"; }
.rm { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .75rem; white-space: nowrap; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 6px; background: var(--k-fill, var(--wash)); color: var(--k-text, var(--copy)); font-size: .75rem; font-weight: 500; white-space: nowrap; }
.sug { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px dashed var(--k-line); background: var(--k-fill); color: var(--k-text); font-size: .75rem; white-space: nowrap; }
.sug:hover { border-style: solid; }
.when { min-width: 3.2em; text-align: right; }
.empty { padding: 36px 0; color: var(--muted); font-size: .875rem; }
.empty b { display: block; margin-bottom: 4px; color: var(--ink); font-size: 1rem; font-weight: 600; }
.path { font: .75rem/1.6 var(--mono); color: var(--muted); overflow-wrap: anywhere; }

/* Sub-folders, above the notes: a line each. */
.folders { margin-bottom: 6px; }
.folders li { box-shadow: 0 1px 0 var(--line-soft); }
.folders button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 10px; margin: 0 -10px; width: calc(100% + 20px); border-radius: 12px; }
.folders button:hover { background: var(--wash); }
.folders button.drop { box-shadow: inset 0 0 0 1.5px var(--alf); background: var(--alf-soft); }
.folders svg { color: var(--muted); }
.folders .n { color: var(--muted); font-size: .75rem; }
.folders .mark { color: var(--muted); font-size: .75rem; }
.crumb { display: flex; align-items: center; gap: 6px; padding: 0 0 6px; color: var(--muted); font-size: .8125rem; }
.crumb button { color: var(--copy); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.crumb b { color: var(--ink); font-weight: 600; }
.lib { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 22px; padding-top: 14px; box-shadow: 0 -1px 0 var(--line-soft); color: var(--muted); font-size: .8125rem; }

.btn { min-height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); color: var(--copy); font-size: .8125rem; white-space: nowrap; text-decoration: none; }
.btn:hover { color: var(--ink); }
.btn.solid { background: var(--alf-solid); color: var(--on-alf); box-shadow: none; }
.btn.danger { background: var(--now); color: var(--on-alf); box-shadow: none; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg.i { width: 15px; height: 15px; }
.ib { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 50%; color: var(--copy); }
.ib:hover { background: var(--wash); color: var(--ink); }
.move { max-width: 170px; }
.move span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.move .caret { width: 12px; height: 12px; color: var(--muted); }

/* ── One note, the whole page ── */
.bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 12px 0 10px; background: var(--bg); }
.back { display: inline-flex; align-items: center; gap: 2px; height: 30px; padding: 0 10px 0 4px; margin-left: -4px; border-radius: 999px; color: var(--copy); font-size: .875rem; }
.back:hover { background: var(--wash); color: var(--ink); }
.status { color: var(--muted); font-size: .8125rem; }
.note > h1 { padding-top: 8px; font-size: 1.625rem; line-height: 1.3; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
.props { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 6px; color: var(--muted); font-size: .8125rem; }
.props .sep { opacity: .5; }

.md { padding-top: 14px; color: var(--copy); overflow-wrap: anywhere; }
.md > * + * { margin-top: .8em; }
.md h2 { margin-top: 1.5em; color: var(--ink); font-size: 1.1875rem; font-weight: 650; }
.md h3 { margin-top: 1.3em; color: var(--ink); font-size: 1.0625rem; font-weight: 600; }
.md h4 { margin-top: 1.2em; color: var(--ink); font-size: .9375rem; font-weight: 600; }
.md ul { list-style: disc; padding-left: 1.3em; }
.md ol { list-style: decimal; padding-left: 1.5em; }
.md li + li { margin-top: .25em; }
.md li::marker { color: var(--muted); }
.md li.task { list-style: none; margin-left: -1.3em; display: flex; gap: 9px; }
.md li.plain { list-style: none; margin-left: -1.3em; }
.md ol li.plain { margin-left: -1.5em; }
.md [data-fresh] { background: var(--alf-soft); border-radius: 6px; box-shadow: 0 0 0 4px var(--alf-soft); }
.box { flex: none; width: 16px; height: 16px; margin-top: .3em; display: grid; place-items: center; border-radius: 5px; box-shadow: inset 0 0 0 1.5px var(--line); }
.box[aria-checked="true"] { background: var(--alf-solid); box-shadow: none; }
.box[aria-checked="true"]::after { content: ""; width: 8px; height: 4px; margin-top: -2px; border-left: 1.8px solid var(--on-alf); border-bottom: 1.8px solid var(--on-alf); transform: rotate(-45deg); }
.box[aria-checked="true"] + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.md strong { color: var(--ink); font-weight: 600; }
.md code { padding: 1px 5px; border-radius: 5px; background: var(--wash); font: .8125rem var(--mono); }
.md pre.code { padding: 12px 14px; border-radius: 10px; background: var(--wash); overflow-x: auto; }
.md pre.code code { padding: 0; background: none; white-space: pre; }
.md blockquote { padding: 2px 0 2px 14px; box-shadow: inset 2px 0 0 var(--line); color: var(--muted); }
.wl { color: var(--alf); text-decoration: underline; text-decoration-color: color-mix(in oklch, var(--alf) 35%, transparent); text-underline-offset: 3px; cursor: pointer; }
.wl.missing { text-decoration-style: dashed; text-decoration-color: var(--alf); opacity: .8; }
.ext { color: var(--alf); text-decoration: underline; text-decoration-color: color-mix(in oklch, var(--alf) 35%, transparent); text-underline-offset: 3px; }
/* An address that is already in Links shows as that clip. */
.clip { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; height: 26px; padding: 0 9px 0 3px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); vertical-align: middle; text-decoration: none; color: var(--copy); font-size: .8125rem; }
.clip:hover { color: var(--ink); background: var(--wash); }
.clip .tile { flex: none; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 6px; background: var(--k-fill); color: var(--k-text); font: 600 .625rem/1 var(--sans); }
.clip .ct { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.clip .cs { flex: none; color: var(--muted); font-size: .75rem; }
.embed { display: flex; align-items: center; gap: 10px; padding: 18px 14px; border-radius: 10px; background: var(--wash); color: var(--muted); font-size: .8125rem; }

/* Zirma's change, where it would land: dashed, with what it replaces struck through. */
.prop { margin: 4px 0; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--k-line); background: var(--k-fill); }
.prop .was { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.prop .will { color: var(--ink); min-height: 1.6em; }
.prop .stale { color: var(--muted); font-size: .875rem; }
.prop .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
.prop .who { color: var(--k-text); font-size: .75rem; }

.under { margin-top: 30px; padding-top: 14px; box-shadow: 0 -1px 0 var(--line-soft); }
.under h2 { margin-bottom: 6px; color: var(--muted); font-size: .8125rem; font-weight: 500; }
.under li { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; min-width: 0; font-size: .875rem; }
.under .bt { flex: none; max-width: 45%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.under .bs { min-width: 0; flex: 1; color: var(--muted); font-size: .8125rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* ── Writing ── */
.conflict { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 10px; background: var(--k-fill); color: var(--k-text); font-size: .8125rem; }
.title-in { width: 100%; margin-top: 8px; padding: 0; border: 0; outline: none; background: none; font-size: 1.625rem; line-height: 1.3; font-weight: 650; letter-spacing: -.01em; }
.ed { position: relative; margin-top: 14px; min-height: 46vh; }
.ed .hl, .ed textarea, .ed .mirror { font: .9375rem/1.75 var(--sans); white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; tab-size: 2; letter-spacing: 0; }
.ed .hl { color: var(--copy); pointer-events: none; min-height: 46vh; }
.ed .hl .hd { color: var(--ink); }
.ed .hl .dim { color: var(--muted); }
.ed .hl .lk { color: var(--alf); }
.ed textarea { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; outline: none; resize: none; overflow: hidden; background: none; color: transparent; caret-color: var(--ink); }
.ed textarea::selection { background: color-mix(in oklch, var(--alf) 22%, transparent); }
.ed .mirror { position: absolute; inset: 0 0 auto 0; visibility: hidden; pointer-events: none; }
.ac { position: absolute; z-index: 3; width: 240px; max-width: 100%; padding: 4px; border-radius: 12px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line), var(--shadow); font-size: .875rem; }
.ac button { width: 100%; display: flex; align-items: baseline; gap: 8px; padding: 6px 9px; border-radius: 8px; min-width: 0; }
.ac button[aria-selected="true"] { background: var(--wash); }
.ac .at { min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ac small { flex: none; color: var(--muted); font-size: .75rem; }
.ac .none { padding: 6px 9px; color: var(--muted); font-size: .8125rem; }
.edhint { margin-top: 14px; color: var(--muted); font-size: .75rem; }
.edhint code { font: .75rem var(--mono); }

@container pane (max-width: 560px) {
  .col { padding: 0 16px; }
  .row { grid-template-columns: minmax(0, 1fr); padding-bottom: 9px; }
  .row-main { padding-bottom: 2px; }
  .rm { flex-wrap: wrap; }
  .when { min-width: 0; text-align: left; }
  .under .bt { max-width: 60%; }
  .bar { flex-wrap: nowrap; }
  .back { padding: 0 4px; }
  .back span { display: none; }
  .move { max-width: 100px; }
}

/* ── The line at the bottom ── */
.line-wrap { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 16px; pointer-events: none; background: linear-gradient(to top, var(--bg) 62%, transparent); }
.page[data-view="edit"] .line-wrap { display: none; }
.line-col { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
#toast:empty, #above:empty, #tries:empty { display: none; }

      for (; i < lines.length && /^> /.test(lines[i]); i++) quote.push(inline(lines[i].slice(2)));
      html += `<blockquote>${quote.join("<br>")}</blockquote>`;
      continue;
    }
    if (/^(- |\d+\. )/.test(line)) {
      const ordered = /^\d/.test(line), same = ordered ? /^\d+\. / : /^- /, items = [];
      for (; i < lines.length && same.test(lines[i]); i++) {
        const raw = lines[i], text = raw.replace(/^(- |\d+\. )/, "");
        const task = /^- \[( |x)\] (.*)$/.exec(raw);
        if (hit(raw)) { placed = true; items.push(`<li class="plain">${proposalBlock(P, text)}</li>`); }
        else if (task) items.push(`<li class="task"><button type="button" class="box" role="checkbox" aria-checked="${task[1] === "x"}" aria-label="${esc(task[2])}" data-a="task" data-line="${i}"></button><span>${inline(task[2])}</span></li>`);
        else items.push(`<li><span${fresh(raw)}>${inline(text)}</span></li>`);
      }
      html += ordered ? `<ol>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`;
      continue;
    }
    const para = [];
    for (; i < lines.length && lines[i].trim() && !/^(```|#{1,3} |> |- |\d+\. )/.test(lines[i]); i++) para.push(lines[i]);
    if (para.length === 1 && hit(para[0])) { placed = true; html += proposalBlock(P, para[0]); }
    else html += `<p><span${para.length === 1 ? fresh(para[0]) : ""}>${para.map(inline).join("<br>")}</span></p>`;
  }
  if (P && !placed) html += proposalBlock(P, null);
  return html;
}
// The same text, coloured, behind the textarea. Colour only: weight or another font would move the letters.
function highlight(text) {
  const lines = text.split("\n");
  let props = lines[0] === "---", fence = false;
  return lines.map((line, i) => {
    if (props) { if (i > 0 && line === "---") props = false; return `<span class="dim">${esc(line)}</span>`; }
    if (/^```/.test(line)) { fence = !fence; return `<span class="dim">${esc(line)}</span>`; }
    if (fence) return `<span class="dim">${esc(line)}</span>`;
    if (/^#{1,3} /.test(line)) return `<span class="hd">${esc(line)}</span>`;
    return esc(line)
      .replace(/(!?\[\[[^\]\n]*\]\])/g, `<span class="lk">$1</span>`)
      .replace(/(https?:\/\/[^\s<>)）]+)/g, `<span class="lk">$1</span>`)
      .replace(/(`[^`]+`)/g, `<span class="dim">$1</span>`)
      .replace(/^((?:- \[[ x]\]|-|\d+\.|&gt;)) /, `<span class="dim">$1</span> `);
  }).join("\n") + "\n";
}

/* ── Finding: by what a note says ── */
function search(query) {
  const q = query.trim().toLowerCase();
  if (q.length < 2) return [];
  const words = (q.match(/[a-z0-9]+/g) ?? []).filter((word) => word.length > 1);
  const han = q.replace(/[^一-鿿]/g, "");
  const grams = [...new Set(han.length > 1 ? Array.from({ length: han.length - 1 }, (_, i) => han.slice(i, i + 2)) : [])];
  const terms = [...words, ...grams];
  if (!terms.length) return [];
  const count = (text) => terms.filter((term) => text.toLowerCase().includes(term)).length;
  return S.notes.map((note) => {
    const { lines, start } = parts(body(note));
    const candidates = lines.slice(start).map(plain).filter(Boolean);
    const best = candidates.reduce((top, line) => (count(line) > count(top) ? line : top), "");
    const score = count(titleOf(note)) * 2 + count(candidates.join(" "));
    // Show the matched words even when they sit far into a long line.
    const at = count(best) ? Math.min(...terms.map((term) => best.toLowerCase().indexOf(term)).filter((index) => index >= 0)) : 0;
    return { note, score, line: count(best) ? (at > 16 ? `…${best.slice(at - 8)}` : best) : candidates[0] ?? "" };
  }).filter((found) => found.score > (terms.length > 1 ? 1 : 0)).sort((a, b) => b.score - a.score).slice(0, 4).map((found) => ({ ...found, terms }));
}
function marked(text, terms) {
  const pattern = new RegExp(`(${[...terms].sort((a, b) => b.length - a.length).map((term) => term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "gi");
  return esc(text).replace(pattern, "<mark>$1</mark>");
}

// Zirma writes where you can see it: the new line types out. A click, or reduced motion, gives it at once.

  P.typed = true;

/* ── Writing ── */
let saveTimer = 0;
function enterEdit(id) {
  const note = byId(id);

  renderAll();

function paintEditor() { $("hl").innerHTML = highlight($("src").value); }
function paintStatus() {
  const E = S.edit;
  $("status").textContent = E.conflict ? t("没存", "Not saved") : E.status === "saving" ? t("在存…", "Saving…") : t("已存", "Saved");
  $("done").disabled = E.conflict;
}
function paintConflict() { $("conflict").hidden = !S.edit.conflict; }

}
// Saving carries what the file was when it was opened. If the file is no longer that, nothing is written over it.
function saveDraft() {
  const E = S.edit, note = byId(S.open);
  if (!E || !note || E.conflict) return;
  clearTimeout(saveTimer);
  if (body(note) !== E.base) { E.conflict = true; paintStatus(); paintConflict(); return; }
  if (E.draft !== E.base) { setBody(note, E.draft); E.base = E.draft; note.elsewhere = false; }
  E.status = "saved";
  paintStatus();
}
function finishEdit() {
  const E = S.edit, note = byId(S.open);
  if (!E || E.conflict) return;
  saveDraft();
  const old = titleOf(note), name = $("title").value.trim();
  let moved = 0;
  if (name && name !== old && !byTitle(name)) {
    // Renaming here also rewrites the double links that pointed at the old name.
    const pattern = new RegExp(`\\[\\[${old.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(\\|[^\\]\\n]*)?\\]\\]`, "g");
    for (const other of S.notes) {
      const before = other.text[L()], after = before.replace(pattern, (m, alias) => { moved++; return `[[${name}${alias ?? ""}]]`; });
      if (after !== before) other.text[L()] = after;
    }
    note.title[L()] = name;
    touch(note);
  }
  Object.assign(S, { view: "read", edit: null, ac: null });
  renderAll();
  if (name && name !== old && titleOf(note) === name) say(moved ? t(`改了名 · ${moved} 处双链跟着改了`, `Renamed · ${moved} ${moved === 1 ? "link" : "links"} updated`) : t("改了名", "Renamed"));
}
// The [[ menu sits at the caret: a hidden copy of the text up to the caret says where that is.
function paintAc() {
  const area = $("src"), menu = $("ac");
  if (!area) return;
  const head = area.value.slice(0, area.selectionStart);
  const open = area.selectionStart === area.selectionEnd ? /\[\[([^\[\]\n|]*)$/.exec(head) : null;
  if (!open) { S.ac = null; menu.hidden = true; return; }
  const items = S.notes.filter((note) => note.id !== S.open && titleOf(note).toLowerCase().includes(open[1].toLowerCase())).slice(0, 5);
  S.ac = { from: head.length - open[1].length, q: open[1], items, index: Math.min(S.ac?.index ?? 0, Math.max(items.length - 1, 0)) };
  const mirror = $("mirror");
  mirror.innerHTML = `${esc(head)}<span>​</span>`;
  const at = mirror.lastElementChild;
  menu.style.top = `${at.offsetTop + at.offsetHeight + 4}px`;
  menu.style.left = `${Math.max(0, Math.min(at.offsetLeft, $("ed").clientWidth - 240))}px`;

    ? items.map((note, i) => `<button type="button" data-a="ac" data-i="${i}" aria-selected="${i === S.ac.index}"><span class="at">${esc(titleOf(note))}</span><small>${esc(pick(folderOf(note.folder).name))}</small></button>`).join("")
    : `<div class="none">${t("没有这篇 · 照样能连", "No such note · link it anyway")}</div>`;

}
function pickAc(index) {
  const area = $("src"), { from, q, items } = S.ac, name = titleOf(items[index]), text = area.value, end = from + q.length;

/* ── Acting ── */
function openNote(id) {

async function propose(text) {

// Another app writes the same file. Reading: the note just changes. Writing: your text is not saved over it.

document.addEventListener("click", (event) => {

    case "narrow": S.narrow = !S.narrow; S.drawer = false; return renderAll();

// Moving a note is moving its file; the tree's counts follow.
function moveNote(note, to) {

  const from = note.folder;
  note.folder = to;

  say(t(`挪到了 ${pathText(to)}`, `Moved to ${pathText(to)}`), () => { note.folder = from; });
}
function moveFolder(id, to) {
  const folder = folderOf(id), from = folder.parent;

  folder.parent = to;
  if (to) S.expanded.add(to);
  renderPage();
  say(t(`挪到了 ${pathText(to)}`, `Moved to ${pathText(to)}`), () => { folder.parent = from; });

// Removing a folder keeps what was in it: its notes and sub-folders move up one level (from the top, notes go to Quick Notes).
function removeFolder(id) {
  const folder = folderOf(id), up = folder.parent, notesTo = up ?? "quick";
  const notes = S.notes.filter((note) => note.folder === id), subs = kids(id);
  for (const note of notes) note.folder = notesTo;

    S.folders.push(folder);

}

/* ── Dragging: a note onto a folder moves the file; a folder onto another moves the folder ── */
