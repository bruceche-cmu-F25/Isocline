<!doctype html>
<!--
  Alfred: 今天 (Today), the narrowed 通知 (Inbox), and the first-run walkthrough. A prototype for
  docs/design/today-and-inbox.md: no build step, sample data, nothing is sent anywhere.

  今天    the default page: a note Alfred writes like a secretary. What is next, when, and the link to it; the
          day's events and todos on one line of time (a todo without an hour gets a suggested one, dashed, written
          to the calendar only when you say so); the mail that may need a reply (one line of why and a link to the
          letter, never a draft); what to study; what is in progress and what has just finished. Facts are live.
          What carries Alfred's small mark is its judgement, written once in the morning; 更新 writes it again.
  通知    only Alfred's own things waiting on you (would this exist without Alfred?): a task's question, a change
          you asked it to prepare, a send that may not have happened. One column, decided in place: ↵ does what
          Alfred suggests, E changes it in the line at the bottom, X says no, Z undoes. What only tells you
          something sits below and leaves by itself when you leave the page. No "got it".
  邮件    open a letter from 今天: Alfred writes a reply only when you ask, and then that draft is one more thing
          waiting on you.
  引导    the first run, full screen: name, model, Google, when to write 今天, then the figure points at the real
          interface. "老用户" is what someone already set up sees once after the update.

  The strip switches the page, the scene (morning, afternoon, evening), the language and light/dark.
-->
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfred：今天</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<style>
:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.23, 1, .32, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--alf); outline-offset: 2px; }
kbd { padding: 0 5px; border-radius: 5px; background: var(--wash); color: var(--muted); font: .6875rem/1.6 var(--mono); }

/* ── The prototype's own strip ── */
.proto { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px 10px; background: var(--ink); color: var(--bg); font-size: 12px; overflow-x: auto; white-space: nowrap; }
.proto b { flex: none; padding: 0 6px; }
.proto .lab { flex: none; padding: 0 4px 0 10px; opacity: .6; }
.proto button { flex: none; height: 26px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 8px; opacity: .72; }
.proto button:hover { opacity: 1; }
.proto button[aria-pressed="true"] { background: var(--bg); color: var(--ink); opacity: 1; }
.proto .what { flex: 1; min-width: 0; padding: 0 10px; opacity: .7; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1180px) { .proto .what { visibility: hidden; } }
@media (max-width: 700px) { .proto .lab, .proto b { display: none; } }

/* ── The shell: top bar, sidebar, page ── */
.app { position: relative; flex: 1; min-height: 0; display: grid; grid-template: 52px minmax(0, 1fr) / 232px minmax(0, 1fr); }
.topbar { grid-column: 1 / -1; display: flex; background: var(--paper); border-bottom: 1px solid var(--line-soft); }
.lead { flex: none; width: 232px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; border-right: 1px solid var(--line-soft); }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.barmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 20px; }
.bar-title { display: flex; align-items: center; gap: 9px; font-size: 1.0625rem; font-weight: 650; white-space: nowrap; }
.bar-title svg.i { width: 20px; height: 20px; color: var(--k-solid); stroke-width: 1.8; }
.bar-sub { min-width: 0; color: var(--muted); font-size: .8125rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bar-sub b { color: var(--k-text); font-weight: 600; }
.barmain .grow { flex: 1; }
.gear { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.gear svg.i { width: 18px; height: 18px; }
.side { min-height: 0; overflow-y: auto; padding: 10px 8px; background: var(--paper); border-right: 1px solid var(--line-soft); }
.side h2 { padding: 10px 10px 4px; color: var(--muted); font-size: .6875rem; font-weight: 500; }
.nav { width: 100%; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 8px; color: var(--copy); font-size: .875rem; }
.nav:hover { background: var(--wash); }
.nav[aria-current="page"] { background: var(--wash); color: var(--ink); font-weight: 600; }
.nav svg.i { width: 18px; height: 18px; color: var(--k-solid); }
.nav .n { margin-left: auto; color: var(--muted); font-size: .75rem; font-weight: 400; font-variant-numeric: tabular-nums; }
.nav .n[data-k] { min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: 999px; background: var(--k-solid); color: #fff; font-weight: 600; }
.nav[disabled] { cursor: default; }

.page { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; container: page / inline-size; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 0 170px; }
.col { max-width: 720px; margin: 0 auto; padding: 0 28px; }
.page-head { display: none; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; padding: 18px 0 2px; }
.page-head h1 { font-size: 1.375rem; font-weight: 650; }
.page-head span { color: var(--muted); font-size: .8125rem; }

/* ── Shared pieces ── */
.sec-h { display: flex; align-items: center; gap: 8px; padding: 26px 2px 8px; color: var(--muted); font-size: .8125rem; font-weight: 500; min-width: 0; }
.sec-h b { color: var(--ink); font-weight: 600; }
.sec-h .n { font-size: .75rem; font-variant-numeric: tabular-nums; }
.sec-h .n[data-k] { height: 20px; min-width: 20px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: 999px; background: var(--k-fill); color: var(--k-text); font-weight: 600; }
.sec-h .grow { flex: 1; }
.sec-h .keys { min-width: 0; display: flex; gap: 10px; font-size: .6875rem; font-weight: 400; white-space: nowrap; overflow: hidden; }
.sec-h .keys span { display: inline-flex; gap: 4px; align-items: center; }
.more { display: inline-flex; align-items: center; gap: 4px; color: var(--alf); font-size: .8125rem; font-weight: 500; white-space: nowrap; }
.more:hover { text-decoration: underline; }
.more svg.i { width: 14px; height: 14px; }
.left { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: .75rem; font-weight: 500; white-space: nowrap; background: var(--k-fill); color: var(--k-text); font-variant-numeric: tabular-nums; }
.left i { width: 6px; height: 6px; border-radius: 50%; background: var(--k-solid); }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--k-fill, var(--wash)); color: var(--k-text, var(--copy)); font-size: .75rem; font-weight: 500; white-space: nowrap; }
.btn { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; font-size: .8125rem; color: var(--copy); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; transition: background .15s var(--ease), color .15s var(--ease); }
.btn:hover { color: var(--ink); background: var(--wash); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.solid { background: var(--alf-solid); color: var(--on-alf); box-shadow: none; font-weight: 500; }
.btn.small { height: 26px; padding: 0 10px; font-size: .75rem; }
.btn kbd { display: none; }
.alf-line { display: flex; gap: 7px; color: var(--copy); font-size: .8125rem; line-height: 1.55; min-width: 0; }
.alf-line svg.i { width: 14px; height: 14px; margin-top: 3px; color: var(--alf); }
.alf-line span { min-width: 0; overflow-wrap: anywhere; }
/* While Alfred writes its judgement again. */
.shim { color: transparent !important; border-radius: 6px; background: var(--alf-soft); animation: write 1s var(--ease) infinite alternate; }
.shim * { visibility: hidden; }
@keyframes write { from { opacity: .35; } to { opacity: 1; } }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--alf); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; transform: scale(.8); } }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--alf); }

/* ── 今天 ── */
.lede { padding: 26px 0 4px; }
.hello { font-size: 1.375rem; line-height: 1.45; font-weight: 600; letter-spacing: -.01em; text-wrap: pretty; overflow-wrap: anywhere; }
.hello span { color: var(--muted); font-weight: 400; }
.next { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding-top: 14px; }
.next .where { color: var(--copy); font-size: .875rem; min-width: 0; overflow-wrap: anywhere; }
.wrote { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 28px 2px 0; color: var(--muted); font-size: .75rem; }
.wrote svg.i { width: 14px; height: 14px; color: var(--alf); }
.wrote .grow { flex: 1; }

/* What waits, at the top of 今天: a row each, the open one a full card. */
.wrow { width: 100%; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); font-size: .875rem; }
.wrow:hover { box-shadow: inset 0 0 0 1px var(--line); }
.wrow > svg.i { color: var(--muted); }
.wrow .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500; }
.wrow .chev { color: var(--muted); width: 14px; height: 14px; }

/* The day on one line of time. */
.tl { display: flex; flex-direction: column; }
.tl > li { display: grid; grid-template-columns: 46px 20px minmax(0, 1fr) auto; align-items: start; column-gap: 12px; padding: 9px 6px; border-radius: 10px; }
.tl > li:not(.nowline):hover { background: var(--wash); }
.tl .at { padding-top: 1px; color: var(--copy); font-size: .8125rem; font-variant-numeric: tabular-nums; text-align: right; }
.tl .at small { display: block; color: var(--muted); font-size: .6875rem; line-height: 1.3; }
.tl .mk { display: grid; place-items: center; height: 24px; }
.tl .mk i { width: 9px; height: 9px; border-radius: 3px; background: var(--k-solid); }
.check { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--k-solid, var(--line)); color: transparent; }
.check:hover { background: var(--k-fill, var(--wash)); }
.check svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.check[aria-checked="true"] { background: var(--k-solid, var(--alf)); box-shadow: none; color: #fff; opacity: .55; }
.tl .body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tl .title { font-size: .9375rem; line-height: 1.5; overflow-wrap: anywhere; }
.tl .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 10px; color: var(--muted); font-size: .75rem; min-width: 0; }
.tl .meta .j { display: inline-flex; align-items: center; gap: 4px; color: var(--alf); }
.tl .meta .j svg.i { width: 12px; height: 12px; }
.tl .end { padding-top: 1px; }
.tl li.sug .at { color: var(--alf); }
.tl li.sug .body { padding: 5px 10px; margin: -5px -10px; border-radius: 10px; outline: 1px dashed color-mix(in oklch, var(--alf) 45%, transparent); outline-offset: -1px; }
.tl li.past { opacity: .5; }
.tl li.done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.tl li.nowline { padding: 2px 6px; grid-template-columns: 46px minmax(0, 1fr); align-items: center; }
.tl li.nowline .at { color: var(--now); font-weight: 600; padding: 0; }
.tl li.nowline hr { margin: 0; border: 0; border-top: 1.5px solid var(--now); }

/* Rows: mail, study, in progress, just finished, what only tells you. */
.rows { display: flex; flex-direction: column; }
.row { width: 100%; min-width: 0; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; padding: 8px 6px; border-radius: 10px; font-size: .9375rem; }
button.row:hover, a.row:hover { background: var(--wash); }
.row .ld { display: grid; place-items: center; color: var(--muted); }
.row .t { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.row .t b { font-weight: 600; }
.row .s { grid-column: 2; min-width: 0; color: var(--muted); font-size: .75rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.row .s svg.i { width: 12px; height: 12px; color: var(--alf); }
.row .s span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.row .e { grid-row: 1; grid-column: 3; display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .e svg.i { width: 14px; height: 14px; }
.row.unread .t { font-weight: 600; }
.row.gone .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.row.read .t { color: var(--copy); }
.none { padding: 4px 6px 8px; color: var(--muted); font-size: .8125rem; }

/* ── 通知: one card per thing that waits ── */
.q { display: flex; flex-direction: column; gap: 10px; }
.it { position: relative; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 14px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); scroll-margin: 16px 0 180px; }
.it[data-cur] { box-shadow: inset 0 0 0 1.5px color-mix(in oklch, var(--alf) 60%, transparent); }
.it-top { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: .75rem; min-width: 0; }
.it-top .src { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.it-top .src svg.i { width: 14px; height: 14px; }
.it-top .grow { flex: 1; }
.it h3 { font-size: .9375rem; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
.pv { padding: 9px 12px; border-radius: 10px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line-soft); color: var(--copy); font-size: .8125rem; line-height: 1.6; white-space: pre-line; overflow-wrap: anywhere; }
ol.pv { white-space: normal; counter-reset: step; }
ol.pv li { display: flex; gap: 8px; counter-increment: step; }
ol.pv li::before { content: counter(step) "."; color: var(--muted); font-variant-numeric: tabular-nums; }
.only { color: var(--muted); font-size: .75rem; }
.changed { color: var(--alf); font-size: .75rem; }
.writing { display: flex; flex-direction: column; gap: 7px; padding: 12px; border-radius: 10px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line-soft); }
.writing i { height: 8px; border-radius: 4px; background: var(--alf-soft); animation: write 1.1s var(--ease) infinite alternate; }
.writing i:nth-child(2) { width: 82%; animation-delay: .15s; }
.writing i:nth-child(3) { width: 54%; animation-delay: .3s; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 2px; }
.acts .grow { flex: 1; }
.btn.yes { color: var(--ink); font-weight: 500; }
/* One solid in the region: the current card's suggestion, or the one under the pointer. */
.it[data-cur] .btn.yes, .q .it:hover .btn.yes { background: var(--alf-solid); color: var(--on-alf); box-shadow: none; }
.q:has(.it:hover) .it[data-cur]:not(:hover) .btn.yes { background: none; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.it[data-cur] .btn.yes kbd, .q .it:hover .btn.yes kbd { background: color-mix(in oklch, var(--on-alf) 22%, transparent); color: var(--on-alf); }
.q[data-keys] .it[data-cur] .btn kbd { display: inline-block; }
.kids { display: flex; flex-direction: column; border-radius: 10px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line-soft); }
.kid + .kid { border-top: 1px solid var(--line-soft); }
.kid-h { width: 100%; display: grid; grid-template-columns: minmax(64px, 7.5em) minmax(0, 1fr) 16px; align-items: center; gap: 10px; padding: 8px 12px; font-size: .8125rem; }
.kid-h b { font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.kid-h span { color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.kid-h svg.i { width: 14px; height: 14px; color: var(--muted); transition: transform .2s var(--ease); }
.kid[data-open] .kid-h svg.i { transform: rotate(90deg); }
.kid-b { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 10px; }
.kid-b .pv, .kid-b .writing { background: var(--raise); }
.rc { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 9px 14px; border-radius: 12px; background: var(--alf-soft); color: var(--alf); font-size: .8125rem; animation: rc-in 260ms var(--ease); }
.rc .grow { flex: 1; }
.rc span { min-width: 0; overflow-wrap: anywhere; }
.rc button { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; white-space: nowrap; }
.rc button:hover { text-decoration: underline; }
.rc kbd { background: color-mix(in oklch, var(--alf) 14%, transparent); color: var(--alf); }
@keyframes rc-in { from { opacity: 0; transform: translateY(-4px); } }
.clear { display: flex; align-items: center; gap: 18px; padding: 30px 4px 8px; }
.clear svg { flex: none; width: 76px; height: 76px; color: var(--alf); }
.clear p { font-size: 1.0625rem; font-weight: 600; }
.clear small { display: block; color: var(--muted); font-size: .8125rem; font-weight: 400; }
.fold { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .8125rem; font-weight: 500; }
.fold:hover { color: var(--ink); }
.fold svg.i { width: 14px; height: 14px; transition: transform .2s var(--ease); }
.fold[aria-expanded="true"] svg.i { transform: rotate(90deg); }
.ev { display: grid; grid-template-columns: 44px 16px minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; padding: 6px; font-size: .8125rem; }
.ev .at { color: var(--muted); font: .75rem var(--mono); }
.ev .who { color: var(--muted); display: grid; place-items: center; }
.ev .who.alf { color: var(--alf); }
.ev .who svg.i { width: 14px; height: 14px; }
.ev .t { min-width: 0; overflow-wrap: anywhere; color: var(--copy); }
.ev .e { color: var(--muted); font-size: .75rem; white-space: nowrap; }
.day { padding: 10px 6px 2px; color: var(--muted); font-size: .6875rem; }
.fresh { animation: fresh 1.6s var(--ease); }
@keyframes fresh { from { background: var(--alf-soft); } to { background: transparent; } }

@container page (max-width: 620px) { .sec-h .keys { display: none; } }
@container page (max-width: 520px) {
  .col { padding: 0 14px; }
  .hello { font-size: 1.1875rem; }
  .it { padding: 12px; }
  .btn kbd, .rc kbd { display: none !important; }
  .tl > li { grid-template-columns: 40px 20px minmax(0, 1fr); column-gap: 8px; }
  .tl .end { grid-column: 3; padding-top: 4px; }
  .tl li.sug .body { margin-right: 0; }
  .ev { grid-template-columns: 40px 16px minmax(0, 1fr); }
  .ev .e { grid-column: 3; white-space: normal; }
  .clear svg { width: 60px; height: 60px; }
}
@media (hover: none) { .keys, .btn kbd, .rc kbd { display: none !important; } }

/* ── A card over the blurred page ── */
.pop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: color-mix(in oklch, var(--bg) 40%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: pop-in 180ms var(--ease); }
@keyframes pop-in { from { opacity: 0; } }
.sheet { width: min(580px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; border-radius: 18px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line), 0 2px 4px oklch(0 0 0 / .06), 0 24px 70px oklch(0 0 0 / .18); animation: sheet-in 220ms var(--ease); }
@keyframes sheet-in { from { transform: translateY(8px) scale(.98); } }
.sheet-h { display: flex; gap: 12px; align-items: flex-start; padding: 20px 20px 4px; }
.sheet-h div { flex: 1; min-width: 0; }
.sheet-h h2 { font-size: 1.25rem; font-weight: 650; line-height: 1.35; letter-spacing: -.01em; overflow-wrap: anywhere; }
.sheet-h small { color: var(--muted); font-size: .8125rem; }
.sheet-h .x { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.sheet-h .x:hover { background: var(--wash); color: var(--ink); }
.reading { padding: 6px 20px 8px; display: flex; flex-direction: column; gap: 10px; }
.reading h3 { padding-top: 8px; color: var(--muted); font-size: .75rem; font-weight: 500; }
.reading p { color: var(--copy); font-size: .9375rem; line-height: 1.7; white-space: pre-line; overflow-wrap: anywhere; }

      { at: "07:58", who: "you", text: ["你同意了：「回小周」已发出", "You said yes: the reply to Zhou was sent"], where: ["在 iPhone 上", "On iPhone"] },
      { at: "07:30", who: "alfred", text: ["写好了「今天」", "Wrote Today"], where: ["在 iPhone 上说过", "Told on iPhone"] },
      { day: ["昨天", "Yesterday"] },
      { at: "22:40", who: "alfred", text: ["过期了，没执行：删 3 条旧待办", "Expired, not done: delete 3 old todos"] },
    ];
  } else if (scene === "afternoon") {
    S.day.forEach((r) => { if (r.id === "d1" || r.id === "d3") { r.done = true; r.sug = false; } });
    S.mail[0].gone = true;
    S.items = [SENT];
    S.fyi = [{ id: "f3", text: ["票订好了：周六 08:35 G7505", "Ticket booked: Saturday 08:35, G7505"], sub: ["行程放进了日历", "The trip is on your calendar"], at: "08:16" }];
    S.doing = [{ id: "r-inv", kind: "task", title: ["整理十一月的发票", "Sort November's invoices"], step: ["读第 29 封，共 31 封", "Reading email 29 of 31"], for: ["38 分", "38m"] }];
    S.done = [
      { id: "g-dev2", kind: "dev", title: ["修周视图的叠字", "Fix overlapping text in the week view"], sub: ["alfred · 会话", "alfred · session"], at: "08:31", unread: true, dirty: true },
      { id: "g-net", kind: "report", title: ["三家宽带对比", "Broadband: three plans compared"], sub: ["你说过做完告诉你", "You asked to be told"], at: ["昨天 21:14", "Yesterday 21:14"], unread: false },
    ];
    S.log = [
      { at: "09:02", who: "you", text: ["你同意了：清掉 2 条过期的待办", "You said yes: cleared 2 overdue todos"], where: ["在 Mac 上", "On the Mac"] },
      { at: "08:14", who: "you", text: ["你同意了：2 封回信已发出", "You said yes: 2 replies sent"], where: ["在 Mac 上", "On the Mac"] },
      { at: "08:11", who: "you", text: ["你答了：换 08:35", "You answered: the 08:35"], where: ["在 Mac 上", "On the Mac"] },
      { at: "07:30", who: "alfred", text: ["写好了「今天」", "Wrote Today"], where: ["在 iPhone 上说过", "Told on iPhone"] },
    ];
  } else {
    S.day.forEach((r) => { if (r.kind === "todo") { r.done = true; r.sug = false; } });
    S.mail.forEach((m) => { m.gone = true; });
    S.items = []; S.fyi = []; S.doing = [];
    S.done = [{ id: "g-inv", kind: "list", title: ["十一月的发票：31 张", "November's invoices: 31"], sub: ["你上午交代的", "You asked this morning"], at: "16:02", unread: false }];
    S.log = [
      { at: "16:02", who: "alfred", text: ["「十一月的发票」整理好了", "“November's invoices” is ready"], where: ["在 iPhone 上说过", "Told on iPhone"] },
      { at: "15:44", who: "you", text: ["你核对了：「回物业」已发出", "You checked: the reply to the building office went"], where: ["在 Mac 上", "On the Mac"] },
    ];
  }
  S.cur = S.items[0]?.id ?? null;
  S.exp = S.items[0]?.id ?? null;
}

/* ── Counts and what is next ── */
const waiting = () => S.items.reduce((n, it) => n + (it.kids ? it.kids.length : 1), 0);
const titleOf = (it) => it.kids ? [`${it.kids.length} 封回信写好了`, it.kids.length === 1 ? "1 reply is ready" : `${it.kids.length} replies are ready`] : it.title;
const nextThing = () => S.day.find((r) => r.kind === "event" && toMin(r.at) > nowMin());
const mayReply = () => S.mail.filter((m) => !m.gone);
/** The reply Alfred was asked to write for this letter: a card of its own, or one of a group. */
function draftOf(m) {
  for (const it of S.items) {
    if (it.id === `dr-${m.id}`) return { it, body: it.body };
    const k = it.kids?.find((x) => x.id === `dr-${m.id}`);
    if (k) return { it, k, body: k.body };
  }
  return null;
}
const key = (k) => `<kbd>${k}</kbd>`;
const writing = `<div class="writing"><i></i><i></i><i></i></div>`;
const j = (html) => `<span class="j ${S.updating ? "shim" : ""}">${icon("alfred")}${html}</span>`;

/* ── 今天 ── */
function lede() {
  const hour = Math.floor(nowMin() / 60);
  const hi = hour < 12 ? t("早上好", "Good morning") : hour < 18 ? t("下午好", "Good afternoon") : t("晚上好", "Good evening");
  const name = S.name ? t(`，${S.name}`, `, ${S.name}`) : "";
  const next = nextThing();
  if (!next) return `<section class="lede" data-tour="today"><p class="hello">${hi}${esc(name)}${t("。", ".")} ${t("今天没有别的安排了", "Nothing else is on today")}<span>${t("。明天第一件是 9:00 的小组讨论。", ". Tomorrow starts with the group discussion at 9:00.")}</span></p></section>`;
  const left = span(toMin(next.at) - nowMin());
  return `<section class="lede" data-tour="today">
    <p class="hello">${hi}${esc(name)}${t("。", ".")} ${t(`下一件是 ${next.at} 的${pick(next.title)}`, `Next is ${pick(next.title)} at ${next.at}`)}<span>${t(`，还有 ${left}。`, `, in ${left}.`)}</span></p>
    <div class="next">${next.link ? `<button type="button" class="btn solid" data-act="say-link">${pick(next.link)}${icon("out")}</button>` : ""}
      <span class="where">${esc(pick(next.where ?? ""))}</span></div></section>`;
}

function topWaiting() {
  const n = waiting();
  if (!n) return "";
  const top = S.items.slice(0, 3), rest = n - top.reduce((sum, it) => sum + (it.kids ? it.kids.length : 1), 0);
  return `<section><h2 class="sec-h"><b>${t("等你", "Waiting on you")}</b><span class="n" data-k="warm">${n}</span><span class="grow"></span>
      <button type="button" class="more" data-act="page" data-page="inbox">${rest > 0 ? t(`还有 ${rest} 件`, `${rest} more`) : t("通知", "Inbox")}${icon("chev")}</button></h2>
    <ol class="q">${top.map((it) => it.id === S.exp ? card(it) : `<li><button type="button" class="wrow" data-act="exp" data-id="${it.id}">${icon(SRC[it.src][0])}<span class="t">${esc(pick(titleOf(it)))}</span>
      ${it.urgent ? `<span class="left" data-k="${it.urgent.k}"><i></i>${pick(it.urgent.text)}</span>` : ""}${icon("chev", "i chev")}</button></li>`).join("")}</ol></section>`;
}

function dayBlock() {
  const now = nowMin();
  let lined = false;
  const rows = S.day.map((r) => {
    const past = toMin(r.end ?? r.at) <= now && !r.sug;
    let line = "";
    if (!lined && toMin(r.at) > now) { lined = true; line = `<li class="nowline"><span class="at">${S.now}</span><hr></li>`; }
    const mark = r.kind === "todo"
      ? `<button type="button" class="check" role="checkbox" aria-checked="${!!r.done}" data-k="${r.k}" data-act="tick" data-id="${r.id}" aria-label="${t("完成", "Done")}"><svg viewBox="0 0 20 20">${I.check}</svg></button>`
      : `<i data-k="${r.k}"></i>`;
    const meta = [
      r.where ? `<span>${esc(pick(r.where))}</span>` : "",
      r.due ? `<span class="tag">${icon("clock")}${pick(r.due)}</span>` : "",
      r.sug ? j(t("我建议的时间", "A time I suggest")) : "",
      r.placed ? `<span>${t("已排进日历", "On your calendar")} · <button type="button" class="more" data-act="unplace" data-id="${r.id}">${t("撤销", "Undo")}</button></span>` : "",
    ].filter(Boolean).join("");
    const end = r.sug ? `<button type="button" class="btn small" data-act="place" data-id="${r.id}">${t("排进日历", "Put on calendar")}</button>`
      : r.link && !past ? `<button type="button" class="btn small" data-act="say-link">${pick(r.link)}${icon("out")}</button>` : "";
    return `${line}<li class="${r.sug ? "sug" : ""} ${past ? "past" : ""} ${r.done ? "done" : ""}">
      <span class="at ${r.sug && S.updating ? "shim" : ""}">${r.at}${r.end ? `<small>${r.end}</small>` : ""}</span><span class="mk">${mark}</span>
      <div class="body"><span class="title">${esc(pick(r.title))}</span>${meta ? `<span class="meta">${meta}</span>` : ""}</div><span class="end">${end}</span></li>`;
  }).join("");
  const tail = lined ? "" : `<li class="nowline"><span class="at">${S.now}</span><hr></li>`;
  return `<section><h2 class="sec-h"><b>${t("今天", "Today")}</b><span>${t("11 月 20 日 周五", "Fri, Nov 20")}</span><span class="grow"></span>
    <button type="button" class="more" data-act="say-page" data-name="${t("日程页", "the calendar")}">${t("日程", "Calendar")}${icon("chev")}</button></h2><ol class="tl">${rows}${tail}</ol></section>`;
}

function mailBlock() {
  const may = mayReply().length;
  const rows = S.mail.map((m) => {
    const drafted = !!draftOf(m);
    return `<li><button type="button" class="row ${m.gone ? "gone" : ""}" data-act="open" data-type="mail" data-id="${m.id}">
      <span class="ld">${icon("mail")}</span><span class="t"><b>${esc(pick(m.from))}</b>　${esc(pick(m.subject))}</span>
      <span class="s ${S.updating && !m.gone ? "shim" : ""}">${m.gone ? `<span>${t("已回", "Answered")}</span>` : `${icon("alfred")}<span>${esc(pick(m.why))}</span>`}</span>
      <span class="e">${drafted ? `<span class="tag" data-k="warm">${t("草稿等你发", "Draft waits")}</span>` : ""}${icon("chev")}</span></button></li>`;
  }).join("");
  return `<section><h2 class="sec-h"><b>${t("邮件", "Mail")}</b><span>${t("今天 12 封", "12 today")}${may ? ` · ${t(`${may} 封可能要回`, `${may} may need a reply`)}` : ""}</span><span class="grow"></span>
      <button type="button" class="more" data-act="say-page" data-name="${t("邮件页", "the mail page")}">${t("邮件", "Mail")}${icon("chev")}</button></h2>
    <ul class="rows">${rows}
      <li><button type="button" class="row" data-act="say-page" data-name="${t("待办页", "the todo page")}"><span class="ld">${icon("todo")}</span><span class="t">${t("2 条建议的待办", "2 suggested todos")}</span>
        <span class="s ${S.updating ? "shim" : ""}">${icon("alfred")}<span>${t("财务邮件里的截止日，在待办页等你要不要", "Deadlines from Finance's emails; keep or drop them on the todo page")}</span></span><span class="e">${icon("chev")}</span></button></li></ul></section>`;
}

function studyBlock() {
  return `<section><h2 class="sec-h"><b>${t("学习", "Study")}</b><span>${t("今天 3 件", "3 today")}</span></h2>
    <ul class="rows">${S.study.map((s, n) => `<li><button type="button" class="row" data-act="say-link"><span class="ld"><i class="dot" data-k="violet" style="background:var(--k-solid);border-radius:3px"></i></span>
      <span class="t ${S.updating && n ? "shim" : ""}">${esc(pick(s.title))}</span><span class="s"><span>${esc(pick(s.from))}</span></span><span class="e">${pick(s.go)}${icon("out")}</span></button></li>`).join("")}</ul></section>`;
}

function workBlock() {
  const doing = S.doing.map((r) => `<li><button type="button" class="row" data-act="say-open" data-id="${r.id}"><span class="ld"><i class="pulse"></i></span>
      <span class="t">${esc(pick(r.title))}</span><span class="s"><span>${esc(pick(r.step))}</span></span><span class="e">${pick(r.for)}${icon(r.kind === "dev" ? "code" : "chev")}</span></button></li>`).join("");
  const done = S.done.map((g) => `<li><button type="button" class="row ${g.unread ? "unread" : "read"}" data-act="open" data-type="${g.kind === "dev" ? "dev" : "read"}" data-id="${g.id}">
      <span class="ld">${g.unread ? `<i class="dot" aria-label="${t("没看过", "Not seen")}"></i>` : icon(g.kind === "dev" ? "code" : "note")}</span><span class="t">${esc(pick(g.title))}</span>
      <span class="s"><span>${esc(pick(g.sub))}</span></span><span class="e">${g.dirty ? `<span class="tag">${t("有改动没提交", "Uncommitted changes")}</span>` : ""}${pick(g.at)}</span></button></li>`).join("");
  return `<section><h2 class="sec-h"><b>${t("在办", "In progress")}</b><span class="n">${S.doing.length || ""}</span></h2>
      <ul class="rows">${doing || `<li class="none">${t("现在没有在办的", "Nothing running now")}</li>`}
        <li class="row"><span class="ld">${icon("clock")}</span><span class="t" style="color:var(--copy)">${t("邮件里找待办", "Find todos in mail")}</span><span class="e">${S.scene === "morning" ? "12:00" : t("明天 12:00", "Tomorrow 12:00")}</span></li></ul>
    <h2 class="sec-h"><b>${t("刚办完", "Just finished")}</b><span class="n">${S.done.filter((g) => g.unread).length ? t(`${S.done.filter((g) => g.unread).length} 件没看`, `${S.done.filter((g) => g.unread).length} not seen`) : ""}</span></h2>
      <ul class="rows">${done || `<li class="none">${t("今天还没有", "Nothing yet today")}</li>`}</ul></section>`;
}

function today() {
  return `<header class="page-head"><h1>${t("今天", "Today")}</h1><span>${t("11 月 20 日 周五", "Fri, Nov 20")}</span></header>
    ${lede()}${topWaiting()}${dayBlock()}${mailBlock()}${studyBlock()}${workBlock()}
    <footer class="wrote">${icon("alfred")}<span>${S.updating ? t("正在重写…", "Writing again…") : t(`${S.wrote} 写的 · 读了日历、待办、12 封邮件`, `Written ${S.wrote} · from calendar, todos, 12 emails`)}</span><span class="grow"></span>
      <button type="button" class="btn small" data-act="update" ${S.updating ? "disabled" : ""}>${icon("refresh")}${t("更新", "Update")}</button></footer>`;
}

/* ── 通知 ── */
function card(it) {
  const cur = it.id === (S.page === "inbox" ? S.cur : S.exp);
  const [srcIcon, srcName] = SRC[it.src];
  const top = `<div class="it-top"><span class="src">${icon(srcIcon)}${pick(srcName)} · ${pick(it.label)}</span>
    ${it.from ? `<span>${t("来自", "from")}「${esc(pick(it.from))}」</span>` : ""}<span class="grow"></span>
    ${it.urgent ? `<span class="left" data-k="${it.urgent.k}"><i></i>${pick(it.urgent.text)}</span>` : ""}</div>`;
  let body = "";
  if (it.kids) {
    body = `<ol class="kids">${it.kids.map((k) => {
      const open = S.kid === k.id, first = pick(k.body).split("\n").join(" ");
      return `<li class="kid" ${open ? "data-open" : ""}>
        <button type="button" class="kid-h" data-act="kid" data-id="${it.id}" data-kid="${k.id}" aria-expanded="${open}"><b>${esc(pick(k.to))}</b><span>${esc(pick(k.subject))} — ${esc(first)}</span>${icon("chev")}</button>
        ${open ? `<div class="kid-b">${k.revising ? writing : `<div class="pv">${esc(pick(k.body))}</div>`}
          ${k.revised ? `<p class="changed">${t("按你说的改了：", "Changed as you said: ")}${esc(k.revised)}</p>` : ""}
          <div class="acts"><button type="button" class="btn" data-act="yes" data-id="${it.id}" data-kid="${k.id}" ${k.revising ? "disabled" : ""}>${t("发送", "Send")}</button>
          <button type="button" class="btn" data-act="edit" data-id="${it.id}" data-kid="${k.id}" ${k.revising ? "disabled" : ""}>${t("改", "Change")}</button>
          <button type="button" class="btn" data-act="no" data-id="${it.id}" data-kid="${k.id}" ${k.revising ? "disabled" : ""}>${t("不发", "Don't send")}</button></div></div>` : ""}</li>`;
    }).join("")}</ol>`;
  } else if (it.revising) body = writing;
  else if (it.steps) body = `<ol class="pv">${it.steps.map((s) => `<li>${esc(pick(s))}</li>`).join("")}</ol><p class="only">${t(`只执行上面这些，不多做 · ${it.until} 前有效`, `Runs exactly these steps, nothing more · open until ${it.until}`)}</p>`;
  else if (it.body) body = `<div class="pv">${esc(pick(it.body))}</div>`;
  const off = it.revising ? "disabled" : "";
  return `<li class="it" ${cur ? "data-cur" : ""} data-card="${it.id}" aria-current="${cur}">
    ${top}<h3>${esc(pick(titleOf(it)))}</h3><p class="alf-line">${icon("alfred")}<span>${esc(pick(it.why))}</span></p>
    ${body}${it.revised ? `<p class="changed">${t("按你说的改了：", "Changed as you said: ")}${esc(it.revised)}</p>` : ""}
    <div class="acts"><button type="button" class="btn yes" data-act="yes" data-id="${it.id}" ${off}>${pick(it.yes.label)}${key("↵")}</button>
      ${it.alt ? `<button type="button" class="btn" data-act="alt" data-id="${it.id}" ${off}>${pick(it.alt.label)}</button>` : ""}
      ${it.edit && !it.kids ? `<button type="button" class="btn" data-act="edit" data-id="${it.id}" ${off} aria-pressed="${S.attach?.id === it.id}">${t("改", "Change")}${key("E")}</button>` : ""}
      ${it.no ? `<button type="button" class="btn" data-act="no" data-id="${it.id}" ${off}>${pick(it.no.label)}${key("X")}</button>` : ""}</div></li>`;
}
const receipt = () => `<li class="rc" role="status">${icon("check")}<span>${esc(pick(S.last.text))}</span><span class="grow"></span><button type="button" data-act="undo">${t("撤销", "Undo")}${key("Z")}</button></li>`;

function inbox() {
  const n = waiting();
  const rows = S.items.map(card);
  if (S.last && S.last.page === "inbox") rows.splice(Math.min(S.last.index, rows.length), 0, receipt());
  const keys = `<span class="keys"><span>${key("J")}${key("K")}${t("换一件", "move")}</span><span>${key("↵")}${t("照办", "do it")}</span><span>${key("Z")}${t("撤销", "undo")}</span></span>`;
  const fyi = S.fyi.length ? `<h2 class="sec-h"><b>${t("告诉你一声", "For your information")}</b><span class="n">${S.fyi.length}</span><span class="grow"></span><span>${t("离开这页就收进记录", "Filed when you leave this page")}</span></h2>
    <ul class="rows">${S.fyi.map((f) => `<li class="row"><span class="ld">${icon("check")}</span><span class="t">${esc(pick(f.text))}</span><span class="s"><span>${esc(pick(f.sub))}</span></span><span class="e">${pick(f.at)}</span></li>`).join("")}</ul>` : "";
  const today = S.log.findIndex((e) => e.day), count = today < 0 ? S.log.length : today;
  const log = `<h2 class="sec-h"><button type="button" class="fold" data-act="fold-log" aria-expanded="${S.logOpen}">${icon("chev")}${t("记录", "Record")}<span class="n">${t(`今天 ${count} 件`, `${count} today`)}</span></button></h2>
    ${S.logOpen ? `<ul class="rows">${S.log.map((e) => e.day ? `<li class="day">${pick(e.day)}</li>` : `<li class="ev ${e.fresh ? "fresh" : ""}"><span class="at">${e.at}</span>
      <span class="who ${e.who === "alfred" ? "alf" : ""}">${icon(e.who === "alfred" ? "alfred" : "you")}</span><span class="t">${esc(pick(e.text))}</span>${e.where ? `<span class="e">${pick(e.where)}</span>` : ""}</li>`).join("")}</ul>` : ""}`;
  return `<header class="page-head"><h1>${t("通知", "Inbox")}</h1><span>${n ? t(`${n} 件等你`, `${n} waiting on you`) : t("没有事在等你", "Nothing is waiting on you")}</span></header>
    ${n ? `<h2 class="sec-h"><b>${t("等你", "Waiting on you")}</b><span class="n" data-k="warm">${n}</span><span class="grow"></span>${keys}</h2>` : `<div style="height:14px"></div>`}
    ${rows.length ? `<ol class="q" data-keys>${rows.join("")}</ol>` : ""}
    ${n ? "" : `<div class="clear"><svg id="fig" viewBox="0 0 120 120" role="img" aria-label="Alfred"></svg><p>${t("没有事在等你", "Nothing is waiting on you")}<small>${S.doing.length ? t(`在办 ${S.doing.length} 件`, `${S.doing.length} in progress`) : t("我的事都没有卡在你这里", "Nothing of mine is stuck with you")}</small></p></div>`}
    ${fyi}${log}`;
}

/* ── The cards over the page ── */
const READS = {
  report: () => `<h3>${t("结论", "In short")}</h3><p>${t("按你现在的用量，第二家最合适：300M，每月 89 元，合约一年，装机免费。", "For how you use it, the second plan fits best: 300M, ¥89 a month, a one-year contract, free installation.")}</p>
    <h3>${t("三家", "The three")}</h3><ul><li><time>¥69</time><span>${t("100M，两年合约，装机 100 元", "100M, two-year contract, ¥100 installation")}</span></li>
      <li><time>¥89</time><span>${t("300M，一年合约，装机免费", "300M, one-year contract, free installation")}</span></li><li><time>¥129</time><span>${t("1000M，一年合约，送路由器", "1000M, one-year contract, router included")}</span></li></ul>`,
  list: () => `<h3>${t("按类别", "By category")}</h3><ul><li><time>12</time><span>${t("吃饭", "Meals")}</span></li><li><time>9</time><span>${t("打车和地铁", "Taxis and metro")}</span></li>
      <li><time>6</time><span>${t("书和文具", "Books and stationery")}</span></li><li><time>4</time><span>${t("其他", "Other")}</span></li></ul>`,
};
const closeX = `<button type="button" class="x" data-act="close" aria-label="${"×"}">${icon("x")}</button>`;
function sheet() {
  if (!S.open) return "";
  if (S.open.type === "read") {
    const g = S.done.find((x) => x.id === S.open.id);
    return g ? `<div class="pop" data-act="close"><article class="sheet" role="dialog" aria-modal="true"><header class="sheet-h"><div><h2>${esc(pick(g.title))}</h2><small>${pick(g.at)} · ${esc(pick(g.sub))}</small></div>${closeX}</header>

}

/* ── The line at the bottom, the dock, the shell ── */

const PAGES = () => [
  ["today", "alfred", "alfred", t("今天", "Today")], ["inbox", "inbox", "warm", t("通知", "Inbox")],
  ["cal", "calendar", "now", t("日程", "Calendar")], ["todo", "todo", "blue", t("待办", "Todos")],
];
function shell() {

    ? [next ? t(`下一件 ${next.at} ${pick(next.title)}`, `Next: ${pick(next.title)} at ${next.at}`) : t("今天没有别的安排了", "Nothing else today"), n ? `<b data-k="warm">${t(`${n} 件等你`, `${n} waiting on you`)}</b>` : ""].filter(Boolean).join(" · ")
    : [n ? `<b data-k="warm">${t(`${n} 件等你`, `${n} waiting on you`)}</b>` : t("没有事在等你", "Nothing is waiting on you"), S.fyi.length ? t(`${S.fyi.length} 条告知`, `${S.fyi.length} to know`) : ""].filter(Boolean).join(" · ");

  const P = PAGES();

    ${nav(P[0])}${nav(P[1], n ? `<span class="n" data-k="warm">${n}</span>` : "")}${nav(P[2])}${nav(P[3], `<span class="n">11</span>`)}

/* ── Render ── */
const SCENE = { morning: ["早上 08:10", "Morning 08:10"], afternoon: ["下午 15:40", "Afternoon 15:40"], evening: ["晚上 21:05", "Evening 21:05"] };
function render({ reveal = false } = {}) {

/* ── Deciding ── */
const snapshot = () => structuredClone({ items: S.items, doing: S.doing, log: S.log, mail: S.mail, cur: S.cur, exp: S.exp });
let timer = 0;
function leave(index, text, snap) {
  S.last = { index, text, snap, page: S.page };
  if (S.attach && !S.items.some((it) => it.id === S.attach.id)) S.attach = null;
  const after = (S.items[index] ?? S.items[index - 1])?.id ?? null;
  if (!S.items.some((it) => it.id === S.cur)) S.cur = after;
  if (!S.items.some((it) => it.id === S.exp)) S.exp = S.items[0]?.id ?? null;
  clearTimeout(timer);
  timer = setTimeout(() => { S.last = null; render(); }, 9000); // the seconds in which it can be taken back
  if (S.page !== "inbox") say(`${pick(text)} · ${t("通知页里可以撤销", "undo in the Inbox")}`);
}
const record = (text, who = "you") => S.log.unshift({ at: S.now, who, text, where: who === "you" ? ["在这台 Mac 上", "On this Mac"] : undefined, fresh: true });
function decide(id, how, kidId) {
  const index = S.items.findIndex((it) => it.id === id), it = S.items[index];
  if (!it || it.revising) return;
  const snap = snapshot();
  let text;
  if (it.kids) {
    const gone = kidId ? it.kids.filter((k) => k.id === kidId) : it.kids;
    if (!gone.length || gone.some((k) => k.revising)) return;
    it.kids = it.kids.filter((k) => !gone.includes(k));
    const who = gone.length === 1 ? pick(gone[0].to) : null;
    text = how === "yes" ? (who ? [`回${who}的信 10 秒后发出`, `The reply to ${who} leaves in 10s`] : [`${gone.length} 封回信 10 秒后发出`, `${gone.length} replies leave in 10s`])
      : (who ? [`回${who}的信没发，草稿丢掉了`, `The reply to ${who} was not sent; the draft is gone`] : [`${gone.length} 封都没发`, `None of the ${gone.length} sent`]);
    if (!it.kids.length) S.items.splice(index, 1);
    if (how === "yes") for (const k of gone) if (k.mail) S.mail.find((m) => m.id === k.mail).gone = true;
    S.kid = null;
  } else {
    const act = it[how];
    if (!act) return;
    S.items.splice(index, 1);
    text = act.done;
    if (act.resume) S.doing.unshift(structuredClone(act.resume));
    if (it.mail && how === "yes") S.mail.find((m) => m.id === it.mail).gone = true;
  }
  record([`${how === "no" ? "你没同意" : "你同意了"}：${text[0]}`, `${how === "no" ? "You said no" : "You said yes"}: ${text[1]}`]);
  leave(index, text, snap);
}
function undo() { if (!S.last) return; Object.assign(S, S.last.snap); S.last = null; clearTimeout(timer); }
function revise(words) {
  const it = S.items.find((x) => x.id === S.attach.id), target = it?.kids?.find((k) => k.id === S.attach.kid) ?? it;
  S.attach = null;
  if (!target) return;
  target.revising = true;
  setTimeout(() => { target.revising = false; target.revised = words; if (target.alt && target.body) target.body = target.alt; render(); }, still() ? 0 : 1500);
}
function move(step) {
  if (!S.items.length) return;
  const index = S.items.findIndex((it) => it.id === S.cur);
  S.cur = S.items[Math.max(0, Math.min(S.items.length - 1, index + step))].id;
  render({ reveal: true });
}
function say(text) { S.said = text; setTimeout(() => { if (S.said === text) { S.said = null; render(); } }, 4200); }
/** What only told you something is filed once you have seen it and leave the page. */
function go(page) {
  if (S.page === "inbox" && page !== "inbox" && S.fyi.length) {
    for (const f of S.fyi) S.log.unshift({ at: S.now, who: "alfred", text: [`看过了：${f.text[0]}`, `Seen: ${f.text[1]}`] });
    S.fyi = [];
  }
  S.page = page;
  S.exp = S.items[0]?.id ?? null;
  document.getElementById("scroll").scrollTo(0, 0);
}

/* ── The first run ── */
const STOPS = () => [
  { at: "today", page: "today", title: t("今天", "Today"), text: t("我每天早上在这里写给你：下一件是什么、几点、从哪进去。", "Each morning I write to you here: what is next, when, and where to go in.") },
  { at: "nav-inbox", page: "today", title: t("通知", "Inbox"), text: t("我自己的事卡在你这里时，在这里等你。它越短越好。", "When something of mine is stuck with you, it waits here. The shorter, the better.") },
  { at: "line", page: "today", title: t("底下这一行", "The line at the bottom"), text: t("交代我做事、问我、搜索，都在这里。", "Hand me something, ask me, or search: all here.") },
  { at: "nav", page: "today", title: t("别的页面", "The other pages"), text: t("日程、待办、邮件都在这。我只告诉你哪封可能要回，不替你写。", "Calendar, todos and mail are here. I tell you which letter may need a reply; I don't write it for you.") },
];
function startOb(old) { S.ob = old ? { step: 4, old: true, time: "07:30", stop: 0 } : { step: 1, name: "", model: false, google: false, time: "07:30", stop: 0 }; S.page = "today"; render(); renderOb(); }
function endOb() { if (S.ob && !S.ob.old && S.ob.name) S.name = S.ob.name; S.ob = null; render(); renderOb(); }
function renderOb() {
  const el = document.getElementById("ob"), o = S.ob;

  const done = (yes, label) => yes ? `<span class="ok">${icon("check")}${t("接上了", "Connected")}</span>` : `<button type="button" class="btn" data-ob-act="${label}">${t("接上", "Connect")}</button>`;
  if (o.step === 5) {
    const stop = STOPS()[o.stop], last = o.stop === STOPS().length - 1;

        <button type="button" class="btn solid small" data-ob-act="stop">${last ? t("开始用", "Start") : t("下一站", "Next")}${icon("arrow")}</button></div></div></div></div>`;
    createFigure(document.getElementById("ob-fig"), { state: "speak", width: 5, dark: document.documentElement.dataset.scheme === "dark" });
    placeTour();

  }
  const body = {
    1: `<h2><label for="ob-name">${t("我应该如何称呼你？", "What should I call you?")}</label></h2>
      <form class="ob-form" id="ob-name-form"><input id="ob-name" autocomplete="nickname" maxlength="40" placeholder="${t("名字或昵称", "Your name or nickname")}" value="${esc(o.name)}"><button type="submit" class="btn solid">${t("继续", "Continue")}</button></form>`,
    2: `<h2>${t("先给我接上一个模型", "First, connect a model for me")}</h2><p>${t("没有它我什么都做不了。用你已有的订阅登录，或填一个密钥。", "Without one I can do nothing. Sign in with a subscription you have, or paste a key.")}</p>
      <ul class="ob-list"><li><span class="t">${t("用订阅登录", "Sign in with a subscription")}<small>${t("不另外收费", "No extra charge")}</small></span>${done(o.model, "model")}</li>
        <li><span class="t">${t("填 API 密钥", "Paste an API key")}<small>${t("按用量计费", "Billed by use")}</small></span>${o.model ? "" : `<button type="button" class="btn" data-ob-act="model">${t("填写", "Enter")}</button>`}</li></ul>
      ${o.model ? `<button type="button" class="btn solid" data-ob-act="next">${t("继续", "Continue")}</button>` : ""}`,
    3: `<h2>${t("接上日历和邮件", "Connect your calendar and mail")}</h2><p>${t("接上了，「今天」才有日程和邮件可写。我只读；要改什么会先问你。", "With them, Today has events and mail to write about. I only read; I ask before changing anything.")}</p>
      <ul class="ob-list"><li><span class="t">Google<small>${t("日历 · Gmail", "Calendar · Gmail")}</small></span>${done(o.google, "google")}</li></ul>
      ${o.google ? `<button type="button" class="btn solid" data-ob-act="next">${t("继续", "Continue")}</button>` : ""}`,
    4: `<h2>${t("每天早上几点写「今天」？", "When should I write Today each morning?")}</h2>

      <div class="chips">${["07:00", "07:30", "08:00", "off"].map((v) => `<button type="button" class="chip" data-ob-time="${v}" aria-pressed="${o.time === v}">${v === "off" ? t("先不开", "Not now") : v}</button>`).join("")}</div>
      <button type="button" class="btn solid" data-ob-act="next">${t("带我走一圈", "Show me round")}</button>`,
  }[o.step];
  el.innerHTML = `<div class="ob"><div class="ob-in"><svg id="ob-fig" viewBox="0 0 120 120" role="img" aria-label="Alfred"></svg>${body}${dots}</div></div>`;

}
function placeTour() {
  const spot = document.getElementById("spot"), card = document.getElementById("say");
  if (!spot || !card || S.ob?.step !== 5) return;
  const phone = innerWidth <= 700, at = STOPS()[S.ob.stop].at;
  const target = at === "today" ? document.querySelector('[data-tour="today"]')
    : at === "nav-inbox" ? document.querySelector(`${phone ? "#dock" : "#side"} [data-tour-nav="inbox"]`)
    : at === "line" ? document.querySelector(phone ? '[data-tour="bubble"]' : ".line")
    : document.querySelector(phone ? '[data-tour="dock"]' : "#side");
  if (!target) return;
  // The walk round sits under the prototype's strip, so everything is measured from below it.
  const strip = document.getElementById("proto").offsetHeight, box = target.getBoundingClientRect(), pad = 6;
  const r = { left: box.left, right: box.right, width: box.width, height: box.height, top: box.top - strip, bottom: box.bottom - strip };
  const innerHeight = window.innerHeight - strip;
  Object.assign(spot.style, { left: `${r.left - pad}px`, top: `${r.top - pad}px`, width: `${r.width + pad * 2}px`, height: `${r.height + pad * 2}px` });
  const w = card.offsetWidth, h = card.offsetHeight, gap = 14;
  let left = r.left, top = r.bottom + gap;
  if (!phone && r.height > innerHeight * .5) { left = r.right + gap; top = r.top + 60; }         // a tall thing: beside it
  else if (top + h > innerHeight - 12) top = r.top - gap - h;                                    // no room below: above it
  else if (!phone && r.width < 260) { left = r.right + gap; top = r.top - 10; }                   // a small thing in the sidebar: beside it
  Object.assign(card.style, { left: `${Math.max(12, Math.min(left, innerWidth - w - 12))}px`, top: `${Math.max(12, Math.min(top, innerHeight - h - 12))}px` });
}
addEventListener("resize", placeTour);

/* ── Events ── */
document.addEventListener("click", (event) => {
  const ob = event.target.closest("[data-ob-act],[data-ob-time]");
  if (ob && S.ob) {
    const o = S.ob, act = ob.dataset.obAct;
    if (ob.dataset.obTime) o.time = ob.dataset.obTime;
    else if (act === "model") o.model = true;
    else if (act === "google") o.google = true;
    else if (act === "next" || act === "skip") { o.step += 1; if (o.step === 5 && o.name) S.name = o.name; if (o.step === 5) render(); }
    else if (act === "stop") { if (o.stop === STOPS().length - 1) return endOb(); o.stop += 1; }
    else if (act === "end") return endOb();
    return renderOb();
  }
  const el = event.target.closest("[data-act],[data-ob],[data-scene],[data-lang],[data-scheme],[data-reset],[data-card]");
  if (!el) return;
  const url = () => history.replaceState(null, "", `?p=${S.page}&s=${S.scene}${S.lang === "en" ? "&lang=en" : ""}`);
  if (el.dataset.ob) return startOb(el.dataset.ob === "old");
  if (el.dataset.scene) { S.scene = el.dataset.scene; seed(); url(); return render(); }
  if (el.hasAttribute("data-lang")) { S.lang = S.lang === "en" ? "zh" : "en"; url(); render(); return renderOb(); }
  if (el.hasAttribute("data-scheme")) { const root = document.documentElement; root.dataset.scheme = root.dataset.scheme === "dark" ? "light" : "dark"; render(); return renderOb(); }
  if (el.hasAttribute("data-reset")) { S.name = ""; S.ob = null; seed(); render(); return renderOb(); }
  const { act, id, kid } = el.dataset;
  if (!act) { // a click on a card makes it the current one
    if (S.page === "inbox" && el.dataset.card !== S.cur) { S.cur = el.dataset.card; render(); }
    return;
  }
  if (id && S.items.some((it) => it.id === id)) { if (S.page === "inbox") S.cur = id; else S.exp = id; }
  switch (act) {
    case "page": if (S.ob) { S.ob = null; renderOb(); } go(el.dataset.page); url(); break;
    case "exp": S.exp = id; break;
    case "yes": case "no": case "alt": decide(id, act, kid); if (S.open?.type === "mail") S.open = null; break;
    case "kid": S.kid = S.kid === kid ? null : kid; break;
    case "edit": S.attach = S.attach?.id === id && S.attach.kid === kid ? null : { id, kid }; S.asking = !!S.attach; render(); document.getElementById("draft").focus(); return;
    case "detach": S.attach = null; break;
    case "undo": undo(); break;
    case "fold-log": S.logOpen = !S.logOpen; break;
    case "tick": { const row = S.day.find((r) => r.id === id); row.done = !row.done; if (row.done) row.sug = false; break; }
    case "place": { const row = S.day.find((r) => r.id === id); row.sug = false; row.placed = true; break; }
    case "unplace": { const row = S.day.find((r) => r.id === id); row.sug = true; row.placed = false; break; }
    case "update": S.updating = true; setTimeout(() => { S.updating = false; S.wrote = S.now; render(); }, still() ? 0 : 1400); break;
    case "open": { S.open = { type: el.dataset.type, id }; const g = S.done.find((x) => x.id === id); if (g) g.unread = false; break; }
    case "close": if (event.target !== el && !el.classList.contains("x") && !el.classList.contains("btn")) return; S.open = null; break;
    case "draft": {
      const m = S.mail.find((x) => x.id === id);
      m.drafting = true;
      setTimeout(() => {
        m.drafting = false;
        const group = S.items.find((it) => it.kids && it.src === "mail");
        // The same kind of thing joins the card that is already there.
        if (group) group.kids.push({ id: `dr-${m.id}`, mail: m.id, to: m.from, subject: m.subject, body: m.draft });
        else S.items.push({ id: `dr-${m.id}`, mail: m.id, src: "mail", label: ["你让我写的回信", "A reply you asked for"], title: [`回${m.from[0]}：${m.subject[0]}`, `Reply to ${m.from[1]}: ${m.subject[1]}`],
          why: ["你刚在这封信下点了「起草回复」", "You just pressed “Draft a reply” under this letter"], body: m.draft,
          yes: { label: ["发送", "Send"], done: [`回${m.from[0]}的信 10 秒后发出`, `The reply to ${m.from[1]} leaves in 10s`] },
          no: { label: ["不发", "Don't send"], done: [`回${m.from[0]}的信没发`, `The reply to ${m.from[1]} was not sent`] }, edit: true });
        S.cur ??= S.items[0].id;
        S.exp ??= S.items[0].id;
        render();
      }, still() ? 0 : 1400);
      break;
    }
    case "ask-on": S.asking = true; render(); document.getElementById("draft").focus(); return;
    case "ask-off": S.asking = false; S.attach = null; break;
    case "say-link": say(t("原型里不开外面的链接：这里直接进会议、开文档或地图", "No outside links in the prototype: this opens the meeting, the doc or the map")); break;
    case "say-page": say(t(`这里切到${el.dataset.name}`, `This goes to ${el.dataset.name}`)); break;
    case "say-open": say(t("这里打开那条对话或会话，看它办到哪了", "This opens that conversation or session, to see how far it is")); break;
  }
  render();
});
document.addEventListener("input", (event) => {
  if (event.target.id === "ob-name" && S.ob) { S.ob.name = event.target.value.trim(); return; }
  if (event.target.id !== "draft") return;
  const was = !!S.draft.trim();
  S.draft = event.target.value;
  if (was !== !!S.draft.trim()) document.querySelector(".line .go").disabled = !S.draft.trim();
});
document.addEventListener("submit", (event) => {
  event.preventDefault();
  if (event.target.id === "ob-name-form") { S.ob.step = 2; return renderOb(); }
  const words = S.draft.trim();
  if (!words) return;
  S.draft = "";
  if (S.attach) revise(words);
  else say(t("原型不接模型：这里会开始一件事，它出现在「今天」的在办里", "No model here: this would start a task, and it would show under In progress on Today"));
  render();
});
document.addEventListener("keydown", (event) => {
  if (S.ob) { if (event.key === "Escape" && S.ob.step === 5) endOb(); return; }
  if (event.key === "Escape") {
    if (S.open) S.open = null; else if (S.attach) S.attach = null; else return;
    return render();
  }
  if (event.target.closest?.("input, textarea") || event.metaKey || event.ctrlKey || event.altKey || S.open) return;
  const k = event.key.toLowerCase();
  if (k === "z") { undo(); return render(); }
  if (S.page !== "inbox") return;
  const it = S.items.find((x) => x.id === S.cur);
  if (k === "j" || k === "arrowdown") { event.preventDefault(); return move(1); }
  if (k === "k" || k === "arrowup") { event.preventDefault(); return move(-1); }
  if (!it) return;
  if (k === "enter") { if (event.target.closest?.("button")) return; decide(it.id, "yes"); }
  else if (k === "x" && it.no) decide(it.id, "no");
  else if (k === "e" && it.kids) S.kid = S.kid ? null : it.kids[0].id;
  else if (k === "e" && it.edit) { event.preventDefault(); S.attach = { id: it.id }; render(); document.getElementById("draft").focus(); return; }
  else return;
  render({ reveal: true });
});

seed();
render();
if (params.get("ob")) startOb(params.get("ob") === "old");
</script>
</body>
</html>
