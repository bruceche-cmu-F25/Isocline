<!doctype html>
<!--
  Alfred workspace: layout prototype. It has no build step and uses sample data only.
  Each workspace is one full page: 通知 / 日程 / 待办 / 邮件 / 调研 / 自动任务.
  Alfred is the panel on the right. It knows which page you are on, and you can expand it or fold it away.
  The sidebar has two states: full with labels (A), or folded into an icon rail with hover summaries (C).
  Fold it with the button, with ⌘\, or by dragging its edge inward.
  Drag the line between the page and Alfred to share the space; double-click it to reset. Widths are remembered.
  Under 760px wide it becomes the phone layout: a bottom dock, with Alfred as a sheet.
  The styling is a neutral placeholder; the visual language is still open.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfred 工作台</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="stylesheet" href="tokens.css">
<style>
/* Colours come from tokens.css. The theme and scheme are set on <html> by the script. */
:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.23, 1, .32, 1);
}

/* 雾 mist: the sidebar is frosted glass floating over the desktop, after macOS Tahoe. */
:root[data-theme="mist"] body { background: linear-gradient(140deg, oklch(.88 .05 250), oklch(.92 .035 205) 45%, oklch(.9 .045 300)); }
:root[data-theme="mist"][data-scheme="dark"] body { background: linear-gradient(140deg, oklch(.26 .06 262), oklch(.22 .04 220) 45%, oklch(.25 .06 300)); }
:root[data-theme="mist"] .page { background: var(--bg); }
:root[data-theme="mist"] .side { margin: 8px 0 8px 8px; border: 0; border-radius: 14px; background: color-mix(in oklch, var(--paper) 55%, transparent); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--raise) 45%, transparent), 0 8px 30px oklch(0 0 0 / .08); }
:root[data-theme="mist"] .find { background: color-mix(in oklch, var(--raise) 60%, transparent); }
:root[data-theme="mist"] .nav-item:hover, :root[data-theme="mist"] .nav-item[aria-current="page"] { background: color-mix(in oklch, var(--ink) 8%, transparent); }

/* Theme switcher (prototype only) */
.swatch-bar { position: fixed; top: 10px; left: 50%; z-index: 50; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 12px; background: var(--raise); box-shadow: var(--shadow), inset 0 0 0 1px var(--line-soft); font-size: 12px; }
.swatch-bar b { padding: 0 8px; color: var(--muted); font-weight: 500; }
.swatch-bar i { width: 1px; height: 16px; margin: 0 4px; background: var(--line); }
.swatch-bar button { height: 26px; padding: 0 10px; border-radius: 8px; color: var(--copy); }
.swatch-bar button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
html[data-bare] .swatch-bar { display: none; }
@media (max-width: 760px) { .swatch-bar { display: none; } }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--alf); outline-offset: 2px; }
.muted { color: var(--muted); }

/* ── Shell: navigation | page | Alfred ───────────────────── */
.app {
  position: relative; height: 100dvh; display: grid;
  /* JS sets --nav-px and --alf-px from the dragged widths */
  --nav: var(--nav-px, 200px); --pg: minmax(0, 1fr); --alf-w: var(--alf-px, 400px);
  grid-template-columns: var(--nav) var(--pg) var(--alf-w);
  grid-template-rows: minmax(0, 1fr);
  grid-template-areas: "nav page alf";
}
body[data-nav="rail"] .app { --nav: 56px; }
body[data-alfred="closed"] .app { --alf-w: 0px; }
body[data-alfred="closed"] .alfred { display: none; }
body[data-alfred="wide"] .app { --pg: 0px; --alf-w: minmax(0, 1fr); }
body[data-alfred="wide"] .page { display: none; }

.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }

/* Draggable dividers */
.resizer { position: absolute; top: 0; bottom: 0; z-index: 8; width: 9px; cursor: col-resize; touch-action: none; }
.resizer::after { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; transition: background-color 150ms; }
.resizer:hover::after, .resizer.active::after { left: 3px; width: 3px; background: var(--alf); }
#rz-nav { left: calc(var(--nav) - 5px); }
#rz-alf { right: calc(var(--alf-w) - 5px); }
body[data-alfred="closed"] #rz-alf, body[data-alfred="wide"] #rz-alf { display: none; }
body.resizing { cursor: col-resize; user-select: none; }

/* Sidebar, full (A) */
.side { grid-area: nav; min-width: 0; min-height: 0; position: relative; z-index: 5; display: flex; flex-direction: column; gap: 1px; padding: 10px 8px 12px; background: var(--paper); border-right: 1px solid var(--line-soft); }
.side-top { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 12px 6px; }
.find { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 9px; margin-bottom: 10px; border-radius: 8px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); color: var(--muted); font-size: 13px; white-space: nowrap; }
.find:hover { color: var(--copy); box-shadow: inset 0 0 0 1px var(--line); }
.find kbd { margin-left: auto; font: 11px var(--mono); }
.nav-label { padding: 12px 9px 4px; color: var(--muted); font-size: 12px; }
.nav-sep { display: none; }
.nav-item { position: relative; width: 100%; height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 9px; border-radius: 8px; color: var(--copy); font-size: 13.5px; text-align: left; white-space: nowrap; }
.nav-item:hover { background: var(--wash); }
.nav-item[aria-current="page"] { background: var(--wash); color: var(--ink); font-weight: 500; }
.nav-item .count { margin-left: auto; }
.nav-item svg { color: var(--k-solid, currentColor); }
.nav-item .count.pill { color: #fff; font-family: var(--sans); }
.nav-spacer { flex: 1; min-height: 12px; }
/* Conversations, at the bottom of the sidebar */
.conv-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 2px 4px 9px; color: var(--muted); font-size: 12px; }
.conv-head .icon-btn { width: 24px; height: 24px; }
.conv-head .icon-btn svg { width: 15px; height: 15px; }
.conv-list { display: flex; flex-direction: column; gap: 1px; margin-bottom: 8px; }
.conv { width: 100%; height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 9px; border-radius: 8px; color: var(--copy); font-size: 13px; text-align: left; }
.conv:hover { background: var(--wash); }
.conv[aria-current="true"] { background: var(--wash); color: var(--ink); }
.conv .st { flex: none; width: 18px; display: grid; place-items: center; }
.conv .ct { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.conv .time { flex: none; color: var(--muted); font: 11px var(--mono); }
.conv-rail { display: none !important; }
body[data-nav="rail"] .conv-head, body[data-nav="rail"] .conv-list { display: none; }
body[data-nav="rail"] .conv-rail { display: flex !important; }
.sheet-label { padding: 12px 14px 4px; color: var(--muted); font-size: 12px; }
.more-sheet .conv { height: 44px; font-size: 15px; }
.thread-title { display: flex; justify-content: space-between; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line-soft); color: var(--muted); font-size: 12px; }
.thread-title span { font-family: var(--mono); }
.count { font: 12px var(--mono); color: var(--muted); }
.count.hot { color: var(--warm); }
.peek { display: none; }

/* Sidebar, folded into an icon rail (C), with a summary on hover */
body[data-nav="rail"] .side { align-items: center; padding: 10px 6px 12px; }
body[data-nav="rail"] .side-top { flex-direction: column; gap: 12px; padding: 4px 0 12px; }
body[data-nav="rail"] .lights { gap: 5px; }
body[data-nav="rail"] .lights i { width: 9px; height: 9px; }
body[data-nav="rail"] .find { width: 40px; height: 34px; justify-content: center; padding: 0; }
body[data-nav="rail"] .find span, body[data-nav="rail"] .find kbd, body[data-nav="rail"] .nav-label, body[data-nav="rail"] .nav-item .label { display: none; }
body[data-nav="rail"] .nav-sep { display: block; width: 22px; height: 1px; margin: 10px 0; background: var(--line); }
body[data-nav="rail"] .nav-item { width: 40px; height: 40px; justify-content: center; padding: 0; border-radius: 10px; }
body[data-nav="rail"] .nav-item svg { width: 20px; height: 20px; }
body[data-nav="rail"] .nav-item .count { position: absolute; top: 3px; right: 1px; min-width: 16px; height: 16px; padding: 0 4px; margin: 0; display: grid; place-items: center; border-radius: 8px; background: var(--warm); color: #fff; font-size: 10px; }
body[data-nav="rail"] .nav-item .count:empty { display: none; }
body[data-nav="rail"] .nav-item:hover .peek { display: flex; }
.peek { position: absolute; left: 48px; top: 50%; transform: translateY(-50%); z-index: 20; flex-direction: column; gap: 1px; min-width: 210px; padding: 10px 14px; border-radius: 12px; background: var(--raise); box-shadow: var(--shadow), inset 0 0 0 1px var(--line-soft); white-space: nowrap; text-align: left; pointer-events: none; }
.peek b { color: var(--ink); font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.peek span { color: var(--copy); font-size: 13px; }

.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.icon-btn:hover { background: var(--wash); color: var(--ink); }
.icon-btn[aria-pressed="true"] { color: var(--ink); }

/* ── Page ─────────────────────────────────────────────────── */
.page { grid-area: page; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.page-in { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.enter-fade { animation: fade 220ms var(--ease); }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }

.page-head { flex: none; padding: 40px 40px 18px; }
.page-head h1 { display: flex; align-items: center; gap: 12px; font-size: 30px; line-height: 1.2; font-weight: 650; letter-spacing: -.01em; }
.page-head h1 svg { width: 28px; height: 28px; color: var(--k-solid); stroke-width: 1.9; }

/* ── Colour components (see tokens.css for the roles) ──
   Emphasis ladder: 0 quiet (muted, no colour) · 1 mark (a dot or icon) · 2 tint (fill + coloured text) · 3 solid (one per view). */
.tag { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 6px; background: var(--k-fill); color: var(--k-text); font-size: 12px; font-weight: 500; white-space: nowrap; }
.tag.dot-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--k-solid); }
.mark { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--k-solid); }
.avatar { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--k-fill); color: var(--k-text); font-size: 13px; font-weight: 650; }
.pill { min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: 10px; background: var(--k-solid); color: #fff; font: 600 11px var(--sans); }
.chip .mark { width: 7px; height: 7px; }
.chip[aria-pressed="false"].off { opacity: .45; text-decoration: line-through; }
.page-sub { margin-top: 6px; color: var(--muted); font-size: 14px; }
.chips { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 40px 18px; }
.chip { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 13px; border-radius: 999px; color: var(--copy); font-size: 13px; box-shadow: inset 0 0 0 1px var(--line); }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.chip .count { color: inherit; opacity: .6; }
.body-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 40px 80px; }

.btn { min-height: 34px; display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 500; }
.btn.ghost { background: none; color: var(--copy); box-shadow: inset 0 0 0 1px var(--line); font-weight: 400; }
.btn.ghost:hover { color: var(--ink); }
.btn.alf { background: var(--alf); color: #fff; }
.btn.small { min-height: 28px; padding: 0 11px; font-size: 12px; }
.link { color: var(--alf); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--alf) 35%, transparent); text-underline-offset: 3px; text-align: left; }

/* list | detail */
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); border-top: 1px solid var(--line-soft); }
.split.narrow { grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); }
.list { overflow-y: auto; padding: 8px 10px 80px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 2px; }
.row { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 12px; border-radius: 10px; text-align: left; color: var(--copy); }
.row:hover { background: var(--wash); }
.row[aria-current="true"] { background: var(--wash); }
.row .dot { grid-row: span 2; width: 8px; height: 8px; margin-top: 8px; border-radius: 50%; }
.row .t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--ink); font-weight: 500; }
.row .time { font: 11px/24px var(--mono); color: var(--muted); }
.row .s { grid-column: 2 / 4; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: 13px; }
.row[data-done] .t { color: var(--muted); font-weight: 400; }
.row[data-unread] .t { font-weight: 650; }
.dot { background: var(--k-solid, var(--muted)); }
.dot.done, .dot.read { background: none; box-shadow: inset 0 0 0 1.5px var(--line); }
.detail { overflow-y: auto; padding: 36px 48px 96px; }
.detail-in { max-width: 640px; display: flex; flex-direction: column; gap: 16px; }
.kind { color: var(--muted); font-size: 13px; }
.kind.decide { color: var(--warm); }
.detail h2 { font-size: 24px; line-height: 1.35; font-weight: 650; letter-spacing: -.005em; }
.detail p { color: var(--copy); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.done-line { color: var(--ok) !important; }
.card { padding: 16px 18px; border-radius: 14px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); color: var(--copy); font-size: 14px; }
.card-label { margin-bottom: 6px; color: var(--alf); font-size: 12px; font-weight: 500; }
.card pre { margin: 0; white-space: pre-wrap; font: inherit; }
.back { display: none !important; }

/* Calendar */
.suggest { flex: none; display: flex; align-items: center; gap: 12px; margin: 0 40px 18px; padding: 10px 12px 10px 14px; border-radius: 14px; background: var(--alf-soft); font-size: 14px; }
.suggest p { flex: 1; }
.cal-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 28px 80px 20px; }
.week { display: flex; }
.gutter { width: 52px; flex: none; padding-top: 64px; }
.gutter div { height: 52px; padding-right: 10px; transform: translateY(-8px); text-align: right; color: var(--muted); font: 11px var(--mono); }
.day { flex: 1; min-width: 0; border-left: 1px solid var(--line-soft); }
.day-head { position: sticky; top: 0; z-index: 3; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: var(--bg); color: var(--muted); font-size: 12px; }
.day-head b { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); font-size: 17px; font-weight: 500; }
.day.today .day-head b { background: var(--now); color: #fff; }
.day-body { position: relative; height: calc(12 * 52px); background: repeating-linear-gradient(to bottom, var(--line-soft) 0 1px, transparent 1px 52px); }
.day.weekend .day-body { background-color: color-mix(in srgb, var(--paper) 60%, transparent); }
/* Events: tinted fill, a solid stripe, title in the area's text colour (emphasis level 2). */
.ev { position: absolute; left: 3px; right: 4px; overflow: hidden; padding: 4px 8px 4px 10px; border-radius: 7px; background: var(--k-fill); box-shadow: inset 3px 0 0 var(--k-solid); color: var(--k-text); font-size: 12px; font-weight: 600; line-height: 1.35; }
.ev small { display: block; color: var(--k-text); opacity: .75; font: 400 10px/1.5 var(--mono); }
/* Alfred placed it: same area colour, dashed edge, and Alfred's mark. */
.ev.by-alfred { box-shadow: none; outline: 1.5px dashed var(--k-solid); outline-offset: -1.5px; }
.ev.by-alfred small::before { content: "● "; color: var(--alf); }
.ev.past { opacity: .45; }
.ev[hidden] { display: none; }
.day.today .day-body { background-color: color-mix(in oklch, var(--alf) 4%, transparent); }
.day.today .day-head { color: var(--now); font-weight: 600; }
.legend { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 40px 16px; }
.legend .chip[aria-pressed="true"] { background: none; color: var(--copy); box-shadow: inset 0 0 0 1px var(--line-soft); }
.legend .chip.off { opacity: .4; }
.ev.flash { animation: flash 1.4s var(--ease); }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--alf); } }
.now { position: absolute; left: -1px; right: 0; z-index: 2; height: 2px; background: var(--now); }
.now::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--now); }

/* Todos */
.todo-col { max-width: 760px; }
.add { margin-bottom: 6px; }
.add input { width: 100%; height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); outline: none; }
.add input:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }
.add input::placeholder { color: var(--muted); }
.group { padding-top: 20px; }
.group h3 { display: flex; gap: 8px; padding: 4px 12px 6px; color: var(--muted); font-size: 13px; font-weight: 500; }
.group h3.late { color: var(--warm); }
.todo { display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 6px 8px 6px 12px; border-radius: 10px; }
.todo:hover { background: var(--wash); }
.todo[data-fresh] { animation: flash 1.4s var(--ease); }
/* The ring takes the area's colour (a mark); done fills it. */
.check { flex: none; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--k-solid, var(--line)); color: transparent; }
.check:hover { background: var(--k-fill); }
.check svg { width: 12px; height: 12px; stroke-width: 2.4; }
.todo[data-done] .check { background: var(--k-solid); box-shadow: none; color: #fff; opacity: .55; }
.todo-body { flex: 1; min-width: 0; }
.todo[data-done] .todo-title { color: var(--muted); text-decoration: line-through; }
.todo-meta { display: flex; flex-wrap: wrap; gap: 10px; color: var(--muted); font-size: 12px; }
.todo-meta:empty { display: none; }
.todo-meta .late { color: var(--warm); }
.doing { display: inline-flex; align-items: center; gap: 7px; color: var(--alf); font-size: 12px; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--alf); animation: breathe 1.6s ease-in-out infinite; }
.todo .hand { opacity: 0; }
.todo:hover .hand, .hand:focus-visible { opacity: 1; }
@media (hover: none) { .todo .hand { opacity: 1; } }

/* Mail / research */
.row.mail { grid-template-columns: auto minmax(0, 1fr) auto; }
.row .note { grid-column: 2 / 4; color: var(--alf); font-size: 12px; }
.row .avatar { grid-row: span 2; margin-top: 2px; }
.kind-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
button.tag { cursor: pointer; }
button.tag:hover { box-shadow: inset 0 0 0 1px var(--k-line); }
.mail-body { white-space: pre-wrap; color: var(--copy); line-height: 1.75; }
.article { max-width: 680px; display: flex; flex-direction: column; gap: 16px; color: var(--copy); }
.article h2 { color: var(--ink); }
.article h3 { margin-top: 10px; color: var(--ink); font-size: 15px; font-weight: 600; }
.lead { color: var(--ink) !important; font-size: 17px; line-height: 1.75; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
.steps li { padding: 3px 0; color: var(--muted); }
.steps li.ok { color: var(--copy); }
.steps li.ok::before { content: "✓  "; color: var(--ok); }
.steps li.now { color: var(--ink); }
.steps li.now::before { content: "●  "; color: var(--alf); }
.steps li.todo-step::before { content: "○  "; }
.progress { height: 4px; border-radius: 2px; background: var(--wash); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--alf); }

/* Automations */
.auto-list { max-width: 940px; border-top: 1px solid var(--line-soft); }
.auto-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1.3fr) auto; gap: 16px; align-items: center; padding: 16px 4px; border-bottom: 1px solid var(--line-soft); }

<script type="module">
/* Alfred's figure lives in packages/ui/src/entity/tesseract.js (linked here as figure.js), shared with the Mac app. */
import { createFigure, drawMark } from "./figure.js";
const isDark = () => document.documentElement.dataset.scheme === "dark";
/* One live figure per place (panel head, floating button, phone dock). Renders rebuild the HTML around them, so each

const FIG = {};
const FIG_SIZES = { head: [36, 5.5], fab: [30, 6], dock: [34, 5.8] };
for (const [key, [size, width]] of Object.entries(FIG_SIZES)) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 120 120"); svg.setAttribute("class", "fig"); svg.setAttribute("aria-hidden", "true");

const figSlot = (key) => `<span data-fig="${key}"></span>`;
function placeFigs() {
  document.querySelectorAll("span[data-fig]").forEach((slot) => { const f = FIG[slot.dataset.fig]; slot.replaceWith(f.svg); f.fig.setDark(isDark()); });
  syncFig();
}
/* Greeting, listening, thinking or showing a reply, then the open conversation's state. */
function figState() {
  if (S.greeting) return "hello";
  if (S.listening) return "listen";
  if (S.busy) return "think";
  if (S.speaking) return "flow";
  const c = conv();
  return c.state === "working" ? "work" : c.state === "needs" ? "notice" : "rest";
}
function syncFig() { const st = figState(); for (const f of Object.values(FIG)) f.fig.setState(st); }
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const ICON = {
  inbox: '<path d="M4 13.5h4l1.5 2.5h5l1.5-2.5h4"/><path d="M6.2 5h11.6l2.7 8.5V19H3.5v-5.5z"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  todo: '<circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.2 2.4 2.4 4.6-5"/>',
  mail: '<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m4 7.5 8 5.5 8-5.5"/>',
  doc: '<path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4M10 12h5M10 15.5h5"/>',

  search: '<circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/>',

  sidebar: '<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M9 4.5v15"/>',
  chat: '<path d="M5 19V7.5A2.5 2.5 0 0 1 7.5 5h9A2.5 2.5 0 0 1 19 7.5v6a2.5 2.5 0 0 1-2.5 2.5H9z"/>',
  plus: '<path d="M12 5.5v13M5.5 12h13"/>',

  send: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  more: '<circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/>',
  spark: '<path d="M12 4v4M12 16v4M4 12h4M16 12h4"/>',
  model: '<rect x="6" y="6" width="12" height="12" rx="2.5"/><path d="M10 10h4v4h-4zM9.5 3v3M14.5 3v3M9.5 18v3M14.5 18v3M3 9.5h3M3 14.5h3M18 9.5h3M18 14.5h3"/>',
  user: '<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>',
  plug: '<path d="M9 3v5M15 3v5M6.5 8h11v3a5.5 5.5 0 0 1-11 0zM12 16.5V21"/>',
  bell: '<path d="M18 10a6 6 0 0 0-12 0c0 5.5-2.5 7-2.5 7h17S18 15.5 18 10M10 20.5h4"/>',
  device: '<rect x="3" y="5" width="13" height="10" rx="2"/><path d="M7 19h5M9.5 15v4"/><rect x="17.5" y="9" width="4" height="10" rx="1.2"/>',
  shield: '<path d="M12 3.5 19 6v6c0 4.5-7 8.5-7 8.5S5 16.5 5 12V6z"/><path d="m9 12 2 2 4-4"/>',

const ic = (n) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* Theme (prototype): ?theme=paper|graphite|mist|night, ?scheme=auto|light|dark, ?bare hides the switcher. */
const THEMES = [["paper", "纸"], ["graphite", "石"], ["mist", "雾"], ["night", "夜"]];
const SCHEMES = [["auto", "跟随系统"], ["light", "浅"], ["dark", "深"]];

function applyTheme() {
  const root = document.documentElement;
  root.dataset.theme = T.theme;
  root.dataset.scheme = T.scheme === "auto" ? (darkMQ.matches ? "dark" : "light") : T.scheme;
  if (T.bare) root.dataset.bare = "";
  for (const f of Object.values(FIG)) f.fig.setDark(isDark());
  document.querySelectorAll("svg[data-mark]").forEach((svg) => drawMark(svg, { width: 7, dark: isDark() }));

function line(page) {
  switch (page) {
    case "inbox": return pending() ? `${pending()} 件要你点头，别的我都处理好了。` : "都处理完了，今天不用再看这里。";
    case "cal": return note("n2").done ? "上午 9 点到 12 点是一整块，下午 2–4 点写方案。" : "Mia 想把站会挪到下午；2–4 点我替你占住了写方案。";
    case "todo": return lateOpen() ? `${lateOpen()} 件逾期，报销那件我能直接做。` : "逾期的清掉了，今天还剩 3 件。";
    case "mail": return mail("m1").replied ? "需要你回的只剩 Leo 那封，不急。" : "Stripe 那封我起草好了回复，其余的不急。";
    case "research": return "结论都在第一段；想听短的就问我。";
    case "auto": return "昨夜三个都成功。账单比上月多了 ¥86。";
    case "settings": return !signedIn().length ? "先登录一个模型，我才能开始干活。" : !SET.google.length ? "连上 Google，我就能看你的日程和邮件。" : "都连好了。想改哪项，直接跟我说也行。";
  }
}
function peek(page) {
  const next = todayLeft()[0];
  return {
    inbox: [`${pending()} 件等你决定`, NOTES.find((n) => n.kind === "decide" && !n.done)?.title || "都处理完了"],
    cal: [next ? `下一个：${fmt(next.s)} ${next.title}` : "今天没有了", `今天还有 ${todayLeft().length} 个安排`],
    todo: [`${lateOpen()} 件逾期`, "今天 3 件"],
    mail: [`${unread()} 封未读`, mail("m1").replied ? "Stripe 已回复" : "Stripe 那封有草稿"],
    research: ["1 份写完了", "1 份在做 · 60%"],
    auto: ["5 个在跑", "昨夜全部成功"],
    settings: [signedIn().length ? `模型：${modelLabel(SET.model)}` : "还没登录模型", SET.google.length ? `Google：${SET.google[0].email}` : "Google 没连"],
  }[page];
}
function count(page) {
  const n = page === "inbox" ? pending() : page === "todo" ? lateOpen() : page === "mail" ? unread() : 0;
  return n || "";
}
const hot = (page) => (page === "inbox" || page === "todo" ? "hot" : "");

function convItem(c) {

const head = (id, sub) => { const p = PAGES[pageIdx(id)]; return `<header class="page-head"><h1 data-k="${p.k}">${ic(p.icon)}${p.name}</h1><p class="page-sub">${sub}</p></header>`; };

function pInbox() {
  const F = [["all", "全部"], ["decide", "等你决定"], ["result", "结果"], ["away", "你不在时"], ["remind", "提醒"]];
  const n = (k) => (k === "all" ? NOTES.length : NOTES.filter((x) => x.kind === k).length);
  const list = NOTES.filter((x) => S.inboxFilter === "all" || x.kind === S.inboxFilter);
  const sel = list.find((x) => x.id === S.sel.inbox) || list[0];
  const rows = list.map((x) => `<button class="row" data-act="sel" data-page="inbox" data-id="${x.id}" aria-current="${sel?.id === x.id}" ${x.done ? "data-done" : ""}>

      <span class="s">${x.done ? "✓ " + esc(x.doneText) : esc(x.sum)}</span></button>`).join("");

function noteDetail(x) {

function pCal() {
  const W = ["一", "二", "三", "四", "五", "六", "日"];
  S.hideAreas ||= new Set();
  const left = todayLeft().length;
  const day = (i) => {
    const evs = EVENTS.filter((e) => e.d === i).map((e) => {
      const past = i < NOW.d || (i === NOW.d && e.e <= NOW.h);
      return `<div class="ev ${e.by ? "by-alfred" : ""} ${past ? "past" : ""} ${e.flash ? "flash" : ""}" data-k="${AREAS[e.a].k}" ${S.hideAreas.has(e.a) ? "hidden" : ""} title="${AREAS[e.a].name}" style="top:${(e.s - 8) * 52 + 1}px;height:${(e.e - e.s) * 52 - 3}px">${esc(e.title)}<small>${fmt(e.s)} – ${fmt(e.e)}${e.by ? " · " + e.by : ""}</small></div>`;
    }).join("");
    const now = i === NOW.d ? `<div class="now" style="top:${(NOW.h - 8) * 52}px"></div>` : "";
    return `<div class="day ${i === NOW.d ? "today" : ""} ${i > 4 ? "weekend" : ""}"><div class="day-head">周${W[i]}<b>${16 + i}</b></div><div class="day-body">${evs}${now}</div></div>`;
  };
  const used = Object.keys(AREAS).filter((a) => EVENTS.some((e) => e.a === a));
  const legend = `<div class="legend">${used.map((a) => `<button class="chip ${S.hideAreas.has(a) ? "off" : ""}" data-act="cal-area" data-id="${a}" aria-pressed="${!S.hideAreas.has(a)}" title="点一下隐藏或显示"><span class="mark" data-k="${AREAS[a].k}"></span>${AREAS[a].name}</button>`).join("")}
    <span class="chip" style="box-shadow:none;outline:1.5px dashed var(--line);outline-offset:-1.5px"><span class="mark" data-k="alfred"></span>Alfred 排的</span></div>`;
  const ask = !note("n2").done
    ? `<div class="suggest"><svg class="fig" viewBox="0 0 120 120" data-mark style="width:22px;height:22px" aria-hidden="true"></svg><p>Mia 想把今天 9:30 的站会挪到 16:00。挪了以后你上午有三个小时整块。</p><button class="btn small" data-act="note" data-id="n2" data-i="0">好，挪吧</button><button class="btn ghost small" data-act="note" data-id="n2" data-i="1">不了</button></div>` : "";
  EVENTS.forEach((e) => delete e.flash);
  return `${head("cal", `11月16日 – 22日 · 今天还有 ${left} 个安排`)}${legend}${ask}
    <div class="cal-scroll" data-keep="cal"><div class="week"><div class="gutter">${Array.from({ length: 12 }, (_, k) => `<div>${k ? 8 + k + ":00" : ""}</div>`).join("")}</div>${W.map((_, i) => day(i)).join("")}</div></div>`;
}

function pTodo() {
  const used = Object.keys(AREAS).filter((a) => TODOS.some((t) => t.a === a));
  const F = [["all", "全部", ""], ...used.map((a) => [a, AREAS[a].name, AREAS[a].k]), ["alfred", "Alfred 能做", "alfred"]];
  const G = [["late", "逾期"], ["today", "今天"], ["tomorrow", "明天"], ["week", "本周"], ["later", "以后再说"]];
  const vis = (t) => S.todoFilter === "all" || (S.todoFilter === "alfred" ? t.can || t.doing : t.a === S.todoFilter);
  const row = (t) => `<li class="todo" data-k="${AREAS[t.a].k}" ${t.done ? "data-done" : ""} ${t.fresh ? "data-fresh" : ""}>
      <button class="check" data-act="todo-check" data-id="${t.id}" aria-label="完成">${ic("check")}</button>
      <div class="todo-body"><div class="todo-title">${esc(t.title)}</div>
        <div class="todo-meta">${areaTag(t.a)}${t.due ? `<span class="${t.g === "late" ? "late" : ""}">${t.g === "late" ? "逾期 · " : ""}${t.due}</span>` : ""}${t.note ? `<span>${esc(t.note)}</span>` : ""}</div></div>
      ${t.doing && !t.done ? `<span class="tag" data-k="alfred"><span class="pulse"></span>Alfred 在做</span>` : t.can && !t.done ? `<button class="btn ghost small hand" data-act="todo-hand" data-id="${t.id}">交给 Alfred</button>` : ""}
    </li>`;
  const groups = G.map(([g, l]) => {
    const items = TODOS.filter((t) => t.g === g && vis(t));
    return items.length ? `<section class="group"><h3 class="${g === "late" ? "late" : ""}">${l}<span>${items.filter((t) => !t.done).length}</span></h3><ul>${items.map(row).join("")}</ul></section>` : "";
  }).join("");
  TODOS.forEach((t) => delete t.fresh);
  const open = TODOS.filter((t) => !t.done).length, doing = TODOS.filter((t) => t.doing && !t.done).length;
  return `${head("todo", `${open} 件没做完${doing ? ` · ${doing} 件 Alfred 在做` : ""}`)}
    <div class="chips">${F.map(([k, l, c]) => `<button class="chip" data-act="todo-filter" data-id="${k}" aria-pressed="${S.todoFilter === k}">${c ? `<span class="mark" data-k="${c}"></span>` : ""}${l}</button>`).join("")}</div>
    <div class="body-scroll" data-keep="todo"><div class="todo-col">
      <form class="add" data-form="add"><input name="t" placeholder="加一件事，回车。比如：周五前把发票寄出去" autocomplete="off"></form>${groups}
    </div></div>`;
}

/* What a sign-in looks like while it waits on the browser, a code or a key. */
function flowCard(f) {
  const there = isPhone() ? "登录页已经在你的 Mac 上打开，去那边" : `已在浏览器里打开 ${f.host} 的登录页，在那边`;
  if (f.kind === "browser") return `<div class="flow"><div class="flow-h"><span class="pulse"></span><span>${there}${f.verb || "点「同意」"}，${f.after || "这里会自己变成已连接"}。</span></div>
    ${f.note ? `<p class="small">${f.note}</p>` : ""}
    <div class="actions"><button class="btn ghost small">复制链接</button><button class="btn ghost small" data-act="set-cancel">取消</button></div>
    <p class="small muted">浏览器跳不回来？把地址栏里最后的网址贴在这里：</p><div class="field"><input class="input" placeholder="http://127.0.0.1:…/callback?code=…" autocomplete="off"></div></div>`;
  if (f.kind === "device") return `<div class="flow"><span>在 ${f.host} 上输入这个码：</span><div class="code">WDJB-MJHT</div>
    <div class="actions"><button class="btn small">打开网页</button><button class="btn ghost small">复制码</button><button class="btn ghost small" data-act="set-cancel">取消</button></div>
    <div class="flow-h small muted"><span class="pulse"></span>等你在网页上确认…</div></div>`;
  if (f.kind === "key") return `<form class="flow" data-form="key" data-id="${f.id}"><span>${f.label}，只存在这台 Mac 的钥匙串里。</span>
    <div class="field"><input class="input" name="k" type="password" placeholder="${f.placeholder || "sk-…"}" autocomplete="off" required><button class="btn small">保存</button><button type="button" class="btn ghost small" data-act="set-cancel">取消</button></div></form>`;
  if (f.kind === "confirm") return `<div class="flow"><span>${f.text}</span><div class="actions"><button class="btn small" data-act="set-confirm">${f.yes}</button><button class="btn ghost small" data-act="set-cancel">取消</button></div></div>`;
  return "";
}

/* Shares the width: the sidebar and Alfred keep their dragged widths, but the page never drops below ALF.pageMin. */
function applyWidths() {
  const navPx = S.nav === "rail" ? 56 : S.navW;
  const room = innerWidth - navPx - ALF.pageMin;
  const alf = Math.max(ALF.min, Math.min(S.alfW, room));
  $("#app").style.setProperty("--nav-px", S.navW + "px");
  $("#app").style.setProperty("--alf-px", alf + "px");
  document.body.dataset.nav = S.nav;
}
function saveWidths() {
  try { localStorage.setItem("alfred.layout", JSON.stringify({ nav: S.nav, navW: S.navW, alfW: S.alfW })); } catch {}
}

function renderAll(dir) {
  document.body.dataset.alfred = S.alfred;
  applyWidths();
  renderNav();
  renderPage(dir);
  renderAlfred();
}

/* ── Effects (from the pages or from the conversation) ──────── */
function done(id, text) { const n = note(id); if (!n.done) { n.done = true; n.doneText = text; } }
function moveStandup() {
  const e = EVENTS.find((x) => x.id === "e7");
  Object.assign(e, { s: 16, e: 16.5, flash: true });
  done("n2", "站会改到了 16:00，Mia 收到了");
}
function sendStripe() {
  const m = mail("m1");
  m.replied = true; m.unread = false;
  todo("t2").done = true;
  done("n1", "草稿发出去了，待办里那件也勾掉了");
}
function hand(id) {
  todo(id).doing = true;
  if (id === "t1") done("n4", "交给 Alfred 了，做好了给你过目");
}
function addTodo(title, g = "today") {
  TODOS.push({ id: "t" + Date.now(), title, due: g === "today" ? "今天" : "", g, a: "work", fresh: true });
}

const NOTE_FX = {
  n1: [() => sendStripe(), () => { S.sel.mail = "m1"; S.open.mail = true; go("mail"); return "skip"; }, () => done("n1", "标记为不用回")],
  n2: [() => moveStandup(), () => done("n2", "告诉 Mia 保持 9:30")],
  n3: [() => { done("n3", "看过了"); S.sel.research = "r1"; S.open.research = true; go("research"); return "skip"; }],
  n4: [() => hand("t1"), () => { Object.assign(todo("t1"), { g: "today", due: "今晚 20:00" }); done("n4", "改到了今晚 20:00"); }],
  n5: [() => { done("n5", "看过了"); go("auto"); return "skip"; }],
  n6: [() => done("n6", "好"), () => done("n6", "撤销了，12 封回到收件箱")],

};

/* ── Conversation (canned: there is no real agent here) ──────── */
function respond(text) {
  const R = (html, receipts) => ({ html, receipts });
  if (/站会|四点|16/.test(text)) {
    if (!note("n2").done) moveStandup();
    return R("<p>改好了。Mia 那边我回了一句，她下午四点可以。</p>", ["周三站会 9:30 → 16:00", "回复了 Mia"]);
  }
  if (/Google/i.test(text)) return R("<p>连上以后我能看你的日程、算哪里有空，帮你理收件箱。改日程、发邮件之前都会先问你。权限是一项一项给的，在设置里随时能收回。</p>");
  if (/数据|离开/.test(text)) return R("<p>三类：发给模型厂商的任务上下文，发给语音厂商的声音，还有我替你访问的服务，比如 Google。你的资料和登录凭证都留在这台 Mac 上。</p>");
  if (/最空|哪天/.test(text)) return R("<p>周四 4 点以后和周五整个下午都是空的。要放一块专注时间进去吗？</p>");
  if (/报销/.test(text)) { hand("t1"); return R("<p>好，我去邮箱里找发票，填好报销单放进通知给你过目。</p>", ["「整理报销」交给了 Alfred"]); }
  if (/先做哪/.test(text)) return R("<p>先回 Stripe，5 分钟，草稿已经有了。然后 2 点开始写布局方案。给妈妈的电话留到晚饭后。</p>");
  if (/都处理|能处理/.test(text)) {
    const xs = NOTES.filter((n) => n.kind !== "decide" && !n.done);
    xs.forEach((n) => done(n.id, "Alfred 一并处理了"));
    return R(`<p>不需要你的 ${xs.length} 条我收掉了。剩下 ${pending()} 件要你点头的，我不替你决定。</p>`, xs.map((n) => n.title));
  }
  if (/Stripe/.test(text)) return R(`<p>Stripe 问续约要不要改年付，年付便宜 15%。我的草稿是同意年付，但发票抬头换成新公司。</p><p><button class="link" data-act="mail-open" data-id="m1">去邮件页看草稿</button></p>`);
  if (/客气|语气/.test(text)) {
    Object.assign(mail("m1"), { draft: DRAFTS[1], v: 2 });
    return R("<p>改好了，语气软一些。</p>", ["Stripe 回复草稿 · 第 2 版"]);
  }
  if (/需要我回/.test(text)) return R(`<p>需要你回的只有两封：<button class="link" data-act="mail-open" data-id="m1">Stripe 续约</button>，和 <button class="link" data-act="mail-open" data-id="m5">Leo 的 1:1 议程</button>。</p>`);
  if (/30 秒|短/.test(text)) return R("<p>一句话：先用 whisper.cpp 跑 small 模型，离线、约 300ms 出字、不花钱。系统听写更快但中文差一截；云端最准，但要联网、要付费。</p>");
  if (/待办/.test(text)) { addTodo("在 home 节点接 whisper.cpp small 模型"); return R("<p>加好了，放在今天。</p>", ["待办 · 在 home 节点接 whisper.cpp small 模型"]); }
  if (/英伟达|早报/.test(text)) return R("<p>好，从明早开始，早报多一节英伟达：股价、新闻和产品发布。</p>", ["早报 · 加了一节「英伟达」"]);
  if (/86|账单/.test(text)) return R("<p>多出来的 ¥86 主要是云服务器：上周你开了一台临时机器跑测试，一直没关。要我关掉吗？</p>");
  return R(`<p>收到，我按「${pageName(S.page)}」这页的内容来做。</p><p class="muted">原型里这里还没接真正的 agent。</p>`);
}

function send(text) {
  text = text.trim();
  if (!text || S.busy) return;
  if (S.alfred === "closed") S.alfred = "open";
  if (conv().fresh) { conv().title = text.length > 14 ? text.slice(0, 14) + "…" : text; delete conv().fresh; }
  S.thread.push({ who: "me", text, ctx: pageName(S.page) });
  const reply = { who: "al", working: "在想…" };
  S.thread.push(reply);
  S.busy = true;
  renderAll();
  renderThread();
  setTimeout(() => {
    const r = respond(text);
    delete reply.working;
    Object.assign(reply, r);
    S.busy = false;
    S.speaking = true;
    renderAll();
    renderThread();
    setTimeout(() => { S.speaking = false; syncFig(); }, 1800);
  }, 900);
}

/* ── Actions ────────────────────────────────────────────────── */
const isPhone = () => phoneMQ.matches;
function go(id) {
  if (!PAGES.some((p) => p.id === id)) return;
  const from = pageIdx(S.page), to = pageIdx(id);
  if (isPhone()) S.alfred = "closed";
  else if (S.alfred === "wide") S.alfred = "open";
  delete $("#more").dataset.open;
  if (id !== S.page) S.open[id] = S.open[id] && (id === "mail" || id === "research") ? S.open[id] : false;
  const changed = id !== S.page;
  S.page = id;
  renderAll(changed ? (to > from ? "r" : "l") : undefined);
  history.replaceState(null, "", `?page=${id}`);
}
function toggleNav() { S.nav = S.nav === "rail" ? "full" : "rail"; saveWidths(); renderAll(); }
function setAlfred(mode) { S.alfred = mode; renderAll(); if (mode !== "closed") { renderThread(); if (!isPhone()) $("#input").focus(); } }

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const { act, id } = el.dataset;
  if ((act === "pal-close" || act === "more-close") && e.target !== el) return;
  switch (act) {
    case "go": go(id); break;
    case "sel":
      S.sel[el.dataset.page] = id; S.open[el.dataset.page] = true;
      if (el.dataset.page === "mail") mail(id).unread = false;
      renderAll(); break;
    case "back": S.open[el.dataset.page] = false; renderAll(); break;
    case "note": { const r = NOTE_FX[id][+el.dataset.i](); if (r !== "skip") renderAll(); break; }
    case "inbox-filter": S.inboxFilter = id; renderAll(); break;
    case "todo-filter": S.todoFilter = id; renderAll(); break;
    case "todo-check": { const t = todo(id); t.done = !t.done; if (t.done) t.doing = false; renderAll(); break; }
    case "todo-hand": hand(id); renderAll(); break;
    case "mail-send": sendStripe(); renderAll(); break;
    case "mail-open": S.sel.mail = id; S.open.mail = true; mail(id).unread = false; if (isPhone()) S.alfred = "closed"; go("mail"); break;
    case "auto-toggle": { const a = AUTOS.find((x) => x.id === id); a.on = !a.on; renderAll(); break; }
    case "ask": send(el.dataset.text); break;
    case "alf-open": setAlfred("open"); break;
    case "alf-close": setAlfred("closed"); break;
    case "alf-toggle": setAlfred(S.alfred === "closed" ? "open" : "closed"); break;
    case "alf-wide": setAlfred(S.alfred === "wide" ? "open" : "wide"); break;
    case "nav-toggle": toggleNav(); break;
    case "conv": S.conv = id; delete $("#more").dataset.open; if (S.alfred === "closed") S.alfred = "open"; setAlfred(S.alfred); break;
    case "conv-new": {
      const c = { id: "c" + Date.now(), title: "新对话", t: "现在", fresh: true, thread: [{ who: "al", html: `<p>想聊什么？我在看「${pageName(S.page)}」这页，可以从这里说起。</p>` }] };
      CONVS.unshift(c); S.conv = c.id; if (S.alfred === "closed") S.alfred = "open"; setAlfred(S.alfred); break;
    }
    case "cal-area": S.hideAreas.has(id) ? S.hideAreas.delete(id) : S.hideAreas.add(id); renderAll(); break;
    case "theme": T.theme = id; saveTheme(); applyTheme(); break;
    case "scheme": T.scheme = id; saveTheme(); applyTheme(); break;
    case "palette": openPalette(); break;
    case "pal-close": closePalette(); break;
    case "set-import":
      Object.assign(PROVIDERS.find((p) => p.id === "claude"), { on: true, src: "从 Pi 导入" });
      Object.assign(PROVIDERS.find((p) => p.id === "openai"), { on: true, src: "从 Pi 导入" });
      SET.pi = "done"; ensureModels(); renderAll(); break;
    case "set-noimport": SET.pi = "no"; renderAll(); break;
    case "set-login": {
      const p = PROVIDERS.find((x) => x.id === id);
      const finish = () => { Object.assign(p, { on: true, src: "钥匙串" }); ensureModels(); };
      if (p.how === "key") startFlow({ id, kind: "key", label: `粘贴 ${p.name} 的 API key` });
      else startFlow({ id, kind: p.how, host: p.host }, p.how === "device" ? 3200 : 2200, finish);
      break;
    }
    case "set-logout": { const p = PROVIDERS.find((x) => x.id === id); p.on = false; delete p.src; ensureModels(); renderAll(); break; }
    case "set-cancel": cancelFlow(); break;
    case "set-confirm": { const f = SET.flow; SET.flow = null; f.run(); renderAll(); break; }
    case "set-toggle": {
      if (id.startsWith("g:")) {
        const [, i, cap] = id.split(":");
        const a = SET.google[+i];
        if (a.caps[cap]) { a.caps[cap] = false; renderAll(); break; }
        // A capability not granted yet asks Google for one more scope (incremental authorization).
        const c = G_CAPS.find((x) => x.id === cap);
        startFlow({ id: `g-cap:${i}:${cap}`, kind: "browser", host: "accounts.google.com", after: "这一项会自己打开", note: `要多一项权限：<span class="scope">${c.scope}</span>` }, 2000, () => { a.caps[cap] = true; });
        break;
      }
      SET[id] = !SET[id]; renderAll(); break;
    }
    case "g-pick": SET.gPick[id] = !SET.gPick[id]; renderAll(); break;
    case "g-connect": {
      const pick = { ...SET.gPick };
      startFlow({ id: "google-new", kind: "browser", host: "accounts.google.com", verb: "选账号、点「允许」" }, 2400, () => {
        const email = SET.google.length ? `work${SET.google.length}@example.com` : "you@gmail.com";
        SET.google.push({ email, caps: { calRead: pick.cal, calWrite: false, mailRead: pick.mail, mailSend: false } });
      });
      break;
    }
    case "g-disconnect": startFlow({ id: `g-off:${id}`, kind: "confirm", text: `断开 ${esc(SET.google[+id].email)}：先在 Google 那边撤销 Alfred 的授权，再删掉这台 Mac 上的凭证。日历和邮件里的东西不会动。`, yes: "断开", run: () => SET.google.splice(+id, 1) }); break;
    case "mcp-connect": {
      const m = MCPS.find((x) => x.id === id);
      if (m.how === "token") startFlow({ id: `mcp:${id}`, kind: "key", label: "粘贴 BotFather 给的 bot token", placeholder: "123456:ABC-…" });
      else startFlow({ id: `mcp:${id}`, kind: "browser", host: m.host }, 2000, () => { m.on = true; m.need = false; m.tools ||= 7; m.ro ??= 3; });
      break;
    }
    case "mcp-off": { const m = MCPS.find((x) => x.id === id); m.on = false; renderAll(); break; }
    case "voice-key": startFlow({ id: "voice", kind: "key", label: "粘贴 Boson 的 API key" }); break;
    case "dev-revoke": DEVICES.splice(DEVICES.findIndex((d) => d.id === id), 1); renderAll(); break;
    case "more": $("#more").dataset.open = ""; break;
    case "more-close": delete $("#more").dataset.open; break;
  }
});

document.addEventListener("change", (e) => {
  const key = e.target.dataset?.set;
  if (!key) return;
  if (key in SET) SET[key] = e.target.value;
  renderAll();
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "composer") { const v = $("#input").value; $("#input").value = ""; grow(); send(v); return; }
  if (e.target.dataset.form === "key") {
    // The key goes to the home node's keychain store; the prototype only notes that one is set.
    const id = e.target.dataset.id;
    const p = PROVIDERS.find((x) => x.id === id);
    if (p) { Object.assign(p, { on: true, src: "钥匙串" }); ensureModels(); }
    else if (id === "voice") SET.voiceKey = true;
    else if (id.startsWith("mcp:")) Object.assign(MCPS.find((m) => `mcp:${m.id}` === id), { on: true, tools: 0 });
    SET.flow = null; renderAll(); return;
  }
  if (e.target.dataset.form === "mcp-add") {
    const u = e.target.u.value.trim();
    const remote = /^https?:\/\//.test(u);
    const name = remote ? new URL(u).hostname.replace(/^mcp\./, "") : u.split(/\s+/).pop();
    MCPS.push({ id: "x" + Date.now(), name: esc(name), d: esc(u), how: remote ? "oauth" : "local", host: remote ? new URL(u).hostname : "", logo: name[0].toUpperCase(), k: "gray", need: remote, on: !remote, tools: remote ? 0 : 5, ro: remote ? 0 : 2 });
    renderAll(); return;
  }
  if (e.target.dataset.form === "add") {
    const v = e.target.t.value.trim();
    if (v) { addTodo(v); renderAll(); $("[data-form=add] input")?.focus(); }
  }
});

const input = $("#input");
const grow = () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; };
input.addEventListener("input", grow);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); $("#composer").requestSubmit(); }
});
$("#mic").innerHTML = ic("mic");
$("#send").innerHTML = ic("send");
$("#mic").addEventListener("click", () => {
  // A stand-in for voice: Alfred "listens", then the words appear.
  S.listening = true; syncFig();
  input.placeholder = "在听…";
  setTimeout(() => { S.listening = false; syncFig(); input.placeholder = "跟 Alfred 说…"; input.value = CHIPS[S.page][0]; grow(); input.focus(); }, 1300);
});

/* ⌘K */
let palSel = 0, palItems = [];
function renderPal() {
  const qv = $("#pal-input").value.trim();
  palItems = PAGES.filter((p) => !qv || p.name.includes(qv)).map((p) => ({ label: `去「${p.name}」`, icon: p.icon, kbd: p.id === "settings" ? "⌘," : `⌥${pageIdx(p.id) + 1}`, run: () => go(p.id) }));
  const asks = qv ? [qv] : CHIPS[S.page];
  palItems.push(...asks.map((a) => ({ label: `问 Alfred：${a}`, icon: "spark", kbd: qv ? "↵" : "", run: () => send(a) })));
  if (qv) palItems.unshift(palItems.pop());
  palSel = Math.min(palSel, palItems.length - 1);
  $("#pal-list").innerHTML = palItems.map((it, i) => `<li><button role="option" aria-selected="${i === palSel}" data-i="${i}">${ic(it.icon)}${esc(it.label)}<kbd>${it.kbd}</kbd></button></li>`).join("");
}
function openPalette() { $("#palette").dataset.open = ""; $("#pal-input").value = ""; palSel = 0; renderPal(); $("#pal-input").focus(); }
function closePalette() { delete $("#palette").dataset.open; }
$("#pal-input").addEventListener("input", () => { palSel = 0; renderPal(); });
$("#pal-input").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { palSel = (palSel + 1) % palItems.length; renderPal(); e.preventDefault(); }
  if (e.key === "ArrowUp") { palSel = (palSel - 1 + palItems.length) % palItems.length; renderPal(); e.preventDefault(); }
  if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); const it = palItems[palSel]; closePalette(); it?.run(); }
});
$("#pal-list").addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (b) { const it = palItems[+b.dataset.i]; closePalette(); it.run(); } });

document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
  if ((mod || e.altKey) && /^Digit[1-6]$/.test(e.code)) { e.preventDefault(); go(PAGES[+e.code.slice(5) - 1].id); return; }
  if (mod && e.key === ",") { e.preventDefault(); go("settings"); return; }
  if (mod && e.key === ".") { e.preventDefault(); setAlfred(S.alfred === "closed" ? "open" : "closed"); return; }
  if (mod && (e.key === "\\" || e.code === "Backslash")) { e.preventDefault(); toggleNav(); return; }
  if (e.key === "Escape") {
    if ($("#palette").dataset.open !== undefined) closePalette();
    else if ($("#more").dataset.open !== undefined) delete $("#more").dataset.open;
    else if (S.alfred === "wide") setAlfred("open");
    else if (isPhone() && S.alfred === "open") setAlfred("closed");
  }
});
phoneMQ.addEventListener("change", () => { S.alfred = isPhone() ? "closed" : "open"; renderAll(); renderThread(); });
addEventListener("resize", applyWidths);

/* Dragging the dividers. The sidebar folds into the rail when dragged in past NAV.foldAt. */
document.querySelectorAll(".resizer").forEach((rz) => {
  rz.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    rz.setPointerCapture(e.pointerId);
    rz.classList.add("active");
    document.body.classList.add("resizing");
    const startW = S.nav === "full" ? S.navW : NAV.def;
    const move = (ev) => {
      if (rz.dataset.resize === "nav") {
        const x = Math.round(ev.clientX);
        const nav = x < NAV.foldAt ? "rail" : "full";
        // Folding keeps the width you had, so unfolding brings it back.
        S.navW = nav === "full" ? Math.max(NAV.min, Math.min(NAV.max, x)) : startW;
        if (nav !== S.nav) { S.nav = nav; renderNav(); placeFigs(); }
      } else {
        const navPx = S.nav === "rail" ? 56 : S.navW;
        S.alfW = Math.round(Math.max(ALF.min, Math.min(innerWidth - navPx - ALF.pageMin, innerWidth - ev.clientX)));
      }
      applyWidths();
    };
    const up = () => {
      rz.removeEventListener("pointermove", move);
      rz.classList.remove("active");
      document.body.classList.remove("resizing");
      saveWidths();
    };
    rz.addEventListener("pointermove", move);
    rz.addEventListener("pointerup", up, { once: true });
    rz.addEventListener("pointercancel", up, { once: true });
  });
  rz.addEventListener("dblclick", () => {
    if (rz.dataset.resize === "nav") toggleNav();
    else { S.alfW = ALF.def; applyWidths(); saveWidths(); }
  });
});

/* The morning brief opens the thread: it is the day's summary, in place of a grid of cards. */
S.thread.push({ who: "al", stamp: "早报 · 07:30", html: `<p>早上好，Bruce。今天的事不多：</p>
  <ul class="brief">
    <li><span><button class="link" data-act="go" data-id="inbox">3 件事等你点头</button>，最急的是 Stripe 续约。</span></li>
    <li><span><button class="link" data-act="go" data-id="cal">今天 3 个安排</button>；Mia 想把站会挪到下午，下午 2–4 点我先替你占住写方案。</span></li>
    <li><span><button class="link" data-act="go" data-id="todo">2 件逾期</button>，报销那件我能直接做。</span></li>
    <li><span><button class="link" data-act="go" data-id="research">语音转写的调研</button>写完了，结论很短。</span></li>
  </ul>
  <p class="muted">别的我都处理好了。有需要再叫你。</p>` });

S.greeting = true;
renderAll();
renderThread();
setTimeout(() => { S.greeting = false; syncFig(); }, 2600);
</script>
