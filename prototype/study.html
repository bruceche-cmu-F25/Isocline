<!doctype html>
<!--
  Alfred: Study, the third mode beside everyday and development. A prototype for docs/design/study-mode.md:
  no build step, sample topics, and scripts in place of the folder on disk and the model.
  The question it asks: can one fixed desk carry learning a subject, research, grasping one thing, and preparing?
    New      one sentence; Alfred drafts the goal, the map and the first materials without asking first. Guesses are
             dashed and change on a click; the recipe chip changes the draft's shape, not the page. Say a change in
             the panel on the right and the draft changes in place. "Start" makes the topic.
    Today    where a topic opens: what Alfred says about last time, one button to go on, what is due, this week.
    Overview the goal on top, the whole map under it. A part's state comes from practice records, never from
             having opened something; "marked by you" is drawn differently.
    Part     one part of the map: its materials, its practice, its notes.
    Read     one text on the desk. Select a word or a sentence: explain, example, quiz me, keep. The answer is a
             small card beside the selection; "keep" goes to the part's notes, "quiz me" becomes a card that
             comes due, "ask more" carries it into the conversation on the right.
    Practice one at a time: a card you grade yourself, a problem with a ladder of hints, a retelling Alfred reads.
  Alfred on the right has three stances that follow the desk (explain / hint / plan), each its own conversation.
  ?scene=new|today|overview|part|read|practice  ?lang=en  ?scheme=dark  ?bare hides the strip.
  Under 760px wide it is the phone layout: the map in a drawer, Alfred in a sheet, two bubbles at the bottom.
-->
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfred：学习</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<style>
:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
  --serif: Georgia, "Songti SC", serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.23, 1, .32, 1);
  --side-w: 240px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
h1, h2, h3, h4, p, ul, ol, dl, dd, dt, blockquote { margin: 0; padding: 0; }
ul, ol { list-style: none; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--alf); outline-offset: 2px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.cut { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }

/* ── The prototype's own strip ── */
.proto { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px 10px; background: var(--ink); color: var(--bg); font-size: 12px; overflow-x: auto; white-space: nowrap; }
.proto b { flex: none; padding: 0 6px; }
.proto .lab { flex: none; padding: 0 4px 0 10px; opacity: .6; }
.proto button { flex: none; height: 26px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 8px; opacity: .72; }
.proto button:hover { opacity: 1; }
.proto button[aria-pressed="true"] { background: var(--bg); color: var(--ink); opacity: 1; }
html[data-bare] .proto { display: none; }
@media (max-width: 620px) { .proto .lab, .proto b { display: none; } }

/* ── Shell: top bar over sidebar | desk | Alfred ── */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr) auto; grid-template-rows: 52px minmax(0, 1fr); }
body[data-side="off"] .app { grid-template-columns: 0 minmax(0, 1fr) auto; }
body[data-side="off"] .side { display: none; }
.top { grid-column: 1 / -1; display: flex; align-items: stretch; border-bottom: 1px solid var(--line-soft); min-width: 0; }
.lead { flex: none; width: var(--side-w); display: flex; align-items: center; gap: 6px; padding: 0 10px 0 14px; border-right: 1px solid var(--line-soft); background: var(--paper); }
.lights { display: flex; gap: 8px; margin-right: 6px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.modes { margin-left: auto; display: inline-flex; padding: 2px; border-radius: 9px; background: var(--wash); }
.modes button { width: 30px; height: 26px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); }
.modes button svg.i { width: 16px; height: 16px; }
.modes button[aria-pressed="true"] { background: var(--raise); color: var(--ink); box-shadow: 0 1px 2px #0002; }
.titlebar { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 20px; }
.titlebar > svg.i { color: var(--k-solid); }
.titlebar h1 { flex: none; max-width: 50%; font-size: 1.0625rem; font-weight: 650; }
.titlebar .sum { color: var(--muted); font-size: .8125rem; }
.ib { flex: none; width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 8px; color: var(--muted); }
.ib:hover { background: var(--wash); color: var(--ink); }
.ib[aria-pressed="true"] { color: var(--ink); }

.side { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; padding: 10px 8px 12px; background: var(--paper); border-right: 1px solid var(--line-soft); position: relative; }
.pick { width: 100%; min-height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 9px; margin-bottom: 6px; border-radius: 10px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); font-weight: 600; }
.pick svg.i { width: 14px; height: 14px; color: var(--muted); }
.pick .ic { color: var(--k-solid); width: 17px; height: 17px; }
.nav { width: 100%; min-height: 30px; display: flex; align-items: center; gap: 9px; padding: 3px 9px; border-radius: 8px; color: var(--copy); font-size: .84375rem; }
.nav:hover { background: var(--wash); }
.nav[aria-current="true"] { background: var(--wash); color: var(--ink); font-weight: 550; }
.nav svg.i { width: 17px; height: 17px; }
.nav .end { margin-left: auto; flex: none; color: var(--muted); font: .75rem var(--mono); }
.nav .end.due { color: var(--k-text); font-family: var(--sans); font-weight: 600; }
.nav[data-fresh] { background: var(--alf-soft); }
.label { padding: 12px 9px 4px; color: var(--muted); font-size: .75rem; }
.stage { padding: 8px 9px 2px; color: var(--muted); font-size: .6875rem; letter-spacing: .02em; }
.side .sp { flex: 1; min-height: 12px; }
.menu { position: absolute; z-index: 40; min-width: 210px; padding: 6px; border-radius: 12px; background: var(--raise); box-shadow: var(--shadow), inset 0 0 0 1px var(--line-soft); }
.menu button { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--copy); font-size: .8125rem; font-weight: 400; }
.menu button:hover { background: var(--wash); color: var(--ink); }
.menu button small { display: block; color: var(--muted); font-size: .75rem; line-height: 1.4; }
.menu .ck { flex: none; width: 16px; color: var(--alf); }
.menu .ck svg.i { width: 15px; height: 15px; }
.menu hr { border: 0; height: 1px; margin: 4px 6px; background: var(--line-soft); }

/* A part's state: drawn four ways, so it never rests on colour alone. */
.g { flex: none; width: 14px; height: 14px; }
.g circle, .g path { vector-effect: non-scaling-stroke; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--muted); white-space: nowrap; }
.st[data-s="due"] { color: var(--k-text); font-weight: 600; }
.st[data-s="known"] { color: var(--copy); }

/* ── The desk ── */
.page { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; container: page / inline-size; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 0 120px; }
.col { max-width: 760px; margin: 0 auto; padding: 0 28px; }
.col.wide { max-width: 860px; }
.col.read { max-width: 680px; }
.phone-head { display: none; }

.btn { min-height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); color: var(--copy); font-size: .8125rem; white-space: nowrap; }
.btn:hover { color: var(--ink); }
.btn.solid { background: var(--alf-solid); color: var(--on-alf); box-shadow: none; font-weight: 550; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg.i { width: 15px; height: 15px; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 6px; background: var(--k-fill, var(--wash)); color: var(--k-text, var(--copy)); font-size: .75rem; font-weight: 500; white-space: nowrap; }
.sec { padding-top: 26px; }
.sec > h3 { display: flex; align-items: baseline; gap: 8px; padding-bottom: 6px; font-size: .8125rem; font-weight: 600; color: var(--muted); }
.sec > h3 span { font-weight: 400; font-size: .75rem; }
.row { position: relative; width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; padding: 10px 10px; margin: 0 -10px; width: calc(100% + 20px); border-radius: 12px; }
.row + .row::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 1px; background: var(--line-soft); }
button.row:hover { background: var(--wash); }
button.row:hover::before, button.row:hover + .row::before, .row[data-fresh]::before, .row[data-fresh] + .row::before { display: none; }
.row[data-fresh] { background: var(--alf-soft); }
.row .rt { font-weight: 550; overflow-wrap: anywhere; }
.row .rs { grid-column: 2; color: var(--muted); font-size: .8125rem; overflow-wrap: anywhere; }
.row .re { grid-column: 3; grid-row: 1 / span 2; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .75rem; white-space: nowrap; }
.row > svg.i { color: var(--muted); }
.empty { padding: 10px 0; color: var(--muted); font-size: .875rem; }

/* Today */
.say { padding: 44px 0 22px; font-size: 1.375rem; line-height: 1.4; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
.say small { display: block; margin-bottom: 8px; color: var(--muted); font-size: .8125rem; font-weight: 400; letter-spacing: 0; }
.next { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 16px; border-radius: 14px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); }
.next + .next { margin-top: 10px; }
.next .w { flex: 1 1 200px; min-width: 0; }
.next .w b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.next .w span { color: var(--muted); font-size: .8125rem; }
.next .n { flex: none; min-width: 30px; height: 30px; display: grid; place-items: center; padding: 0 8px; border-radius: 10px; background: var(--k-fill); color: var(--k-text); font: 600 .9375rem var(--mono); }
.week { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 22px; color: var(--muted); font-size: .8125rem; }
.dots { display: inline-flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); }
.dots i.on { background: var(--copy); box-shadow: none; }
.prop { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 14px; border: 1px dashed color-mix(in oklch, var(--alf) 55%, var(--line)); background: var(--alf-soft); }
.prop h4 { font-size: .8125rem; font-weight: 600; color: var(--alf); }
.prop p { color: var(--copy); overflow-wrap: anywhere; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* Overview */
.head { padding: 30px 0 4px; }
.head h2 { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
.head p { margin-top: 6px; color: var(--copy); overflow-wrap: anywhere; }
.crumb { display: inline-flex; align-items: center; gap: 2px; height: 30px; padding: 0 10px 0 4px; margin: 14px 0 -18px -4px; border-radius: 999px; color: var(--copy); font-size: .875rem; }
.crumb:hover { background: var(--wash); color: var(--ink); }
.goal { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 8px 16px; padding: 16px 18px; border-radius: 14px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); }
.goal dt { color: var(--muted); font-size: .8125rem; padding-top: 1px; }
.goal dd { min-width: 0; overflow-wrap: anywhere; }
.guess { display: inline; padding: 1px 7px; border-radius: 7px; border: 1px dashed color-mix(in oklch, var(--alf) 60%, var(--line)); background: var(--alf-soft); color: var(--ink); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
button.guess:hover { border-style: solid; }
.stagename { padding: 18px 0 2px; color: var(--muted); font-size: .75rem; font-weight: 600; }

/* Read */
.rbar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 0 10px; background: var(--bg); }
.rbar .crumb { margin: 0 0 0 -4px; }
.rbar .hint { color: var(--muted); font-size: .75rem; }
.reader { padding: 6px 0 20px; font-size: 1.0625rem; line-height: 1.85; color: var(--copy); }
.reader h2 { margin-bottom: 6px; color: var(--ink); font-size: 1.75rem; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; }
.reader .askq { margin: 0 0 20px; color: var(--ink); font-family: var(--serif); font-size: 1.1875rem; line-height: 1.6; }
.reader p + p { margin-top: 1.1em; }
.reader ::selection { background: color-mix(in oklch, var(--alf) 24%, transparent); }
.srcs { margin-top: 26px; padding-top: 14px; box-shadow: 0 -1px 0 var(--line-soft); color: var(--muted); font-size: .8125rem; line-height: 1.7; }

/* The card beside a selection */
#float { position: fixed; z-index: 60; }
.selbar { display: flex; gap: 2px; padding: 4px; border-radius: 12px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow); }
.selbar button { height: 30px; padding: 0 11px; border-radius: 8px; font-size: .8125rem; white-space: nowrap; }
.selbar button:hover { background: color-mix(in oklch, var(--bg) 18%, transparent); }
.ans { width: min(360px, calc(100vw - 24px)); display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 16px; background: var(--raise); box-shadow: var(--shadow), inset 0 0 0 1px var(--line-soft); }
.ans q { display: block; quotes: none; padding-left: 10px; border-left: 2px solid var(--alf); color: var(--muted); font-size: .8125rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ans p { min-height: 3.2em; color: var(--ink); font-size: .9375rem; line-height: 1.65; }
.ans .acts .btn { min-height: 28px; padding: 0 11px; font-size: .75rem; }

/* Practice */
.pcount { padding: 30px 0 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; color: var(--muted); font-size: .8125rem; }
.pbar { flex: 1 1 120px; height: 4px; border-radius: 2px; background: var(--wash); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--copy); transition: width 300ms var(--ease); }
.card { display: flex; flex-direction: column; gap: 16px; padding: 22px 22px 20px; border-radius: 18px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); }
.card .q { font-size: 1.25rem; line-height: 1.5; font-weight: 600; overflow-wrap: anywhere; }
.card .a { padding: 12px 14px; border-radius: 12px; background: var(--wash); color: var(--ink); overflow-wrap: anywhere; }
.card .hintline { padding: 9px 12px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line-soft); color: var(--copy); font-size: .875rem; overflow-wrap: anywhere; }
.card .hintline b { color: var(--muted); font-weight: 500; margin-right: 8px; }
.card textarea { width: 100%; min-height: 96px; padding: 10px 12px; border: 0; border-radius: 12px; resize: vertical; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); outline: none; line-height: 1.6; }
.card textarea:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }
.fb { padding: 12px 14px; border-radius: 12px; background: var(--alf-soft); color: var(--copy); font-size: .9375rem; overflow-wrap: anywhere; }
.fb b { display: block; margin-bottom: 2px; color: var(--alf); font-size: .75rem; font-weight: 600; }
.grades { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grade { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 9px 6px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); text-align: center; }
.grade:hover { background: var(--wash); }
.grade b { font-weight: 600; }
.grade small { color: var(--muted); font-size: .75rem; }
.grade[data-sug] { box-shadow: inset 0 0 0 1.5px var(--alf); }
.linkish { color: var(--alf); font-size: .8125rem; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--alf) 35%, transparent); text-underline-offset: 3px; }

/* New topic */
.newp { padding: 9vh 0 0; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.newp .fig { width: 64px; height: 64px; }
.newp h2 { font-family: var(--serif); font-size: 1.625rem; font-weight: 500; line-height: 1.3; }
.newp > p { color: var(--muted); font-size: .875rem; }
.compose { width: 100%; margin-top: 10px; display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 14px; border-radius: 16px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); text-align: left; }
.compose:focus-within { box-shadow: inset 0 0 0 1.5px var(--ink); }
.compose textarea { flex: 1; min-width: 0; min-height: 28px; max-height: 30vh; padding: 5px 0; border: 0; resize: none; background: none; outline: none; line-height: 1.5; }
.compose textarea::placeholder { color: var(--muted); }
.send { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--bg); }
.send svg.i { width: 16px; height: 16px; }
.send:disabled { opacity: .35; cursor: default; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.chip { min-height: 28px; display: inline-flex; align-items: center; padding: 3px 11px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); color: var(--copy); font-size: .8125rem; text-align: left; }
.chip:hover { color: var(--ink); background: var(--wash); }
.quote { margin: 30px 0 16px; padding: 4px 0 4px 14px; border-left: 2px solid var(--line); color: var(--copy); overflow-wrap: anywhere; }
.working { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .875rem; }
.working .fig { width: 24px; height: 24px; }
.draft { display: flex; flex-direction: column; gap: 4px; padding: 18px 20px 18px; border-radius: 18px; border: 1px dashed color-mix(in oklch, var(--alf) 55%, var(--line)); background: var(--raise); }
.draft-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; position: relative; }
.draft-h h3 { font-size: 1.25rem; font-weight: 650; overflow-wrap: anywhere; }
.rpick { height: 26px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px 0 10px; border-radius: 999px; background: var(--k-fill); color: var(--k-text); font-size: .75rem; font-weight: 500; white-space: nowrap; }
.rpick svg.i { width: 13px; height: 13px; }
.draft .goal { box-shadow: none; background: none; padding: 12px 0 0; }
.draft .path { margin-top: 10px; color: var(--muted); font: .75rem/1.6 var(--mono); overflow-wrap: anywhere; }
.drow { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.drow + .drow { box-shadow: 0 -1px 0 var(--line-soft); }
.drow .x { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.drow .x:hover { background: var(--wash); color: var(--ink); }
.drow .x svg.i { width: 14px; height: 14px; }
.drow > svg.i { color: var(--muted); width: 16px; height: 16px; }
.drow small { color: var(--muted); font-size: .75rem; white-space: nowrap; }
.draft .acts { margin-top: 16px; }

/* ── Alfred on the right ── */
.alf { width: 372px; min-height: 0; display: flex; flex-direction: column; background: var(--raise); border-left: 1px solid var(--line-soft); }
.alf-h { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 10px 10px 18px; }
.alf-h .fig { width: 30px; height: 30px; flex: none; }
.alf-h b { font-weight: 600; }
.stance { height: 22px; display: inline-flex; align-items: center; padding: 0 9px; border-radius: 999px; background: var(--alf-soft); color: var(--alf); font-size: .75rem; font-weight: 550; white-space: nowrap; }
.sees { flex: none; padding: 0 18px 10px; color: var(--muted); font-size: .75rem; border-bottom: 1px solid var(--line-soft); }
.thread { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 16px 18px; }
.msg { max-width: 100%; overflow-wrap: anywhere; font-size: .9375rem; line-height: 1.65; }
.msg.me { align-self: flex-end; max-width: 88%; padding: 7px 12px; border-radius: 16px 16px 4px 16px; background: var(--wash); }
.msg .from { display: block; margin-bottom: 4px; color: var(--muted); font-size: .6875rem; }
.msg .sel { display: block; margin-bottom: 6px; padding-left: 9px; border-left: 2px solid var(--alf); color: var(--muted); font-size: .8125rem; }
.tries { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 8px; }
.alf .compose { flex: none; width: auto; margin: 0 14px 14px; background: var(--bg); }

/* Toast and phone parts */
#toast { position: fixed; left: 50%; bottom: 26px; z-index: 70; transform: translateX(-50%); max-width: calc(100vw - 24px); }
.toast { display: flex; align-items: center; gap: 14px; padding: 9px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: .8125rem; box-shadow: var(--shadow); }
.toast button { flex: none; text-decoration: underline; text-underline-offset: 3px; }
.scrim, .bubbles { display: none; }

/* By the width of the desk, not of the window */
@container page (max-width: 520px) {
  .col { padding: 0 16px; }
  .say { padding-top: 28px; font-size: 1.1875rem; }
  .goal { grid-template-columns: minmax(0, 1fr); gap: 0 0; }
  .goal dt { padding-top: 10px; }
  .goal dt:first-child { padding-top: 0; }
  .row { grid-template-columns: auto minmax(0, 1fr); }
  .row .re { grid-column: 2; grid-row: auto; flex-wrap: wrap; white-space: normal; gap: 4px 10px; }
  .reader { font-size: 1rem; }
  .reader h2 { font-size: 1.4375rem; }
  .card { padding: 18px 16px; }
  .card .q { font-size: 1.0625rem; }
  .newp h2 { font-size: 1.3125rem; }
  .draft { padding: 16px 14px; }
}
@container page (max-width: 380px) {
  .grades { grid-template-columns: minmax(0, 1fr); }
  .grade { flex-direction: row; justify-content: space-between; padding: 9px 14px; }
}

@media (max-width: 1040px) { .alf { width: 320px; } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .top { display: none; }
  .phone-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 0; padding-top: calc(14px + env(safe-area-inset-top)); }
  .phone-head svg.i { color: var(--k-solid); }
  .phone-head b { font-size: 1.0625rem; font-weight: 650; }
  .phone-head span { color: var(--muted); font-size: .8125rem; }
  .side, body[data-side="off"] .side { display: flex; position: fixed; inset: 0 22% 0 0; z-index: 50; transform: translateX(-102%); transition: transform 250ms var(--ease); padding-top: calc(14px + env(safe-area-inset-top)); }
  body[data-sheet="side"] .side { transform: none; }
  .alf { position: fixed; inset: 0; z-index: 50; width: auto; border: 0; transform: translateY(102%); transition: transform 250ms var(--ease); }
  .alf[hidden] { display: flex !important; }
  body[data-sheet="alf"] .alf { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 45; background: #00000040; }
  body[data-sheet="side"] .scrim { display: block; }
  .scroll { padding-bottom: 150px; }
  .bubbles { position: fixed; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 30; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  body[data-sheet] .bubbles { display: none; }
  .bubbles button { pointer-events: auto; height: 46px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 999px; background: var(--raise); box-shadow: var(--shadow), inset 0 0 0 1px var(--line-soft); font-size: .875rem; font-weight: 550; }
  .bubbles .round { width: 50px; height: 50px; padding: 0; justify-content: center; }
  .bubbles .fig { width: 30px; height: 30px; }
  #float { left: 12px !important; right: 12px; top: auto !important; bottom: calc(76px + env(safe-area-inset-bottom)); display: flex; justify-content: center; }
  #toast { bottom: calc(76px + env(safe-area-inset-bottom)); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ── Selecting in the reader ── */
function showPop() {
  const el = $("float"), pop = S.pop;
  el.hidden = !pop;
  if (!pop) { el.innerHTML = ""; return; }
  if (pop.mode === "bar") el.innerHTML = `<div class="selbar" role="toolbar" aria-label="${t("对选中的字", "For the selection")}">${[["explain", t("解释", "Explain")], ["example", t("举例", "Example")], ["quiz", t("考我", "Quiz me")], ["keep", t("记下", "Keep")]].map(([a, name]) => `<button data-a="sel" data-id="${a}">${name}</button>`).join("")}</div>`;
  else el.innerHTML = `<div class="ans" role="dialog" aria-label="Alfred"><q>${esc(pop.text)}</q><p id="anstext"></p>
      <div class="acts"><button class="btn" data-a="sel" data-id="keep-answer">${t("记下", "Keep")}</button><button class="btn" data-a="sel" data-id="quiz">${t("考我", "Quiz me")}</button><button class="btn" data-a="sel" data-id="more">${t("接着问", "Ask more")}</button></div></div>`;
  if (!phone()) {
    const box = el.getBoundingClientRect(), r = pop.rect;
    const left = Math.max(12, Math.min(r.left + r.width / 2 - box.width / 2, innerWidth - box.width - 12));
    const below = r.bottom + 8 + box.height < innerHeight - 12;
    el.style.left = `${left}px`; el.style.top = `${below ? r.bottom + 8 : Math.max(12, r.top - box.height - 8)}px`;
  }
  if (pop.mode === "answer") typeOut($("anstext"), tr(pop.entry[pop.kind]));
}
let typing = 0;
function typeOut(el, text) {
  const run = ++typing;
  if (reduced) { el.textContent = text; return; }
  const chars = [...text], step = Math.max(1, Math.round(chars.length / 60));
  let i = 0;
  const tick = () => { if (run !== typing || !el.isConnected) return; i = Math.min(chars.length, i + step); el.textContent = chars.slice(0, i).join(""); if (i < chars.length) setTimeout(tick, 22); };
  tick();
}
function readSelection() {
  if (S.view !== "read") return;
  const sel = getSelection(), reader = $("reader");
  if (!sel || sel.isCollapsed || !reader || !reader.contains(sel.anchorNode) || !reader.contains(sel.focusNode)) { if (S.pop?.mode === "bar") { S.pop = null; showPop(); } return; }
  const text = sel.toString().trim().slice(0, 300);
  if (!text) return;
  if (S.pop?.mode === "answer" && S.pop.text === text) return;
  S.pop = { mode: "bar", text, rect: sel.getRangeAt(0).getBoundingClientRect(), entry: GLOSS.find((g) => g.re.test(text)) ?? GLOSS_ELSE };
  showPop();
}
function selAct(act) {
  const pop = S.pop, tp = topic(), part = tp.parts[S.part];
  if (!pop) return;
  part.touched = true;
  if (act === "explain" || act === "example") { S.pop = { ...pop, mode: "answer", kind: act }; return showPop(); }
  if (act === "quiz") {
    const item = { id: `n${Date.now()}`, part: S.part, kind: "card", q: pop.entry.card.q, a: pop.entry.card.a, level: 0, due: 1, right: false, fresh: true };
    tp.items.push(item);
    toast(t(`加了一张练习 · 明天到期`, `Added a card · due tomorrow`), () => { tp.items = tp.items.filter((x) => x !== item); renderSide(); });
  }
  if (act === "keep" || act === "keep-answer") {
    const note = { fresh: true, text: act === "keep" ? pop.text : `${pop.text}：${tr(pop.entry[pop.kind ?? "explain"])}` };
    part.notes.push(note);
    toast(t(`记进「${tr(part.title)}」的笔记`, `Kept in the notes of “${tr(part.title)}”`), () => { part.notes = part.notes.filter((x) => x !== note); });
  }
  if (act === "more") {
    thread("guide").push({ who: "me", sel: pop.text, text: [`这里是什么意思？`, `What does this mean?`], from: [`在「${tr(part.title)} · 讲解」里划的`, `Selected in “${tr(part.title)}”, the explanation`] });
    thread("guide").push({ who: "al", text: [tr(pop.entry.explain) + " 要看一个算到底的例子吗？", tr(pop.entry.explain) + " Want an example worked to the end?"] });
    S.panel = true; if (phone()) S.sheet = "alf";
    renderTop(); renderAlf(); syncBody();
  }
  getSelection()?.removeAllRanges(); S.pop = null; showPop(); renderSide();
}
function demoSelect() {
  if (S.view !== "read" || S.topic !== "la") { S.topic = "la"; S.part = "b4"; S.view = "read"; renderAll(); }
  const want = tr(GLOSS[0].demo), walker = document.createTreeWalker($("reader"), NodeFilter.SHOW_TEXT);
  for (let node; (node = walker.nextNode());) {
    const at = node.data.indexOf(want);
    if (at < 0) continue;
    const range = document.createRange(); range.setStart(node, at); range.setEnd(node, at + want.length);
    node.parentElement.scrollIntoView({ block: "center" });
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    return readSelection();
  }
}

  const scene = (id, name) => `<button data-a="scene" data-id="${id}" aria-pressed="${S.view === id}">${name}</button>`;
  $("proto").innerHTML = `<b>Study</b>${scene("new", t("搭课题", "New"))}${scene("today", t("今天", "Today"))}${scene("overview", t("全貌", "Overview"))}${scene("read", t("读", "Read"))}${scene("practice", t("练", "Practice"))}
    <span class="lab">${t("演", "Play")}</span><button data-a="demo-select">${t("划词", "Select a word")}</button><button data-a="demo-review">${t("每周回看", "Weekly look back")}</button>
    <span class="grow"></span><button data-a="reset">${t("重来", "Reset")}</button><button data-a="lang">${S.lang === "en" ? "中文" : "EN"}</button><button data-a="scheme" aria-label="${t("深浅", "Light or dark")}">◐</button>`;
}
function syncBody() { document.body.dataset.side = S.side ? "on" : "off"; if (S.sheet) document.body.dataset.sheet = S.sheet; else delete document.body.dataset.sheet; }
function renderAll() { S.pop = null; showPop(); syncBody(); renderStrip(); renderTop(); renderSide(); renderPage(); renderAlf(); renderToast(); }

/* ── Doing things ── */
function open(view, extra = {}) { Object.assign(S, { view, menu: null, sheet: null }, extra); renderAll(); $("page").querySelector(".scroll")?.scrollTo(0, 0); }
function startPractice(pid) {
  const due = dueItems(topic()).filter((item) => !pid || item.part === pid);
  open("practice", { queue: due.map((item) => item.id), qi: 0, shown: false, hints: 0, fb: false, retell: "", results: [], finished: false });
}
function grade(g) {
  const tp = topic(), item = tp.items.find((x) => x.id === S.queue[S.qi]);
  item.level = nextLevel(item, g); item.due = LADDER[item.level]; item.right = item.right || g === "good"; delete item.fresh;
  S.results.push({ id: item.id, g });
  Object.assign(S, { qi: S.qi + 1, shown: false, hints: 0, fb: false, retell: "" });
  if (S.qi >= S.queue.length) { S.finished = true; if (tp.week) tp.week.done = Math.min(tp.week.n, tp.week.done + 1); }
  renderAll();
}
function startTopic() {
  const d = S.draft, r = RECIPES[d.recipe], id = `d${Date.now()}`, parts = {}, stages = [];
  DRAFT.maps[d.recipe].filter((stage) => !(stage.hands && d.noHands)).forEach((stage, si) => {
    const ids = [];
    stage.parts.forEach((title, pi) => { if (d.gone.includes(`${tr(stage.name)}/${pi}`)) return; const pid = `${id}-${si}-${pi}`; parts[pid] = { title, mats: [], notes: [] }; ids.push(pid); });
    if (ids.length) stages.push({ name: stage.name, parts: ids });
  });
  parts[stages[0].parts[0]].mats = DRAFT.mats.map((m, i) => ({ ...m, kind: m.kind === "text" ? "pointer" : m.kind, id: `${id}-m${i}` }));
  S.topics[id] = { id, name: DRAFT.name, recipe: d.recipe, last: null, week: d.recipe === "course" ? { n: 3, done: 0 } : null, said: ["从第一块开始", "Start with the first part"],
    goal: { what: DRAFT.what, why: ["还没写", "Not written yet"], done: DRAFT.done[d.done % DRAFT.done.length], by: DRAFT.by, base: DRAFT.base[d.base % DRAFT.base.length], pace: r.pace[d.pace % r.pace.length] }, stages, parts, items: [] };
  S.draft = null; S.sentence = ""; S.topic = id;
  open("today");
  toast(t(`建了文件夹 Alfred Notes/学习/${tr(DRAFT.name)}`, `Made the folder Alfred Notes/Study/${tr(DRAFT.name)}`));
}

document.addEventListener("click", (event) => {
  const el = event.target.closest("[data-a]");
  if (!el) { if (S.menu && !event.target.closest(".menu")) { S.menu = null; renderSide(); if (S.view === "new") renderPage(); } if (S.pop?.mode === "answer" && !event.target.closest("#float")) { S.pop = null; showPop(); } return; }
  const a = el.dataset.a, id = el.dataset.id, tp = topic();
  switch (a) {
    case "scene": if (id === "practice") return startPractice(); if (id === "new") return open("new", { draft: null, sentence: "" }); return open(id, id === "read" || id === "part" ? { topic: "la", part: "b4" } : {});
    case "go": return open(el.dataset.view, el.dataset.view === "new" ? { draft: null, sentence: "" } : {});
    case "topic": return open("today", { topic: id });
    case "part": return open("part", { part: id });
    case "list": return open("list", { list: id });
    case "read": return open("read", { part: el.dataset.part, mat: id });
    case "mat": { const pid = el.dataset.part ?? S.part, m = tp.parts[pid].mats.find((x) => x.id === id); if (m.kind === "text" && id === "m1") return open("read", { part: pid, mat: id }); return toast(m.kind === "pointer" ? t("这份材料在你手上，读完回来练", "This one is in your hands. Read it, then come back to practise") : t("原型里不开外站", "The prototype does not open other sites")); }
    case "practice": return startPractice(el.dataset.part);
    case "show": S.shown = true; return renderPage();
    case "hint": S.hints += 1; return renderPage();
    case "sample": S.retell = tr(tp.items.find((x) => x.id === S.queue[S.qi]).sample); return renderPage();
    case "feedback": S.retell = $("retell").value || tr(tp.items.find((x) => x.id === S.queue[S.qi]).sample); S.fb = true; return renderPage();
    case "grade": return grade(id);
    case "self": tp.parts[id].self = !tp.parts[id].self; renderSide(); renderTop(); return renderPage();
    case "menu": S.menu = S.menu === id ? null : id; renderSide(); if (S.view === "new") renderPage(); return;
    case "side": S.side = !S.side; syncBody(); return renderTop();
    case "panel": if (phone()) { S.sheet = null; } else S.panel = !S.panel; syncBody(); renderTop(); return renderAlf();
    case "sheet": S.sheet = id; if (id === "alf") S.panel = true; syncBody(); return renderAlf();
    case "sheet-close": S.sheet = null; return syncBody();
    case "other": return toast(t("原型里只有学习这一边", "Only the Study side is in this prototype"));
    case "try": S.sentence = tr([DRAFT.sentence, ["弄清 TLS 握手到底发生了什么", "Understand what happens in a TLS handshake"], ["准备 3 月的系统设计面试", "Prepare for a system design interview in March"]][Number(id)]); $("sentence").value = S.sentence; return $("sentence").focus();
    case "guess": S.draft[id] += 1; return renderPage();
    case "recipe": Object.assign(S.draft, { recipe: id, pace: 0, gone: [] }); S.menu = null; renderPage(); return renderAlf();
    case "drop": S.draft.gone.push(id); return renderPage();
    case "discard": return open("new", { draft: null, sentence: "" });
    case "start": return startTopic();
    case "say": return say(tr(tries()[Number(id)]));
    case "sel": return selAct(id);
    case "undo": S.toast?.undo?.(); S.toast = null; renderToast(); renderSide(); if (S.view !== "read") renderPage(); return;
    case "review-yes": {
      const stage = tp.stages[1];
      tp.parts.b8 = { title: ["线性无关", "Linear independence"], line: ["几个向量里，有没有哪个是多余的", "Whether one of a few vectors is redundant"], fresh: true, mats: [], notes: [] };
      stage.parts.splice(stage.parts.indexOf("b5"), 0, "b8"); S.review = false; renderAll();
      return toast(t("加了一块「线性无关」", "Added the part “Linear independence”"), () => { stage.parts = stage.parts.filter((x) => x !== "b8"); delete tp.parts.b8; renderAll(); });
    }
    case "review-no": S.review = false; return renderPage();
    case "demo-select": return demoSelect();
    case "demo-review": S.review = true; return open("today", { topic: "la" });
    case "reset": S = fresh({ lang: S.lang }); return renderAll();
    case "lang": S.lang = S.lang === "en" ? "zh" : "en"; return renderAll();
    case "scheme": { const root = document.documentElement; root.dataset.scheme = root.dataset.scheme === "dark" ? "light" : "dark"; for (const f of Object.values(FIG)) f.fig.setDark(isDark()); return; }
  }
});
document.addEventListener("submit", (event) => {
  event.preventDefault();
  const form = event.target.dataset.form;
  if (form === "new") {
    S.sentence = $("sentence").value.trim() || tr(DRAFT.sentence);
    S.draft = { thinking: true }; thread("planner").push({ who: "me", text: S.sentence });
    renderPage(); renderAlf();
    setTimeout(() => {
      if (!S.draft?.thinking) return;
      S.draft = { recipe: "course", done: 0, base: 0, pace: 0, gone: [], noHands: false };
      thread("planner").push({ who: "al", text: ["起草好了。底子、节奏和「算成」是我猜的，虚线标着。", "Drafted. Where you start, the pace and “done when” are my guesses, marked with dashes."] });
      renderPage(); renderAlf();
    }, reduced ? 0 : 1300);
  }
  if (form === "alf") { const text = $("ask").value.trim(); if (text) say(text); }
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") { S.menu = null; S.pop = null; S.sheet = null; showPop(); syncBody(); renderSide(); if (S.view === "new") renderPage(); }
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing && event.target.matches(".compose textarea")) { event.preventDefault(); event.target.form.requestSubmit(); }
});
$("float").addEventListener("mousedown", (event) => event.preventDefault());
let selTimer = 0;
document.addEventListener("selectionchange", () => { clearTimeout(selTimer); selTimer = setTimeout(readSelection, 220); });
document.addEventListener("mouseup", (event) => { if (!event.target.closest("#float")) { clearTimeout(selTimer); setTimeout(readSelection, 0); } });
addEventListener("resize", () => { if (S.pop) { S.pop = null; showPop(); } });

if (params.has("bare")) document.documentElement.dataset.bare = "";
document.documentElement.dataset.scheme = params.get("scheme") ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
S = fresh();
renderAll();
Object.assign(window, { study: { get state() { return S; }, demoSelect, selAct } });
</script>
</body>
</html>
