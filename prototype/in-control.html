<!doctype html>
<!--
  Zirma: keeping the person in control of what an agent builds. Layout prototype with sample data only; no build step.
  Design: docs/design/in-control.md (v0.3).
  A project keeps track of three things, plus the sessions where work happens (sidebar, or ?scene=session|product|map|decisions):
    会话 session: started from a card; progress lines; a guardrail stops a shortcut and asks; the receipt (effect, decisions, lines, what changed).
    产品 product: the plan you can see and change: who, effort, what not to use; places in a row, feature cards under each;
                  what isn't settled is a gap on the card, not a question in chat. ?fresh shows a new project's first guess (the kickoff).
    地图 map: the code in a few modules named by what they provide, who uses whom, health computed from code, at most three improvements.
    决策 decisions: one tree for the whole project: accepted decisions on the main line, sessions as branches; select one to see what depends on it.
  ?lang=en, ?scheme=dark, ?bare hides the prototype controls. Under 760px it is the phone layout.
  The project, files and names are sample data.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zirma 在控制</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<style>
:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.23, 1, .32, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.6 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--alf); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: .86em; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.grow { flex: 1; min-width: 0; }

/* Shell */
.app { height: 100dvh; display: grid; grid-template-columns: 228px minmax(0, 1fr); }
.side { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; padding: 10px 8px 12px; background: var(--paper); border-right: 1px solid var(--line-soft); }
.lights { display: flex; gap: 8px; padding: 4px 6px 14px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.proj { display: flex; flex-direction: column; gap: 1px; padding: 2px 9px 10px; }
.proj b { font-weight: 600; font-size: 14px; }
.proj span { color: var(--muted); font: 11.5px var(--mono); }
.nav-label { display: flex; align-items: center; padding: 14px 9px 4px; color: var(--muted); font-size: 12px; }
.nav-label button { margin-left: auto; color: var(--muted); font-size: 16px; line-height: 1; }
.nav-item { width: 100%; min-height: 30px; display: flex; align-items: center; gap: 9px; padding: 4px 9px; border-radius: 8px; color: var(--copy); font-size: 13.5px; }
.nav-item:hover { background: var(--wash); }
.nav-item[aria-current="page"] { background: var(--wash); color: var(--ink); font-weight: 500; }
.nav-item .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.nav-item .n { font: 11.5px var(--mono); color: var(--k-text, var(--muted)); white-space: nowrap; }
.nav-sub { display: block; padding: 0 9px 4px 25px; margin-top: -3px; color: var(--k-text, var(--muted)); font-size: 11.5px; }
.dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--k-solid, var(--line)); }
.spacer { flex: 1; min-height: 16px; }
.proto { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-top: 8px; padding: 6px; border-radius: 10px; outline: 1px dashed var(--line); outline-offset: -1px; font-size: 11.5px; }
.proto b { width: 100%; padding: 0 4px 2px; color: var(--muted); font-weight: 500; }
.proto button { height: 24px; padding: 0 8px; border-radius: 7px; color: var(--copy); white-space: nowrap; }
.proto button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
html[data-bare] .proto { display: none; }

.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; container: page / inline-size; }
.top { flex: none; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 8px 24px; border-bottom: 1px solid var(--line-soft); }
.top h1 { flex: 0 1 auto; min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .sum { min-width: 0; color: var(--muted); font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.top .end { margin-left: auto; display: flex; gap: 6px; flex: 0 1 auto; min-width: 0; }
.top .end .scope { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }
.page { max-width: 840px; margin: 0 auto; padding: 22px 24px 48px; display: flex; flex-direction: column; gap: 18px; }
.page.wide { max-width: 1140px; }
.dock { flex: none; padding: 0 24px 16px; display: flex; flex-direction: column; gap: 6px; }
.dock:empty { display: none; }
.dock .reply { max-width: 792px; width: 100%; margin: 0 auto; padding: 0 4px; color: var(--copy); font-size: 13px; }
.composer { max-width: 792px; width: 100%; margin: 0 auto; padding: 8px 10px 8px 12px; border-radius: 16px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.composer .ph { flex: 1; min-width: 140px; }
.mnav { display: none; }

/* Bits */
.btn { min-height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn[disabled] { opacity: .35; cursor: default; }
.btn.ghost { background: none; color: var(--copy); box-shadow: inset 0 0 0 1px var(--line); font-weight: 400; }
.btn.ghost:hover { color: var(--ink); }
.btn.sm { min-height: 26px; padding: 0 10px; font-size: 12px; }
.link { color: var(--alf); font-size: 12.5px; text-align: left; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--alf) 35%, transparent); text-underline-offset: 3px; }
.tag { display: inline-flex; align-items: center; gap: 5px; min-height: 20px; padding: 0 7px; border-radius: 6px; background: var(--k-fill); color: var(--k-text); font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 10px; border-radius: 999px; background: var(--k-fill, var(--wash)); color: var(--k-text, var(--copy)); font-size: 12.5px; white-space: nowrap; }
.chip.off { text-decoration: line-through; opacity: .55; }
.chip.dash { background: none; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.scope { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 10px; border-radius: 8px; background: var(--alf-soft); color: var(--alf); font-size: 12.5px; white-space: nowrap; }
.scope svg { width: 14px; height: 14px; }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--wash); flex-wrap: wrap; }
.seg button { height: 26px; padding: 0 10px; border-radius: 7px; color: var(--copy); font-size: 12.5px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); box-shadow: 0 1px 2px #0002; }
.card { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); min-width: 0; }
.card h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ok { color: var(--ok); }
.warnc { color: var(--warm); }
.badc { color: var(--now); }
.fadein { animation: fadein 300ms var(--ease); }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 9; padding: 8px 14px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 13px; box-shadow: 0 6px 20px #0003; animation: fadein 200ms var(--ease); max-width: calc(100vw - 32px); }
.kv { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--copy); min-width: 0; }
.kv h3 { font-size: 12px; color: var(--muted); font-weight: 500; }
.side-detail { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; }
.side-detail h2 { font-size: 15px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
.empty { padding: 28px; border-radius: 16px; background: var(--paper); color: var(--copy); text-align: center; font-size: 13.5px; }
.lbl { width: 56px; flex: none; color: var(--muted); font-size: 12px; line-height: 22px; }

/* Conversation */
.me { align-self: flex-end; max-width: 86%; padding: 8px 13px; border-radius: 16px 16px 4px 16px; background: var(--wash); }
.me small { display: block; color: var(--muted); font-size: 11.5px; }
.al { display: flex; flex-direction: column; gap: 8px; }
.steps { display: flex; flex-direction: column; gap: 1px; }
.step > button { width: 100%; min-height: 30px; display: flex; align-items: center; gap: 9px; padding: 3px 8px; border-radius: 9px; color: var(--copy); font-size: 13.5px; }
.step > button:hover { background: var(--wash); }
.step .st { flex: none; width: 14px; display: grid; place-items: center; }
.step .st svg { width: 14px; height: 14px; stroke-width: 2.2; }
.step .t { flex: 1; min-width: 0; }
.step .tm { flex: none; color: var(--muted); font: 11.5px var(--mono); }
.step .chev { width: 13px; height: 13px; color: var(--muted); transition: transform 150ms; }
.step[data-open] .chev { transform: rotate(90deg); }
.step[data-state="run"] .t { color: var(--ink); }
.step[data-state="wait"] .t { color: var(--k-text); }
.pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--alf); animation: breathe 1.6s ease-in-out infinite; }
.pulse.warm { background: var(--warm); }
@keyframes breathe { 50% { opacity: .35; transform: scale(.8); } }
.cmds { margin: 2px 0 6px 31px; padding: 6px 0 6px 12px; border-left: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 3px; font: 12px/1.5 var(--mono); color: var(--copy); }
.cmds div { overflow-wrap: anywhere; }
.ask { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--raise); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warm) 55%, var(--line)); }
.ask .why { color: var(--copy); font-size: 13px; }
.ask .why b { font-weight: 600; color: var(--ink); }
.opt { width: 100%; display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; border-radius: 11px; box-shadow: inset 0 0 0 1px var(--line); text-align: left; font-size: 13px; }
.opt:hover:not([disabled]) { background: var(--wash); }
.opt[disabled] { cursor: default; opacity: .55; }
.opt[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--alf); background: var(--alf-soft); }
.opt .k { flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--wash); font: 12px var(--mono); }
.opt .what { flex: 1; min-width: 0; }
.opt .what small { display: block; color: var(--muted); font-size: 12px; }

/* Receipt */
.receipt { display: flex; flex-direction: column; border-radius: 16px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); overflow: hidden; }
.receipt > section { padding: 12px 16px; border-top: 1px solid var(--line-soft); display: flex; gap: 10px; }
.receipt > section:first-child { border-top: 0; display: block; }
.r-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.r-head h2 { font-size: 15px; font-weight: 600; }
.ev { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.shot { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--muted); }
.mini { width: 132px; padding: 7px; border-radius: 8px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-soft); display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.mini::before { content: ""; grid-column: 1 / -1; height: 6px; width: 46%; border-radius: 2px; background: var(--line); margin-bottom: 2px; }
.mini i { aspect-ratio: 4/3; border-radius: 2px; background: var(--line); }
.mini i.new { background: color-mix(in srgb, var(--alf) 45%, var(--line)); }
.dec { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; }
.dec + .dec { border-top: 1px dashed var(--line-soft); }
.dec .tag { margin-top: 1px; }
.dec .what { flex: 1; min-width: 0; font-size: 13.5px; }
.dec .what small { display: block; color: var(--muted); font-size: 12px; }
.checks { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--copy); }
.checks div { display: flex; align-items: flex-start; gap: 8px; }
.checks svg { width: 14px; height: 14px; margin-top: 4px; stroke-width: 2.2; flex: none; }
.r-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; background: var(--paper); border-top: 1px solid var(--line-soft); }

/* Product */
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-radius: 14px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); }
.strip > div { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-left: 1px solid var(--line-soft); min-width: 0; font-size: 13px; color: var(--copy); }
.strip > div:first-child { border-left: 0; }
.strip h3 { font-size: 12px; color: var(--muted); font-weight: 500; }
.strip .note { color: var(--muted); font-size: 12px; }
.story { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.colh { position: relative; display: flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 10px; border-radius: 10px; background: var(--paper); font-size: 13px; font-weight: 600; }
.colh small { color: var(--muted); font-weight: 400; font-size: 11.5px; margin-left: auto; white-space: nowrap; }
.col:not(:last-child) .colh::after { content: "→"; position: absolute; z-index: 1; right: -6px; top: 50%; transform: translate(50%, -50%); color: var(--muted); font-weight: 400; font-size: 12px; }
.col.plan .colh { background: none; outline: 1.5px dashed var(--line); outline-offset: -1.5px; }
.colh.off span { text-decoration: line-through; opacity: .55; }
.fcard { width: 100%; display: flex; flex-direction: column; gap: 6px; padding: 9px 11px; border-radius: 11px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); text-align: left; font-size: 13px; color: var(--ink); }
.fcard:hover { box-shadow: inset 0 0 0 1px var(--muted); }
.fcard[data-st="idea"] { background: none; box-shadow: none; outline: 1.5px dashed var(--line); outline-offset: -1.5px; }
.fcard[data-st="decided"] { box-shadow: inset 3px 0 0 var(--alf), inset 0 0 0 1px var(--line); }
.fcard[data-st="problem"] { box-shadow: inset 3px 0 0 var(--now), inset 0 0 0 1px var(--line); }
.fcard[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.fcard.new { animation: fadein 400ms var(--ease); }
.fcard .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--muted); font-size: 11.5px; }
.fcard .meta svg { width: 12px; height: 12px; stroke-width: 2.2; }
.gap { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 12px; background: var(--paper); }
.gap > b { font-size: 13px; font-weight: 600; color: var(--ink); }
.gap .opt { background: var(--raise); }
.stores { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 4px; }
.store { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 9px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); font-size: 12.5px; }
.store.plan { background: none; box-shadow: none; outline: 1.5px dashed var(--line); outline-offset: -1.5px; color: var(--muted); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--alf-soft); color: var(--copy); font-size: 13px; }
.banner svg { color: var(--alf); margin-top: 3px; }
.banner.warm { background: color-mix(in srgb, var(--warm) 12%, transparent); }
.banner.warm svg { color: var(--warm); }

/* Map */
.improve { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.imp { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 14px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-soft); font-size: 13px; color: var(--copy); min-width: 0; }
.imp b { color: var(--ink); font-size: 13.5px; font-weight: 600; }
.imp .meta { color: var(--muted); font-size: 12px; }
.graph { position: relative; padding: 20px; border-radius: 16px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-soft); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.mgrid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px 30px; }
.edges { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: visible; }
.edges line { stroke: var(--muted); stroke-width: 1.4; }
.edges line.plan { stroke-dasharray: 5 4; stroke: var(--line); }
.mod { position: relative; display: flex; flex-direction: column; gap: 3px; padding: 10px 11px; border-radius: 12px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); text-align: left; min-width: 0; }
.mod b { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; }
.mod small { color: var(--copy); font-size: 12px; line-height: 1.45; }
.mod .h { font-size: 11.5px; color: var(--k-text, var(--muted)); }
.mod.plan { background: none; box-shadow: none; outline: 1.5px dashed var(--line); outline-offset: -1.5px; }
.mod.fresh { box-shadow: inset 0 0 0 1.5px var(--alf); background: var(--raise); outline: none; }
.mod[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.hd { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--k-solid, var(--line)); }
.orphans { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 14px; border-top: 1px dashed var(--line); }
.orphans .lbl { width: auto; margin-right: 2px; }
.orphan { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 0 12px; border-radius: 9px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); font-size: 12.5px; }
.orphan[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.hrows { display: flex; flex-direction: column; gap: 3px; }
.hrows div { display: flex; gap: 8px; font-size: 12.5px; color: var(--copy); }
.hrows div > span:first-child { flex: none; width: 52px; color: var(--muted); }
.hrows .hd { margin-top: 6px; }
.paths { font: 12px/1.6 var(--mono); color: var(--copy); }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }

/* Decisions */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.filters .chip { cursor: pointer; }
.filters .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tl { position: relative; display: flex; flex-direction: column; gap: 2px; }
.tl::before { content: ""; position: absolute; left: 13px; top: 14px; bottom: 20px; width: 2px; border-radius: 1px; background: var(--muted); opacity: .55; }
.lane.m::before { display: none; }
.lane { position: relative; display: flex; flex-direction: column; gap: 2px; --lane: var(--muted); }
.lane::before { content: ""; position: absolute; left: 13px; top: 14px; bottom: 14px; width: 2px; border-radius: 1px; background: var(--lane); opacity: .55; }
.lane.old::before { background: repeating-linear-gradient(var(--lane) 0 4px, transparent 4px 8px); }
.lane.a { --lane: var(--warm); }
.lane.b { --lane: var(--alf); }
.branch { margin-left: 22px; display: flex; flex-direction: column; gap: 2px; }
.bh { --lane: var(--warm); position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 8px 9px 2px 30px; font-size: 12px; color: var(--muted); }
.bh::before { content: ""; position: absolute; left: -8px; top: 12px; width: 21px; height: calc(100% + 4px); border-top: 2px solid color-mix(in srgb, var(--lane) 55%, transparent); border-right: 2px solid color-mix(in srgb, var(--lane) 55%, transparent); border-top-right-radius: 10px; }
.bh b { color: var(--ink); font-weight: 600; font-size: 12.5px; }
.node { position: relative; width: 100%; display: flex; align-items: flex-start; gap: 8px; padding: 6px 9px 6px 32px; border-radius: 10px; text-align: left; font-size: 13.5px; color: var(--ink); }
.node::before { content: ""; position: absolute; left: 8px; top: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--bg); box-shadow: 0 0 0 2px var(--lane); }
.node:hover { background: var(--wash); }
.node[aria-current="true"] { background: var(--wash); box-shadow: inset 0 0 0 1.5px var(--ink); }
.node.hit { background: var(--alf-soft); }
.node.dim { opacity: .35; }
.node .tag { margin-top: 1px; }
.node .what { flex: 1; min-width: 0; }
.node .what small { display: block; color: var(--muted); font-size: 11.5px; }
.node.old .what > span { text-decoration: line-through; text-decoration-color: var(--line); color: var(--muted); }
.optl { display: flex; flex-direction: column; gap: 6px; }
.optl div { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--copy); }
.optl div.on { color: var(--ink); }
.optl svg { width: 14px; height: 14px; margin-top: 4px; stroke-width: 2.2; flex: none; }
.optl small { display: block; color: var(--muted); font-size: 12px; }
.rewind { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: var(--paper); font-size: 13px; }
.impact { padding: 10px 12px; border-radius: 12px; background: var(--alf-soft); color: var(--copy); font-size: 13px; }

/* Narrow page column */
@container page (max-width: 940px) {
  .two { grid-template-columns: minmax(0, 1fr); }
  .side-detail { position: static; }
  .story { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .col:nth-child(2n) .colh::after { display: none; }
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .strip > div:nth-child(3) { border-left: 0; }
  .strip > div:nth-child(n+3) { border-top: 1px solid var(--line-soft); }
  .improve { grid-template-columns: minmax(0, 1fr); }
}
@container page (max-width: 640px) {
  .page { padding: 16px 16px 40px; }
  .top { padding: 8px 16px; }
  .top .sum { display: none; }
  .dock { padding: 0 16px 12px; }
  .story { grid-template-columns: minmax(0, 1fr); }
  .col .colh::after { display: none; }
  .strip { grid-template-columns: minmax(0, 1fr); }
  .strip > div { border-left: 0 !important; }
  .strip > div + div { border-top: 1px solid var(--line-soft); }
  .mgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 18px; }
  .graph { padding: 14px; }
  .receipt > section { flex-wrap: wrap; }
  .lbl { width: 100%; line-height: 1.4; }
  .branch { margin-left: 12px; }
  .me { max-width: 92%; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .mnav { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line-soft); background: var(--paper); }

  .mnav .p { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px; }
  html[data-bare] .mnav .p { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

const cardSt = (id) => {
  const c = CARDS[id];
  if (id === "c3" && S.accepted) return "done";
  if (c.gaps && S.settled[id]) return "decided";
  return c.st;
};
const nodeChosen = (id) => (S.rewound[id] != null ? S.rewound[id] : id === "a2" ? (S.choice === "none" ? 2 : 1) : CHOSEN[id]);
const nodeText = (id) => {
  const n = NODES[id];
  if (!n.opts.length) return T(n.t);
  const c = nodeChosen(id);
  if (c === CHOSEN[id] && !(id === "a2" && S.choice === "none")) return T(n.t);
  return L(n.opts[c][0], n.opts[c][1]);
};
const showA3 = () => S.choice === "sharp" && S.rewound.a2 !== 2;
const nodeVisible = (id) => id !== "a3" || showA3();
const allNodes = () => [...MAIN, ...BR_A, ...BR_B].filter(nodeVisible);
const dependents = (id) => {
  const out = new Set(); let grew = true;
  while (grew) { grew = false; for (const x of allNodes()) if (!out.has(x) && NODES[x].after.some((a) => a === id || out.has(a))) { out.add(x); grew = true; } }
  return [...out];
};
const isMain = (id) => MAIN.includes(id) || (S.accepted && BR_A.includes(id));

function stepHTML(st, i) {
  let state = "done";
  if (S.play !== null) state = i < S.play ? "done" : i === S.play ? (S.waiting ? "wait" : "run") : "todo";
  if (state === "todo") return "";
  const done = st.out ? st.done[S.choice] : st.done;
  const text = state === "run" ? T(st.run) : state === "wait" ? T(st.wait) : T(done);
  const mark = state === "done" ? `<span class="st ok">${ic("check")}</span>` : `<span class="st"><span class="pulse ${state === "wait" ? "warm" : ""}"></span></span>`;
  const cmds = st.out ? (state === "done" ? st.cmds[S.choice] : ["write scripts/resize.py   ← " + L("被拦下", "stopped")]) : st.cmds;
  return `<li class="step" data-state="${state}" ${state === "wait" ? 'data-k="warm"' : ""} ${S.open[i] ? "data-open" : ""}>
    <button data-step="${i}" aria-expanded="${!!S.open[i]}">${mark}<span class="t">${esc(text)}</span>${state === "done" ? `<span class="tm">${st.tm}</span>` : ""}${ic("chev", "i chev")}</button>
    ${S.open[i] ? `<div class="cmds">${cmds.map((c) => `<div>$ ${esc(c)}</div>`).join("")}</div>` : ""}</li>`;
}

function fcardHTML(id) {

  return `<button class="fcard ${c.added && S.justAdded ? "new" : ""}" data-card="${id}" data-st="${st}" aria-pressed="${S.card === id}">${T(c.t)}<span class="meta">${meta}</span></button>`;
}
function cardDetail() {
  const id = S.card, c = CARDS[id]; if (!c) return "";

  const gaps = (c.gaps || []).map((g) => {
    const G = GAPS[g]; const pick = S.gap[g] != null ? S.gap[g] : G.guess;
    return `<div class="gap"><b>${T(G.q)}</b>${G.opts.map((o, i) => `<button class="opt" data-gap="${g}" data-gi="${i}" aria-pressed="${!S.settled[id] && i === pick}" ${o[4] === "blocked" ? "disabled" : ""}><span class="what">${esc(L(o[0], o[1]))}${i === G.guess && S.gap[g] == null ? ` <span class="tag" data-k="warm">${L("我猜的", "My guess")}</span>` : ""}<small class="${o[4] === "blocked" ? "badc" : ""}">${esc(L(o[2], o[3]))}</small></span></button>`).join("")}</div>`;
  }).join("");
  const settledLine = c.gaps && S.settled[id] ? `<div class="kv"><h3>${L("定下的", "Settled")}</h3>${c.gaps.map((g) => `<span>${esc(T(GAPS[g].q))}：${esc(L(...GAPS[g].opts[S.gap[g] != null ? S.gap[g] : GAPS[g].guess].slice(0, 2)))}</span>`).join("")}</div>` : "";
  const action = st === "idea" ? `<button class="btn" data-settle="${id}">${L("就这样定", "Settle it")}</button><span class="small muted">${L("没点的按我猜的", "Untouched gaps use my guess")}</span>`
    : st === "decided" ? `<button class="btn" data-do="${id}">${L("做这个", "Do this")}</button>`
    : st === "doing" ? `<button class="btn ghost" data-go="${c.task === "A" ? "session" : "decisions"}" data-node="b1">${L(`看会话 ${c.task}`, `Open session ${c.task}`)}</button>`
    : st === "problem" ? `<button class="btn" data-do="${id}">${L("修它", "Fix it")}</button><button class="link" data-go="map" data-mod="pages">${L("在地图上看", "See it on the map")}</button>`
    : `<button class="btn ghost" data-change="${id}">${L("改它", "Change it")}</button>`;
  return `<div class="card side-detail">
    <div class="acts"><span class="tag" data-k="${s[1]}">${T(s[0])}</span><span class="small muted">${T(place[1])}</span></div>
    <h2>${T(c.t)}</h2>
    <p style="font-size:13px;color:var(--copy)">${T(c.s)}</p>
    ${gaps && !S.settled[id] ? `<div class="kv"><h3>${L("没想清的，点一下就行", "Not settled yet: just pick")}</h3></div>${gaps}` : settledLine}
    <div class="kv"><h3>${L("实现它的模块", "Modules behind it")}</h3><div class="chips">${c.mods.map((m) => `<button class="chip" data-go="map" data-mod="${m}">${modName(m)}${MODS[m].h === "plan" ? " · " + L("还没有", "not yet") : ""}</button>`).join("")}</div></div>
    <div class="kv"><h3>${L("为它做的决定", "Decisions for it")}</h3>${c.decs.length ? c.decs.filter(nodeVisible).map((d) => `<button class="link" data-go="decisions" data-node="${d}">${esc(nodeText(d))}</button>`).join("") : `<span class="muted">${st === "idea" || st === "decided" ? L("还没开始，开始后会记在这里", "Not started; they'll show here") : L("没有要紧的", "None worth noting")}</span>`}</div>
    <div class="acts">${action}</div>
  </div>`;
}

  return `<button class="mod ${cls}" data-mod="${id}" aria-pressed="${S.mod === id}" data-w="${m.w}" data-n="${m.n}">
    <b><span class="hd" data-k="${H[2]}"></span>${T(m.name)}</b><small>${T(m.job)}</small><span class="h" data-k="${H[2]}">${hl}</span></button>`;
}
function modDetail() {
  const id = S.mod, m = MODS[id];
  const h = id === "images" && S.accepted ? "ok" : m.h; const H = HEALTH[h];
  const usedBy = Object.keys(MODS).filter((x) => MODS[x].uses.includes(id));

function drawEdges() {
  const g = document.getElementById("graph"), svg = document.getElementById("edges"), grid = document.getElementById("mgrid");
  if (!g || !svg || !grid) return;
  const narrow = grid.getBoundingClientRect().width < 500;
  grid.querySelectorAll(".mod").forEach((b) => { const [c, r] = (narrow ? b.dataset.n : b.dataset.w).split(","); b.style.gridColumn = c; b.style.gridRow = r; });
  const base = g.getBoundingClientRect();
  const box = (id) => { const r = grid.querySelector(`[data-mod="${id}"]`).getBoundingClientRect(); return { x: r.left - base.left + r.width / 2, y: r.top - base.top + r.height / 2, w: r.width / 2 + 5, h: r.height / 2 + 5 }; };
  const clip = (a, b) => { const dx = b.x - a.x, dy = b.y - a.y; const t = Math.min(a.w / Math.abs(dx || 1e-6), a.h / Math.abs(dy || 1e-6)); return { x: a.x + dx * t, y: a.y + dy * t }; };
  svg.querySelectorAll("line").forEach((l) => l.remove());
  for (const [f, m] of Object.entries(MODS)) for (const to of m.uses) {
    if (m.orphan) continue;
    const a = box(f), b = box(to), p = clip(a, b), q2 = clip(b, a);
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", p.x); l.setAttribute("y1", p.y); l.setAttribute("x2", q2.x); l.setAttribute("y2", q2.y);
    const plan = MODS[to].h === "plan" || ((to === "images" || f === "images") && !S.accepted);
    if (plan) l.setAttribute("class", "plan");
    l.setAttribute("marker-end", "url(#ar)");
    svg.appendChild(l);
  }
}

/* ── Replay the session ── */
let timer;
function replay() { clearTimeout(timer); Object.assign(S, { scene: "session", fresh: false, play: 0, waiting: false, accepted: false, open: {}, answered: false, realigned: false, rewound: {} }); render(); tick(); }
function tick() {
  timer = setTimeout(() => {
    if (S.play === null) return;
    if (STEPS[S.play].out && !S.answered) { S.waiting = true; render(); return; }
    S.play++; S.answered = false;
    if (S.play >= STEPS.length) S.play = null;
    render(); if (S.play !== null) tick();
  }, 1000);
}

/* ── Events ── */
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.lang) { S.lang = d.lang; return render(); }
  if (d.scheme) { S.scheme = d.scheme; return render(); }
  if ("replay" in d) return replay();
  if ("fresh" in d) { S.fresh = !S.fresh; S.scene = "product"; return render(); }
  if (d.node) { S.sel = d.node; S.confirm = null; }
  if (d.card) S.card = d.card;
  if (d.mod) S.mod = d.mod;
  if (d.go) return go(d.go);
  if (d.node || d.card || d.mod) return render();
  if ("newsession" in d) return toast(L("新会话从哪里开始都行：一张卡、一个模块，或者直接说", "Start a session anywhere: a card, a module, or just say it"));
  // session
  if (d.step) { S.open[d.step] = !S.open[d.step]; return render(); }
  if (d.choose) { S.choice = d.choose; S.waiting = false; S.answered = true; render(); return tick(); }
  if ("accept" in d) { S.accepted = true; render(); return toast(L("已合并：卡做好了，B 要重新对齐", "Merged: the card is done; B needs re-aligning")); }

  if (d.change) return toast(L("改一张做好的卡会开一个任务，先列出会碰到的模块", "Changing a done card opens a task that lists the modules first"));
  // map
  if (d.imp) { const i = IMPROVE.find((x) => x.id === d.imp); return toast(L(`会开一个会话「${T(i.t)}」，范围：${modName(i.mod)}`, `Would open “${T(i.t)}”, scoped to ${modName(i.mod)}`)); }
  if (d.drop) { S.dropped[d.drop] = true; render(); return toast(L("不做。三个月内不再提。", "Skipped. Won't come back for three months.")); }
  if (d.probe) return toast(L(`会开一个范围是「${modName(d.probe)}」的会话，先带上它的说明、健康和最近的决定`, `Would open a session scoped to “${modName(d.probe)}”, starting with its description, health and recent decisions`));
  if ("rewrite" in d) { S.rewrote = true; render(); return toast(L("重写了一句话说明，等你确认", "Rewrote the one-line description; confirm it")); }

  if (d.filter) { S.filter = d.filter; return render(); }
  if ("confirm" in d) { S.confirm = S.sel; return render(); }
  if (d.rewind) { S.rewound[S.sel] = +d.rewind; S.confirm = null; render(); return toast(L("开了一条新分支，正在重做；旧的留着", "Opened a new branch and redoing; the old one stays")); }
  if ("newtask" in d) return toast(L("原型里不真的开：会开一个改这个决定的任务，先列出牵动的决定和模块", "Not in the prototype: it would open a task that lists what's affected first"));
  if ("realign" in d) { S.realigned = true; render(); return toast(L("重新对齐了 1 步", "Re-aligned 1 step")); }
});
let rz; addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(drawEdges); });
render();
</script>
</body>
</html>
